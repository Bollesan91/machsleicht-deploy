"use strict";
/* =====================================================================
   RITTER-KOMPLETTPAKET — Motto-Schicht.
   Geteilte Logik (Laden, QR, Vorleser, Zeitplan-Rechnung, Gast-Abgleich)
   liegt in /paket/core/paket-core.js. Hier steht nur, was Ritter ausmacht.
   Datenquellen:
   - party.machsleicht.de/api/party/<id>?edit=<token>  (Kind, Datum, Gaeste, Wuensche, gameId)
   - /data/motto/ritter-<klein|mittel|gross>.json     (Programm, Spiele, Einkauf, Kuchen, SOS)
   ===================================================================== */

/* ---------- Motto-Vertrag (siehe /paket/core/paket-core.js) ---------- */
window.PAKET_CFG = {
  id:        'ritter',
  dataLabel: 'Ritter-Daten',
  qrDark:    '#1B3A5C',
  /* Rollen — EXAKT der ROLE_CATALOG der Partyseite (party-worker.js), inkl. Mission. */
  roles: {
    bannertraeger:   {n:'Banner-Träger',       m:'Du trägst das Banner beim großen Einzug voran.'},
    burgtorwaechter: {n:'Burgtor-Wächter',     m:'Nur wer das Losungswort kennt, kommt an dir vorbei.'},
    katapultmeister: {n:'Katapult-Meister',    m:'Du spannst das Katapult für den großen Schuss.'},
    knappenchef:     {n:'Knappen-Chef',        m:'Du hilfst allen Rittern in die Rüstung.'},
    drachenspaeher:  {n:'Drachen-Späher',      m:'Du hältst Ausschau — wenn der Drache kommt, warnst du alle!'},
    ehrengast:       {n:'Ehrengast',           m:'Du gehörst zum engsten Party-Team!'},
    spielescout:     {n:'Spiele-Scout',        m:'Du probierst jedes Spiel als Erstes aus.'},
    stimmungsmacher: {n:'Stimmungs-Macher',    m:'Mit dir wird es garantiert nicht langweilig.'},
    deckungshelfer:  {n:'Überraschungs-Helfer', m:'Du hilfst bei der großen Überraschung mit.'},
    jubelchef:       {n:'Jubel-Chef',          m:'Beim Finale jubelst du am lautesten.'}
  },
  /* 06.08.: Dieser Block fehlte als einziges der sechs Mottos komplett. Ohne ihn
     faellt der Kern auf seine motto-neutralen Defaults zurueck ('Ankommen &
     Aufnahme', 'Kuchen & Snacks') — der Ablaufplan war an keiner Zeile Ritter,
     und ritualSub blieb leer, weshalb der Name des Signatur-Rituals im ganzen
     Zeitplan nicht vorkam. */
  timeline: {
    ritualTit:       'Ankunft & Knappen-Aufnahme',
    ritualFallback:  'Knappen-Aufnahme',
    ritualSub:       r => 'Ankommen, Wappenrock & Knappen-Heft, Burg-Foto vor der Kulisse ('+r+').',
    essenTit:        'Burgküche: Kuchen & Ritter-Vorrat',
    essenSub:        'Pause am Tisch — Menü und Mengen stehen in Teil II.',
    essenKompaktTit: 'Burgküche: Kuchen & Ritter-Vorrat (kompakt)',
    essenKompaktSub: 'Kurzes Fenster — Kuchen zuerst, Snacks nebenher.',
    spielSub:        'Anleitung auf der Spielkarte in Teil III.',
    freiTit:         'Freies Toben im Burghof',
    freiSub:         'Auslauf für alle — Mitgebsel stehen bereit.',
    uebergabeTit:    'Ritterschlag & Urkunden',
    uebergabeSub:    'Urkunden aus Teil IV verleihen, Mitgebsel verteilen.',
    endeTit:         'Burgtor zu — Abholung',
    endeSub:         'Abhol-Infos je Kind stehen in der Gästeübersicht (Teil IV).'
  }
};

/* ---------- Kern-Kurzformen ----------
   PARTY/DATA/SCHATZ sind LIVE-Getter — boot() setzt sie erst nach dem Laden. */
const _C = PaketCore;
const esc=_C.esc, esclink=_C.esclink,
      poss=_C.poss, fmtDate=_C.fmtDate, parseHM=_C.parseHM, fmtHM=_C.fmtHM,
      stripEmojiLabel=_C.stripEmojiLabel, ageGroup=_C.ageGroup, gruppeVonParty=_C.gruppeVonParty, qrBlock=_C.qrBlock,
      stationUrl=_C.stationUrl, guestUrl=_C.guestUrl, speak=_C.speak, variant=_C.variant,
      confirmedGuests=_C.confirmedGuests, roleLabel=_C.roleLabel, roleMission=_C.roleMission,
      splitInvites=_C.splitInvites, buildTimeline=_C.buildTimeline, parseDur=_C.parseDur;
Object.defineProperties(window, {
  PARTY:    {get:()=>_C.party()},
  DATA:     {get:()=>_C.data()},
  SCHATZ:   {get:()=>_C.schatz()},
  HASTOKEN: {get:()=>_C.hasToken()},
  PARTYURL: {get:()=>_C.partyUrl()}
});

/* Kurz-Metadaten des gewaehlten Einladungs-Spiels (Teilmenge GAME_META, ritter) */
const GAME_META_P = {
  "ritter-klassik":{t:"Der Klassiker",s:"Einfaches Tipp-Spiel — antippen, knacken, Überraschung. Perfekt schon für die Kleinsten.",e:"✨"},
  "kanone-ritter":{t:"Kanonen-Schuss",s:"Die Schatzkarte ist hinter dicken Brettern vernagelt!",e:"💣"},
  "flaschenpost-ritter":{t:"Flaschenpost",s:"In der Flasche steckt eine geheime Nachricht.",e:"🍾"},
  "memory-ritter":{t:"Schatz-Memory",s:"Hinter den Schatzkarten versteckt sich jemand.",e:"🗺"},
  "ritter-schatzjagd":{t:"Die Schatzjagd",s:"9 Felder aufdecken, den Dieb schnappen — Foto-Finale!",e:"🪙"}
};

/* ---------- Demo-Daten (fuer ?demo=1 / Review) ---------- */
/* window.-Zuweisung ist PFLICHT, nicht Geschmack: `const` im klassischen Skript legt eine
   lexikalische Bindung an, KEINE window-Eigenschaft — boot() im Kern findet die Demo-Daten
   sonst nicht und rendert ein Paket ohne Namen und Datum (beim Migrations-Diff gefangen). */
window.DEMO_PARTY = {
  childName:"Tino", age:"8", motto:"Ritter", mottoId:"ritter", mottoEmoji:"⚔️",
  ageGroup:"6-8", ambition:"standard",
  date:"2026-09-12", time:"14:00", endTime:"17:00", address:"Burgweg 7, 21075 Hamburg",
  gameId:"ritter-klassik",
  guests:[
    {name:"Emma", status:"ja", allergies:"Erdnüsse", pickupPerson:"Papa Jens", pickupTime:"17:00"},
    {name:"Mats", status:"ja", allergies:"", pickupPerson:"", pickupTime:""},
    {name:"Lina", status:"ja", allergies:"Laktose", pickupPerson:"Oma Ruth", pickupTime:"16:30"},
    {name:"Noah", status:"ja", allergies:"", pickupPerson:"", pickupTime:""},
    {name:"Ida",  status:"ja", allergies:"", pickupPerson:"", pickupTime:""},
    {name:"Ben",  status:"nein", allergies:"", pickupPerson:"", pickupTime:""}
  ],
  invites:[
    {n:"Emma", role:"bannertraeger",   t:"demotokenemma01"},
    {n:"Mats", role:"burgtorwaechter", t:"demotokenmats01"},
    {n:"Lina", role:"katapultmeister", t:"demotokenlina01"},
    {n:"Noah", role:"knappenchef",     t:"demotokennoah01"},
    {n:"Ida",  role:"drachenspaeher",  t:"demotokenida001"},
    {n:"Ben",  role:"bannertraeger",   t:"demotokenben001"}
  ]
};

/* Wach-Beiname je Gast — deterministisch aus dem Namen (stabil ueber Reloads).
   Substantive statt Titel: funktioniert fuer jedes Kind und braucht keine Rangordnung. */
var EPITHETS=['Löwenherz','Schildwacht','Drachenmut','Sturmklinge',
  'Turmfalke','Eisenfaust','Wappenhüter','Zinnenspäher',
  'Bannerträger','Funkenschlag','Nachtwache','Silberhelm'];
function ritterName(n){ n=String(n||'').trim(); if(!n) return ''; var h=0; for(var i=0;i<n.length;i++) h=(h*31+n.charCodeAt(i))>>>0; return EPITHETS[h%EPITHETS.length]; }

/* ---------- Blatt-Gerueste ---------- */
function sheet(inner, cls){ return '<section class="sheet '+(cls||'')+'">'+inner+'</section>'; }
function foot(pageLabel){
  const nm = (PARTY.childName||'').trim();
  return '<div class="sheetfoot"><span class="mk">machsleicht.de</span><span>'+esc(nm?poss(nm)+' Ritter-Party':'Ritter-Party')+' · '+esc(pageLabel)+'</span></div>';
}
/* Wortschicht je Altersgruppe. Das Paket rendert EINE Wortschicht, die Daten
   liegen je Gruppe vor — und vier der fuenf Mottos benennen dieselbe Sache in
   klein/mittel/gross verschieden. Wo das Manifest hier Woerter hinterlegt,
   nimmt W() die der geladenen Gruppe; sonst bleibt es leer und die Slots
   arbeiten wie bisher mit festem Text. */
var WORTE = {"klein": {"gruppe": "Ritterbande", "held": "unser Ritterkind"}, "mittel": {"gruppe": "Knappenschar", "held": "unser Ritterkind"}, "gross": {"gruppe": "Ritterrunde", "held": "unser Ritterkind"}};
function W(){ return (WORTE && WORTE[PaketCore.gruppeVonParty(PaketCore.party())]) || {}; }
/* Gruppenwort und Heldenwort je Altersgruppe. Die Fallback-Kette faellt auf
   'mittel' zurueck, damit ein unbekannter Gruppenschluessel nie leer druckt. */
function G(){ return W().gruppe || (WORTE.mittel&&WORTE.mittel.gruppe) || 'Gruppe'; }
function H(){ return W().held   || (WORTE.mittel&&WORTE.mittel.held)   || ''; }

/* Allergien und Abholzeiten liegen im Party-Objekt und standen bis zum 06.08.
   AUSSCHLIESSLICH auf dem Kuechen-Zettel. Der Gutachter fasste es zusammen:
   "der Hinweis haengt in der Kueche, ausgegeben wird am Spieltisch". Die drei
   Helfer bringen dieselben Daten dorthin, wo am Partytag hingeschaut wird —
   Menue, Kuchen, Ablaufplan, Handzettel. Kein neues Datum, nur ein zweiter Ort.
   Im oeffentlichen Modus ist PARTY.guests gestrippt: alle drei liefern dann ''
   und aendern kein Blatt. */
/* Eine Angabe wie "keine"/"nein"/"-" ist eine Entwarnung, keine Meldung —
   dieselbe Liste nutzen Zeile UND Tausch-Block, damit beide einer Meinung sind. */
const ALLERGIE_NEGATION = /^(kein(e[rs]?)?( allergien| bekannt)?|nein|nichts|nix|ohne|[kn]\.?\s?a\.?|n\/a|[-–—.\/]+)[.!]*$/i;
function allergieZeile(){
  const mit = confirmedGuests().filter(g => g && String(g.allergies||'').trim() && !ALLERGIE_NEGATION.test(String(g.allergies).trim()));
  if(!mit.length) return '';
  return '<div class="mat" style="border-left:3px solid var(--rust)"><b>⚠️ Allergien in dieser Runde:</b> '
    + mit.map(g => esc((String(g.name||'').trim()||'Ein Kind') + ': ' + String(g.allergies).trim()))
         .join(' &nbsp;·&nbsp; ')
    + '</div>';
}
/* 10.08. (externes Audit): Die Zeile oben ZEIGTE Linas Laktose an, das Rezept
   daneben nannte weiter Butter und Milch ohne Ausweg — "Intelligenz anzeigen,
   ohne sie auszufuehren". Jetzt: zielgenaue Standard-Austausche, NUR fuer
   die Allergien, die in den Zusagen wirklich gemeldet sind. Kein Lexikon —
   bei allem Unklaren gilt die letzte Zeile: Eltern des Kindes fragen. */
function allergieTausch(){
  /* 10.08. (Re-Check M1): join(' , ') machte aus lauter LEEREN Angaben den
     truthy String " , " — die Box feuerte bei jeder Party ohne Allergien.
     Leere Eintraege VOR dem Join filtern. */
  /* Verneinungen ("keine", "nein", "-") zaehlen nicht als Meldung — sonst
     druckt die Rueckfrage-Box "frag die Eltern", obwohl nichts zu fragen ist. */
  const alle = confirmedGuests().map(g => String((g&&g.allergies)||'').trim().toLowerCase())
    .filter(s => s && !ALLERGIE_NEGATION.test(s)).join(' , ');
  if(!alle) return '';
  // Umlaute normalisieren, sonst rutscht "Erdnüsse" an "erdnuss" vorbei
  // (Demo-Fund 10.08.: Emma meldet "Erdnüsse", der Praefix-Check griff nicht).
  const norm = s => s.replace(/ä/g,'a').replace(/ö/g,'o').replace(/ü/g,'u').replace(/ß/g,'ss');
  const tokens = norm(alle).split(/[\s,;\/()+.\-]+/).filter(Boolean);
  const hat = {
    laktose: tokens.some(t => t.indexOf('laktose')===0 || t.indexOf('lactose')===0 || t.indexOf('milch')===0 || t.indexOf('kuhmilch')===0),
    ei:      tokens.some(t => t==='ei' || t==='eier' || t.indexOf('huhnerei')===0 || t.indexOf('huehnerei')===0 || t.indexOf('eialler')===0 || t.indexOf('eifrei')===0),
    gluten:  tokens.some(t => t.indexOf('gluten')===0 || t.indexOf('weizen')===0 || t.indexOf('zolia')===0 || t.indexOf('zoliak')===0),
    nuss:    tokens.some(t => t.indexOf('nuss')===0 || t.indexOf('nusse')===0 || t.indexOf('erdnuss')===0 || t.indexOf('mandel')===0 || t.indexOf('haselnuss')===0 || t.indexOf('walnuss')===0 || t.indexOf('cashew')===0 || t.indexOf('pistaz')===0 || t.indexOf('pekan')===0 || t.indexOf('macadam')===0 || t.indexOf('paranuss')===0 || t.indexOf('schalenfr')===0)
  };
  const zeilen = [];
  if(hat.laktose) zeilen.push('<b>Laktose:</b> Butter → milchfreie/vegane Margarine (Zutaten prüfen — viele Margarinen enthalten Milch), Milch → Hafer- oder Sojadrink (jeweils 1:1) — schmeckt im Kuchen niemand raus. Steht auch Gluten auf der Liste, glutenfreien Haferdrink nehmen; steht Soja drauf, ebenfalls den Haferdrink nehmen.');
  if(hat.ei) zeilen.push('<b>Ei:</b> je Ei ½ zerdrückte Banane oder 3 EL Apfelmus, dazu je ½ TL Backpulver. Verlangt das Rezept mehr als 2 Eier, lieber Ei-Ersatzpulver aus der Drogerie verwenden oder ein Rezept mit weniger Eiern wählen — und auch diese wie oben ersetzen.');
  if(hat.gluten) zeilen.push('<b>Gluten:</b> Mehl → glutenfreie 1:1-Mehlmischung (mit Bindemittel); auch Backpulver und Deko auf „glutenfrei" prüfen.');
  if(hat.nuss) zeilen.push('<b>Nuss:</b> Marzipan- und Nuss-Deko weglassen, stattdessen Zuckerguss — und Packungen auf „Spuren von Erdnüssen/Schalenfrüchten" prüfen.');
  if(!zeilen.length){
    return '<div class="mat" style="border-left:3px solid var(--rust)"><b>🍰 Kuchen &amp; Allergien:</b> '
      + 'Für die gemeldeten Angaben haben wir keinen Standard-Austausch parat. '
      + 'Frag kurz bei den Eltern der betroffenen Kinder nach (siehe Allergie-Zeile oben), was beim Backen zu beachten ist — die Kontakte stehen auf deiner Gästeliste.</div>';
  }
  return '<div class="mat" style="border-left:3px solid var(--rust)"><b>🍰 So backst du den Kuchen für alle:</b><br>'
    + zeilen.join('<br>')
    + '<br><span style="color:var(--muted)">Im Zweifel kurz bei den Eltern des Kindes nachfragen — die Kontakte stehen auf deiner Gästeliste.</span></div>';
}
/* Gaeste mit erfasster Abholzeit. `frueh` markiert die, deren Zeit VOR der
   Urkunden-Uebergabe liegt (Ende minus 15 Min, so rechnet buildTimeline) —
   also genau die Kinder, die sonst gehen, bevor sie ihre Urkunde bekommen. */
function abholZeiten(){
  const end = parseHM(PARTY.endTime);
  const uebergabe = (end == null) ? null : end - 15;
  return confirmedGuests().map(function(g){
    const pt = parseHM(g && g.pickupTime);
    return { name:   String((g&&g.name)||'').trim(),
             zeit:   String((g&&g.pickupTime)||'').trim(),
             person: String((g&&g.pickupPerson)||'').trim(),
             frueh:  (pt != null && uebergabe != null && pt < uebergabe) };
  }).filter(function(x){ return x.zeit; });
}
/* costContext nennt eine Muster-Gaestezahl ("Geschätzte Kosten (Standard, 8 Kinder)").
   Direkt davor steht die ECHTE Zahl aus den Zusagen — am 06.08. gedruckt als
   "Für deine Knappenschar von 5 Kindern. Geschätzte Kosten (Standard, 8 Kinder)":
   zwei Zahlen fuer dieselbe Sache in einem Satz, und die Einkaufsposten darunter
   folgen der falschen. Kennen wir die echte Zahl, ersetzt sie die Muster-Zahl;
   kennen wir sie nicht (noch keine Zusagen), bleibt alles wie bisher. */
/* Quiz-Karten drucken. Bis zum 06.08. lagen 318 fertige Karten in sechs
   Motto-Dateien (ritter, baustelle, pferde) und wurden von KEINEM Renderer
   gelesen — waehrend die gedruckte Spielkarte "Material: 12 Quiz-Karten mit
   Bildern" verlangt und die Einkaufsliste "Quiz-Karten + Antwortbogen ~6 €"
   einkaufen schickt. Ein Gastgeber, der fuers Komplettpaket zahlt, musste sich
   am Abend vorher zwoelf Burgen-Fragen selbst ausdenken, obwohl er sie bereits
   gekauft hatte. (Der Pruefer fuer ungelesene Felder kannte den Fall — die
   Feldnamen standen auf seiner Ausnahmeliste und galten als abgehakt.)

   Der Gastgeber haelt diese Karte, nicht das Kind: die Antwort darf sichtbar
   sein. `note` ist der Merksatz fuer den Vorleser. */
/* Das Ritual folgt dem Plan (Bolle-Entscheidung 06.08.).
   Vorher behauptete das Ritual eine feste Stempelzahl — "5 Stempel-Feldern",
   "die 5 Stationen: Wappen, Quiz, Schwert, Drache, Burg" —, waehrend der
   gerechnete Ablauf davon nur drei spielte. Jedes Kind hielt am Ende ein Heft
   mit zwei leeren Feldern, und die Bedingung des Hoehepunkts ("wenn alle
   Stempel da sind") war nicht erfuellt. In der Wow-Variante sprangen die
   vergebenen Nummern sogar 1-2-3-4-4-6.
   Jetzt zaehlt der Renderer, was wirklich im Plan steht, und sagt es dem
   Gastgeber. Die Zahl kann nicht mehr auseinanderlaufen: sie kommt aus
   derselben Rechnung wie Blatt 2. */
function stempelPlan(){
  const tl = buildTimeline();
  return {
    geplant: (tl.rows || []).filter(r => r.tag === 'spiel').map(r => stripEmojiLabel(r.tit)),
    reserve: (tl.reserve || []).map(g => stripEmojiLabel(String((g && g.name) || '')))
  };
}
function stempelBlock(rit){
  // Nur drucken, wenn das Ritual WIRKLICH mit einem Sammelobjekt arbeitet.
  // Signal: stempelHeft = Dativ-Phrase in signatureRitual — gesetzt in SECHS
  // Dateien (ritter/baustelle/dino-mittel, dino/meerjungfrau/piraten-gross).
  // Ohne dieses Gate erzählte die geteilte Vorlage allen Mottos ein Heft
  // samt Erfolgsbedingung, das weder Einkaufsliste noch Ritual liefern
  // (Runde-4-MAJOR: piraten "Trag genau 5 Felder ins Heft ein").
  if(!(rit && rit.stempelHeft)) return '';
  const p = stempelPlan();
  if(!p.geplant.length) return '';
  const n = p.geplant.length;
  const name = String((rit && rit.name) || '').trim();
  // Das Signal traegt die Dativ-Phrase des echten Sammelobjekts ("ins
  // Knappen-Heft", "in den Forscher-Ausweis", "auf die Expeditions-Karte") —
  // ein generisches "ins Heft" waere fuer vier der sechs Mottos falsch.
  const heft = typeof rit.stempelHeft === 'string' ? rit.stempelHeft : 'ins Heft';
  return '<div class="mat" style="border-left:3px solid var(--gold)">'
    + '<b>🏅 Stempel-Plan für diese Party: ' + n + ' Station' + (n === 1 ? '' : 'en') + '</b><br>'
    + esc(p.geplant.join('  ·  ')) + '<br>'
    + '<span style="color:var(--muted)">Trag genau ' + n + ' Feld' + (n === 1 ? '' : 'er')
    + ' ' + esc(heft) + ' ein — ' + (name ? esc(name) : 'das Ritual')
    // n=1 (Kurzfenster mit einem Spiel): "wenn diese 1 Stempel da sind" waere
    // falsch — Singular-Zweig (Re-Check-MINOR 10.08.).
    + (n === 1 ? ' kommt, wenn dieser eine Stempel da ist.'
               : ' kommt, wenn diese ' + n + ' Stempel da sind.')

function kostenKontext(txt, g){
  const s = String(txt||'');
  if(!g || !s) return s;
  /* Re-Check 06.08.: Die erste Fassung ersetzte stumpf die erste Zahl vor
     "Kinder" — und traf damit die ZWEITE Zahl einer Spanne. Aus
     "(Standard, 8–10 Kinder)" wurde bei 5 Zusagen "(Standard, 8–5 Kinder)",
     aus "(Wow, bis 8 Kinder)" bei 12 Zusagen eine stillschweigend angehobene
     Obergrenze. Betroffen: neun Varianten-Texte in fuenf Mottos (detektiv,
     meerjungfrau, piraten, weltraum — ritter selbst hat nur die einfache
     Form, deshalb fiel es dort nicht auf). Ausserdem verschluckte sie das
     Dativ-n: "bei 8 Kindern" waere zu "bei 5 Kinder" geworden.
     Jetzt: nur die ALLEINSTEHENDE Zahl wird ersetzt, Spannen und
     Obergrenzen bleiben, wie sie sind. */
  const m = /(\d+)(\s+Kinder(?:n)?\b)/.exec(s);
  if(!m) return s;
  const vor = s.slice(0, m.index);
  if(/\d\s*[-–—]\s*$/.test(vor)) return s;                       /* "8–10 Kinder" */
  if(/\b(bis|ab|max\.?|min\.?|höchstens|mindestens|etwa|ca\.?)\s*$/i.test(vor)) return s;
  /* Der Singular war in der Bereichs-Reparatur verlorengegangen: m[2] wurde
     woertlich uebernommen, also stand bei genau einer Zusage "1 Kinder".
     Beugung folgt jetzt der Zahl, Dativ bleibt Dativ. */
  const wort = (g === 1) ? m[2].replace(/Kindern\b/, 'Kind').replace(/Kinder\b/, 'Kind') : m[2];
  return vor + g + wort + s.slice(m.index + m[0].length);
}

function shCountdown(){
  const pw=DATA.preparationWeeks||{};
  /* minus6Weeks existiert nur in ritter-gross.json — Reihenfolge deckt alle 3 Gruppen ab */
  const order=[['minus6Weeks','6 Wochen vorher'],['minus4Weeks','4 Wochen vorher'],['minus2Weeks','2 Wochen vorher'],['minus1Week','1 Woche vorher'],['minus2Days','2 Tage vorher'],['minus1Day','Vortag'],['dayOf','Der große Tag']];
  /* Die Regex laesst "2026-13-45" durch — new Date(...) ist dann Invalid Date, aber TRUTHY.
     Ohne isNaN-Guard vergleichen beide Filter gegen NaN und Teil I druckt eine leere Seite. */
  let base = /^\d{4}-\d{2}-\d{2}$/.test(PARTY.date||'') ? new Date(PARTY.date+'T12:00:00') : null;
  if(base && isNaN(base.getTime())) base = null;
  const offs={minus6Weeks:-42,minus4Weeks:-28,minus2Weeks:-14,minus1Week:-7,minus2Days:-2,minus1Day:-1,dayOf:0};
  /* Abgelaufene Stufen werden zu EINEM "Jetzt sofort"-Block zusammengezogen, statt tote
     Fristen zu drucken (Kurzentschlossene sehen sonst eine halbe Seite Vergangenheit). */
  const today=new Date(); today.setHours(12,0,0,0);
  const dueDate=k=>{ if(!base) return null; const d=new Date(base); d.setDate(d.getDate()+offs[k]); return d; };
  const present=order.filter(([k])=>pw[k]);
  const past=base?present.filter(([k])=>dueDate(k)<today):[];
  const future=base?present.filter(([k])=>dueDate(k)>=today):present;
  /* Gate-M4-Familie (01.08.): auch Countdown-Items driften zwischen String und Objekt —
     ein String-Item druckte '<b>undefined</b>' (ausgerechnet ein Sicherheits-Check). */
  const liOf=b=>(b.items||[]).map(it=>{ if(typeof it==='string') return '<li><b>'+esc(it)+'</b></li>'; return '<li><b>'+esc((it.icon?it.icon+' ':'')+it.title)+'</b>'+(it.detail?'<span>'+esclink(it.detail)+'</span>':'')+'</li>'; }).join('');
  let blocks='';
  if(past.length){
    blocks+='<div class="blk"><div class="when">Jetzt sofort<em>'+(past.length===present.length?'alles auf einmal':'nachholen')+'</em></div><ul>'+past.map(([k])=>liOf(pw[k])).join('')+'</ul></div>';
  }
  blocks+=future.map(([k,label])=>{
    const d=dueDate(k); const when=d?d.toLocaleDateString('de-DE',{day:'numeric',month:'short'}):'';
    return '<div class="blk"><div class="when">'+esc(label)+(when?'<em>bis '+esc(when)+'</em>':'')+'</div><ul>'+liOf(pw[k])+'</ul></div>';
  }).join('');
  const sub = !base ? 'Trag dein Datum im Planer ein, dann rechnen wir die Termine aus.'
    : (past.length ? ('kurzfristig geplant — der erste Block ist alles, was schon dran wäre (Party am '+fmtDate(PARTY.date)+')')
                   : ('gerechnet rückwärts ab '+fmtDate(PARTY.date)));
  return sheet(hd('Teil I · Vorbereitung','Countdown zum Ritter-Tag', sub)
    +'<div class="cd grow">'+blocks+'</div>'+foot('Seite 3 · Countdown'),'');
}

     Gesamtpreise waren von ihren Listen abgewichen, weil spaeter Posten
     dazukamen — eine Zahl, die jemand pflegen muss, geht irgendwann falsch.
     Diese hier kann nicht abweichen: sie zaehlt genau die Posten, die auf
     demselben Blatt stehen. Optionales getrennt, damit sichtbar bleibt,
     was das Extra kostet. */
  const _preis = it => (typeof it.priceEur === 'number' ? it.priceEur : 0);
  const _optional = it => /^Optional:/.test(it.label || '') || /\(([^)]*\boptional\b[^)]*)\)/i.test(it.label || '');
  const _liste = (v.shoppingList || []);
  const _pflicht = _liste.filter(it => !_optional(it)).reduce((s, it) => s + _preis(it), 0);
  const _extra = _liste.filter(_optional).reduce((s, it) => s + _preis(it), 0);
  const _eur = n => String(Math.round(n)).replace('.', ',') + ' €';
  const summe = _liste.length

      + '<span class="em">Σ</span><span>Zusammen'

    +allergieZeile()
    +'<h3 style="font-size:16px;color:var(--navy);margin:16px 0 6px">🎁 Burg-Schatz-Tüte (Mitgebsel)</h3><div class="plain-tight">'+esc(v.giveaways||'')+'</div>'
    /* Gate F4 (04.08.): Das Schatzsuche-Material stand NUR auf dem Stationsblatt.
       Wer nach der Einkaufsliste einkauft, faehrt fuer UV-Lampe, Zahlenschloss und
       Truhe ein zweites Mal los. Gehoert dorthin, wo eingekauft wird. */
    +schatzMatBlock()+'</div>'
    +'<div class="note screen-only">* Affiliate-Links — kleiner Beitrag für machsleicht, gleicher Preis für dich.</div>'

function shGameCards(){
  const v=variant();
  const chosen = GAME_META_P[PARTY.gameId||''];
  const digi = chosen
    ? '<div class="digi"><div class="strow"><div class="stbody"><div class="ey" style="color:var(--sea)">Euer digitales Einladungs-Spiel</div>'
      +'<h3 style="font-size:17px;color:var(--navy);margin:4px 0 4px">'+esc(chosen.e+' '+chosen.t)+'</h3>'
      +'<p style="font-size:13px;margin:2px 0 8px">'+esc(chosen.s)+' Jeder Gast spielt es über die Einladung — und am Partytag läuft es auf dem Tablet in der Spielecke weiter.</p>'
      +'<div class="lnk">'+esc(PARTYURL)+'</div></div>'
      +qrBlock(PARTYURL, PARTYURL.indexOf('demo=1')>=0?'Beispiel öffnen':'Scannen → Spiel öffnen')+'</div></div>'
    : '<div class="emptyhint"><b>Digitales Spiel:</b> Wähl im Planer ein Einladungs-Spiel, dann erscheint hier die Spielstation mit Link.</div>';
  /* Bolle 01.08.: KEIN Vorleser auf Spielkarten — Materiallisten und Schritte sind
     Erwachsenen-Lesestoff. Vorlesen gibt es nur an den Schatzsuche-Stationen,
     wo eine Aufgabe/Story fuer die Kinder erzaehlt wird (shStations/renderStation). */
  const cards=(v.games||[]).map(g=>{
    /* parseDur statt Roh-String: klein/gross liefern "10 Min." — sonst stand "10 Min. Min" auf der Karte */
    const fac=[(g.duration?parseDur(g.duration)+' Min':''),(g.minAge?('ab '+g.minAge)+' J.':''),(g.indoor&&g.outdoor?'drinnen + draußen':(g.indoor?'drinnen':'draußen'))].filter(Boolean).join(' · ');
    /* Gate-M4 (01.08.): Dino-Steps sind Strings, Piraten-Steps {name,content}-Objekte — ohne
       diesen Guard druckten ALLE Dino-Spielkarten leere Anleitungen (esc(undefined)='').
       Der Ritual-Renderer unten toleriert beide Formen seit je; jetzt tut es der Spiel-Renderer auch. */
    const steps=(g.steps||[]).map(s=>{ if(typeof s==='string') return '<li>'+esc(s)+'</li>'; return '<li><b>'+esc(s.name)+':</b> '+esclink(s.content)+'</li>'; }).join('');
    /* Gate-MAJOR 5 (30.07.): safetyRule (teils als PFLICHT markiert) MUSS auf die Vorlese-Karte */
    const safety=g.safetyRule?'<div class="mat" style="border-left:3px solid var(--rust)"><b>⚠️ Sicherheit:</b> '+esc(g.safetyRule)+'</div>':'';
    /* Welle 2f: ageAdjust wurde bisher NIE gedruckt — die Altersanpassung jedes
       Spiels war geschrieben und unsichtbar. Passend zum echten Partyalter waehlen,
       mit Rueckfall nach unten, falls die genaue Stufe fehlt. */
    const _a = parseInt((PaketCore.party()||{}).age,10);
    const _p = PaketCore.ageAdjustFor(g, _a);
    const _adj = _p ? _p.text : '';
    /* 05.08.: Die Beschriftung log. ageAdjustFor() waehlt die hoechste Staffel
       mit N <= Alter; fehlen die oberen Sprossen, landet man auf einer unteren,
       deren Text eine Absage an ein JUENGERES Kind ist ("NICHT fuer 8"). Das
       stand dann unter "Fuer 10-Jaehrige:". Die Auswahl war richtig, die Zeile
       daneben. Sie nennt jetzt das Alter der STAFFEL — bei gemischten Gruppen
       ist genau das die nuetzliche Information. */
    const _st = _p ? _p.stufe : null;
    const _lbl = (_st==null || !isFinite(_a)) ? 'Fuer diese Altersgruppe'
               : (_st===_a ? 'Für '+_a+'-Jährige'
                           : 'Bei '+_st+'-Jährigen');
    /* Gate 06.08.: Die Staffeln sind in vielen Dateien nur fuer 6 und 8 geschrieben.
       ageAdjustFor() nimmt dann fuer ein 10-Jaehriges die Stufe 8 — und druckt dem
       gross-Kaeufer "NICHT fuer 8 - siehe oben", also eine Absage an ein Kind, das
       gar nicht gemeint ist, mit Verweis auf einen Text, der nicht auf dem Blatt
       steht. Bei klein stand entsprechend "Bei 6-Jaehrigen: Bei 3-Jaehrigen: ...".
       Deshalb: den Block nur drucken, wenn die Stufe in die geladene Altersgruppe
       faellt. Fehlender Rat ist besser als falscher — und die Luecke wird sichtbar,
       statt sich als Fehlinformation zu tarnen. */
    const _grp = gruppeVonParty(PARTY);
    const _sp  = _grp==='klein' ? [3,5] : (_grp==='gross' ? [9,12] : [6,8]);
    const _passt = (_st!=null && _st>=_sp[0] && _st<=_sp[1]);
    const adj = (_adj && _passt)?'<div class="mat" style="border-left:3px solid var(--sea)"><b>'+esc(_lbl)+':</b> '+esc(_adj)+'</div>':'';
    return '<div class="gcard"><div class="gh"><h3>'+esc(stripEmojiLabel(g.name))+'</h3><span class="fac">'+esc(fac)+'</span></div>'
      +(g.material?'<div class="mat"><b>Material:</b> '+esclink(g.material)+'</div>':'')
      +(g.prepText?'<div class="mat"><b>Vorbereitung:</b> '+esc(g.prepText)+'</div>':'')
      +adj
      +safety
      /* Gate B/M (04.08.): indoorTip (585) und outdoorTip (509) stehen auf 655
         Spielkarten und wurden vom Paket nie gedruckt — die kostenlose Planer-Seite
         zeigt sie laengst (kindergeburtstag.html eliteLocTip). Dort wird EINER
         gewaehlt, weil die Seite den Ort kennt. Das gedruckte Blatt kennt ihn nicht
         und entsteht Tage vorher: also beide, beschriftet. Der Gastgeber entscheidet
         am Partytag nach Wetter. */
      +((g.indoorTip||g.outdoorTip)?('<div class="mat"><b>Je nach Ort:</b>'
        +(g.indoorTip?'<br>🏠 <b>Drinnen:</b> '+esclink(g.indoorTip):'')
        +(g.outdoorTip?'<br>🌳 <b>Draußen:</b> '+esclink(g.outdoorTip):'')+'</div>'):'')
      +'<ol>'+steps+'</ol>'+quizBlock(g)+'</div>';
  }).join('');
  const rit=DATA.signatureRitual||{};
  const ritCard = rit.name ? '<div class="gcard" style="border-color:var(--rust)"><div class="gh"><h3>⚔️ '+esc(rit.name)+'</h3><span class="fac">Anfang & Ende</span></div>'
      +(rit.introText?'<p style="font-size:13px;margin:4px 0">'+esc(rit.introText)+'</p>':'')
      +((rit.setupSteps&&rit.setupSteps.length)?('<ol>'+rit.setupSteps.map(s=>{ if(typeof s==='string') return '<li>'+esc(s)+'</li>'; const t=s.title||s.name||''; const c=s.content||''; return '<li>'+(t?'<b>'+esc(t)+':</b> ':'')+esc(c)+'</li>'; }).join('')+'</ol>'):'')
      /* Gate M6.4 (04.08.): rolesList steht in 38 von 45 Motto-Dateien und wurde von
         KEINEM Renderer im Repo gelesen — weder Paket noch freie Seite. Die
         materialNote schickt den Gastgeber trotzdem los: "die Crew-Namen oben
         einfach ausdrucken und zerschneiden". "Oben" zeigte auf nichts. Dabei ist
         das der Kern des Rituals: jedes Kind bekommt einen eigenen Namen. */
      /* 10.08.: Die Zettel druckten Beispielkinder aus den Daten ("Burg-Wächter
         Hanna") — mit echter Gästeliste kollidierten die Namen (externes Audit;
         Daten tragen jetzt nackte Rollentitel). Kern des Rituals ist aber, dass
         jedes Kind SEINE Rolle bekommt: Zusagen der Reihe nach zuordnen; ohne
         (oder mit zu wenigen) Namen eine Schreiblinie zum Eintragen beim
         Rollen-Ziehen. */
      +((rit.rolesList&&rit.rolesList.length)?(function(){
        const ja=confirmedGuests();
        /* 10.08. (Review W1-1): Mehr Zusagen als Rollen liess die uebrigen Kinder
           einfach weg — jetzt bekommt jedes weitere Kind einen Blanko-Zettel mit
           Schreiblinie fuer die Rolle. W1-2: Die Zuordnung ist ein Vorschlag,
           kein Gesetz — der Tausch-Satz steht direkt am Schneideblock. */
        const chips=rit.rolesList.map(function(r,i){ const g=ja[i]; return '<span class="rollchip">'+(r.emoji?esc(r.emoji)+' ':'')+'<b>'+esc(r.name||'')+'</b>'+((g&&g.name)?': '+esc(g.name):': ________')+(r.function?' — '+esc(r.function):'')+'</span>'; })
          .concat(ja.slice(rit.rolesList.length).map(function(g){ return '<span class="rollchip"><b>________</b>'+((g&&g.name)?': '+esc(g.name):'')+'</span>'; }));
        const blankoTipp=(ja.length>rit.rolesList.length)?' Auf den Zetteln mit Schreiblinie tragt ihr beim Verteilen gemeinsam eine Wunschrolle ein.':'';
        return '<div class="mat"><b>✂️ Zum Ausschneiden — ein Zettel je Kind:</b><div class="rollen">'
        +chips.join('')
        +'</div><span style="font-size:12px;color:var(--muted)">Die Zuordnung ist nur ein Vorschlag — wenn zwei Kinder tauschen wollen, einfach tauschen.'+blankoTipp+'</span></div>';})():'')
      +(rit.materialNote?'<div class="mat"><b>Material:</b> '+esclink(rit.materialNote)+'</div>':'')
      /* Gate B1.2 (04.08.): optOutNote stand in 39 Dateien und wurde vom PAKET nie
         gedruckt — die kostenlose Planer-Seite zeigt es laengst (_src/kindergeburtstag.jsx
         Zeile 1008). Ausgerechnet die Zusage, dass kein Kind mitmachen MUSS, fehlte
         also auf dem bezahlten Blatt, das der Gastgeber am Tisch liegen hat. */
      +(rit.optOutNote?'<div class="mat" style="border-left:3px solid var(--ok)"><b>Wenn ein Kind nicht will:</b> '+esclink(rit.optOutNote)+'</div>':'')
      /* Steht ZULETZT auf der Karte: die gerechnete Zahl ist die verbindliche.
         Alles darueber ist Vorbereitungs-Prosa, das hier ist der Partytag. */
      +stempelBlock(rit)
      +'</div>' : '';
  return sheet(hd('Teil III · Spiele','Spielkarten für deine '+G(),'Zum Vorlesen — Material, Schritte, Alter. Reihenfolge wie im Ablaufplan.')
    +'<div class="grow">'+digi+ritCard+cards+'</div>'+foot('Teil III · Spielkarten'),'');
}

  const invByName=Object.create(null);
  (Array.isArray(PARTY.invites)?PARTY.invites:[]).forEach(function(i){ if(i&&i.n) invByName[String(i.n).trim().toLowerCase()]=i; });
  const tcells=names.map(n=>{

    return '<div class="cell"><div class="tcard"><div class="flag">🏰</div><div class="nm">'+(n?esc(n):'&nbsp;')+'</div><div class="rl">'+esc(sub)+'</div></div></div>';

    +'<div class="grow"><div class="cutgrid tent">'+tcells+'</div><div class="cuthint">✂️ Tischkärtchen ausschneiden, an der gestrichelten Linie falten — der Name steht dann aufrecht</div>'
    +'<div class="cutgrid" style="margin-top:16px">'+lcells+'</div><div class="cuthint">✂️ Etiketten für die Burg-Schatz-Tüte</div></div>'

function shInvitations(){
  /* V2 (Bolle-Catch 30.07. „Einladungen?!"): Burgpost verzahnt sich mit dem BESTEHENDEN
     Party-Pass-System der Partyseite statt parallel zu laufen. Drei Quellen nach Prioritaet:
     1) party.invites (Name+ROLLE+Token) -> QR auf den persoenlichen ?g-Link (1-Tipp-Zusage)
     2) zugesagte Gaeste -> Namens-Karte mit generischem Party-QR (Nachzuegler/zweite Welle)
     3) Blanko mit generischem QR. Wizard-Partys starten mit LEEREN invites — der Hinweis
     unten macht die (versteckte) Crew-Anlage auf der Partyseite sichtbar. */
  const nm=(PARTY.childName||'').trim()||'Unser Ritterkind';
  const ds=fmtDate(PARTY.date); const t=PARTY.time?PARTY.time+' Uhr':'';
  const addr=PARTY.address||'';
  /* Abgleich invites<->guests (Token zuerst, dann Name) liegt im Kern: die Regel und
     ihre bewusste Grenze gelten fuer jedes Motto gleich. Siehe splitInvites(). */
  const sp=splitInvites(), invites=sp.open, declined=sp.declined;
  const declLead=declined.length===1?'<b>Eine Absage:</b> für dieses Kind ist keine Karte dabei.':('<b>'+declined.length+' Absagen:</b> für diese Kinder sind keine Karten dabei.');
  const reprint=' Sagt doch noch jemand zu, drucke dieses Blatt einfach neu.';
  let declNote=declined.length ? '<div class="emptyhint" style="margin-bottom:14px">'+declLead+reprint+'</div>' : '';
  const mk=(gname,role,gtok,mission)=>{
    const purl = guestUrl(gtok);
    return '<div class="invcard"><div class="strow"><div class="stbody">'
      +'<div class="to">Geheime Burgpost für</div><div class="nm">'+(gname?esc(gname):'________________')+'</div>'
      +(role?'<p style="color:var(--rust);font-weight:700;margin-top:-3px">⚔️ Deine Rolle auf der Burg: '+esc(role)+'</p>':'')
      +(role&&mission?'<p style="font-size:12px;color:var(--muted);margin-top:-2px">'+esc(mission)+'</p>':'')
      +'<p>🏰 <b>'+esc(nm)+'</b> ruft die '+G()+' zusammen'+(PARTY.age?(' — zum <b>'+esc(PARTY.age)+'. Geburtstag</b>'):'')+'!</p>'
      +(ds?'<p>📅 '+esc(ds)+(t?(' · ⏰ '+esc(t)):'')+'</p>':'')
      +(addr?'<p>📍 '+esc(addr)+'</p>':'')
      /* „mit einem Tipp zusagen" waere falsch — Planer-Partys fragen immer Allergien/Abholung ab,
         damit ist der Autosend im Worker aus. Ehrlicher Nutzen des Tokens: Name ist eingetragen. */
      +'<p>'+(gtok?'Scannen — dein Name ist schon eingetragen, dein Party-Pass wartet:':'Alle Infos + kurz zusagen (Allergien &amp; Abholung) direkt hier:')+'</p>'
      +'<div class="url">'+esc(purl)+'</div></div>'
      +qrBlock(purl, gtok?'Dein persönlicher Link':'Zur Partyseite')
      +'</div></div>';
  };
  let cards='', note='';
  if(invites.length){
    /* Rollen-Name + Mission: invites tragen role-IDs; Katalog-Spiegel ROLES_P uebersetzt.
       F8: eine Blanko-Reserve auch hier — fuer das spontane siebte Kind. */
    cards = invites.map(i=>mk(i.n, roleLabel(i.role), i.t, roleMission(i.role))).join('') + mk('','','','');
  } else {
    const ja = confirmedGuests();
    if(ja.length){
      cards = ja.map(g=>mk(g.name,'','')).join('') + mk('','','');
      note = declined.length
        ? '<div class="emptyhint" style="margin-bottom:14px">'+declLead+' Hier stehen die Karten der Kinder, die spontan zugesagt haben.'+reprint+'</div>'
        : '<div class="emptyhint" style="margin-bottom:14px"><b>Karten mit Rollen &amp; persönlichem QR-Code?</b> Trag die Namen deiner '+G()+' ein — im Planer unter „Wer kommt?" oder auf deiner Partyseite (Bearbeiten → „💌 Persönliche Einladungen"). Dann bekommt jedes Kind hier seine eigene Karte mit Ritter-Rolle.</div>';
      if(declined.length) declNote = '';   // nicht doppelt
    } else {
      cards = mk('','','')+mk('','','')+mk('','','');
      if(declined.length){
        note = '<div class="emptyhint" style="margin-bottom:14px"><b>Alle haben abgesagt.</b> Deshalb hier nur Blanko-Karten mit dem allgemeinen Party-Code — für spontane Nachzügler.'+reprint+'</div>';
        declNote = '';   // Re-Check 31.07.: sonst stand der Neudruck-Rat zweimal untereinander
      } else {
        note = '<div class="emptyhint" style="margin-bottom:14px"><b>Tipp:</b> Trag die Namen deiner '+G()+' ein — im Planer unter „Wer kommt?" oder auf deiner Partyseite (Bearbeiten → „💌 Persönliche Einladungen"). Dann stehen hier Namen + Ritter-Rollen und jedes Kind bekommt seinen eigenen QR-Code mit vorausgefülltem Namen. Bis dahin: Blanko-Karten mit dem allgemeinen Party-Code.</div>';
      }
    }
  }
  return sheet(hd('Teil IV · Einladungen','Burgpost für deine '+G(),'Ausschneiden und verteilen — der QR-Code führt direkt zur Zusage. Digital geht es wie gewohnt über deine Partyseite.')
    +'<div class="grow">'+declNote+note+cards+'</div>'+foot('Einladungen'),'');
}

         Loesung dort, wo die Kinder raetseln sollen. Jetzt unterhalb einer Schnittkante:

    +'<h2>'+(nm?esc(poss(nm))+' ':'')+'Ritter-Countdown</h2>'
    +'<div class="big">Noch ⬜ Nächte bis zur Party!</div>'
    +(ds?'<p style="color:var(--muted)">Der große Tag: <b>'+esc(ds)+'</b></p>':'')
    +'<div class="nights">'+nights+'</div>'
    +'<p style="font-size:12.5px;color:var(--muted);margin-top:16px">Jeden Abend einen Kreis ausmalen — wenn alle voll sind, geht es los! 🏰</p></div>'
    +foot('Countdown-Poster'),'');
}

/* ---------- V2: Eltern-Handzettel (fuer die abgebenden Eltern) ---------- */
function shHandzettel(){
  const nm=(PARTY.childName||'').trim()||'Unser Kind';
  const ds=fmtDate(PARTY.date); const t=PARTY.time?PARTY.time+' Uhr':''; const et=PARTY.endTime?PARTY.endTime+' Uhr':'';
  const addr=PARTY.address||'';
  const card='<div class="cell"><div class="hzc"><div class="t">🏰 '+esc(poss(nm))+' Ritter-Party — Eltern-Info</div>'
    +(ds?'<p>📅 '+esc(ds)+(t?(' · '+esc(t)):'')+(et?(' bis '+esc(et)):'')+'</p>':'')
    +(addr?'<p>📍 '+esc(addr)+'</p>':'')
    +'<p>✅ Bitte kurz zu-/absagen und Allergien melden:</p>'
    +'<p style="font-weight:700;color:var(--sea);word-break:break-all">'+esc(PARTYURL)+'</p>'
    +(PARTY.endTime?'<p>🕐 Abholung: '+esc(PARTY.endTime)+' Uhr</p>':'')
    +'</div></div>';
  const wa='🏰 '+poss(nm)+' Ritter-Party!'+(ds?('\n📅 '+ds+(t?(' · '+t):'')):'')+(addr?('\n📍 '+addr):'')
    +'\n\nAlle Infos + Zusage (bitte Allergien angeben) hier:\n'+PARTYURL;
  return sheet(hd('Teil IV · Eltern-Info','Handzettel für die abgebenden Eltern','Viermal zum Ausschneiden — für Kita-Fach, Ranzen oder Haustür. Digital unten als WhatsApp-Text.')
    +'<div class="grow"><div class="cutgrid hz">'+card+card+card+card+'</div>'
    +'<div class="cuthint">✂️ An den Linien schneiden</div>'
    /* Die vier Karten sind bewusst gleich — sie gehen an beliebige Eltern und
       tragen deshalb die allgemeine Endzeit. Wo einzelne Kinder frueher
       abgeholt werden, stand das bis zum 06.08. nur in der Kuechen-Tabelle;
       hier steht es dort, wo der Gastgeber die Zettel verteilt. */
    +abholNote()
    +'<div class="wacopy screen-only"><b>📲 Als WhatsApp-Text:</b>\n'+esc(wa)+'</div></div>'
    +foot('Eltern-Handzettel'),'');
}

/* ---------- V2: Stations-Modus (QR-Ziel) ---------- */
function renderStation(sIdx, grp){
  const el=document.getElementById('stmode');
  el.style.display='block';
  /* Rechtsfooter bleibt STEHEN: Der Stations-Modus ist eine gastgerichtete, eigenstaendig
     geoeffnete (QR!) und getrackte Unterseite — genau die Gattung, fuer die die
     Anbieterkennzeichnung gilt (§5 DDG, Art. 13 DSGVO). */
  const sts=(SCHATZ&&SCHATZ.stations&&SCHATZ.stations[grp])||[];
  const s=sts[sIdx-1];
  if(!s){
    /* F4: Ladefehler (SCHATZ=null) liest sich sonst wie „Schatzsuche hat 0 Stationen" */
    el.innerHTML = sts.length
      ? '<div class="card"><h2>Station nicht gefunden</h2><p>Diese Schatzsuche hat '+sts.length+' Stationen.</p></div>'
      : '<div class="card"><h2>Station konnte nicht geladen werden</h2><p>Bitte die Seite neu laden — die Stationsdaten waren gerade nicht erreichbar.</p></div>';
    return;
  }
  const say='Station '+sIdx+': '+s.name+'. '+s.desc;
  const nav=[];
  if(sIdx>1) nav.push('<a href="'+esc(stationUrl(sIdx-1))+'">← Station '+(sIdx-1)+'</a>');
  if(sIdx<sts.length) nav.push('<a href="'+esc(stationUrl(sIdx+1))+'">Station '+(sIdx+1)+' →</a>');
  el.innerHTML='<div class="card">'
    +'<div class="ey">Schatzsuche · Station '+sIdx+' von '+sts.length+'</div>'
    +'<h2><span class="stnum">'+sIdx+'</span>'+esc(s.name)+'</h2>'
    +'<p>'+esc(s.desc)+'</p>'
    +'<button class="vbtn screen-only" style="font-size:15px;padding:10px 18px;margin-top:8px" data-say="'+esc(say)+'" onclick="mlSpeak(this)">🔊 Station vorlesen</button>'
    +'<div class="nav">'+nav.join('')+'</div></div>';
  document.title='Station '+sIdx+' — Ritter-Schatzsuche';
}

  const el=document.getElementById('dossier');
  el.innerHTML =

    +shCertificates()
    +shTableCards()
    +shGuestsWishes()
    +shInvitations()
    +shHandzettel()

}
