/* ---------- Sektionen ---------- */
function shCover(){

    +'</div>'
    +(hints.length?'<div class="note">ℹ️ '+esc(hints.join(' '))+'</div>':'')
    +reserveBlock
    +(regen?'<div class="note">🌧️ <b>Plan B — '+esc(regen.label)+':</b> '+esc(regen.headline)+' Details in Teil III (SOS-Karte).</div>':'')
    +foot('Seite 2 · Ablaufplan'),'');
}

function shCountdown(){
  const pw=DATA.preparationWeeks||{};
  /* minus6Weeks existiert nur in piraten-gross.json — Reihenfolge deckt alle 3 Gruppen ab */
  const order=[['minus6Weeks','6 Wochen vorher'],['minus4Weeks','4 Wochen vorher'],['minus2Weeks','2 Wochen vorher'],['minus1Week','1 Woche vorher'],['minus2Days','2 Tage vorher'],['minus1Day','Vortag'],['dayOf','Der große Tag']];
  /* Gate-Befund 31.07.: Die Regex laesst "2026-13-45" durch — new Date(...) ist dann Invalid Date,
     aber TRUTHY. Beide Countdown-Filter vergleichen gegen NaN, liefern false, und Teil I druckte
     eine leere Seite (vorher gab es wenigstens "Invalid Date"-Labels). isNaN-Guard: kein Datum. */
  let base = /^\d{4}-\d{2}-\d{2}$/.test(PARTY.date||'') ? new Date(PARTY.date+'T12:00:00') : null;
  if(base && isNaN(base.getTime())) base = null;
  const offs={minus6Weeks:-42,minus4Weeks:-28,minus2Weeks:-14,minus1Week:-7,minus2Days:-2,minus1Day:-1,dayOf:0};
  /* Playtest 31.07. (Last-Minute-Persona, Party in 5 Tagen): Der Countdown druckte Stufen mit
     Datumsangaben in der VERGANGENHEIT ("bis 8. Jul") — eine halbe Seite, die dem Kaeufer im
     Bezahlmoment sagt "nicht fuer dich gemacht". Abgelaufene Stufen werden jetzt zu EINEM
     "Jetzt sofort"-Block zusammengezogen, statt tote Fristen zu drucken. */
  const today=new Date(); today.setHours(12,0,0,0);
  const dueDate=k=>{ if(!base) return null; const d=new Date(base); d.setDate(d.getDate()+offs[k]); return d; };
  const present=order.filter(([k])=>pw[k]);
  const past=base?present.filter(([k])=>dueDate(k)<today):[];
  const future=base?present.filter(([k])=>dueDate(k)>=today):present;
  /* Gate-M4-Familie (01.08.): auch Countdown-Items driften zwischen String und Objekt —
     ein String-Item druckte '<b>undefined</b>' (ausgerechnet ein Sicherheits-Check). */
  const liOf=b=>(b.items||[]).map(it=>{ if(typeof it==='string') return '<li><b>'+esc(it)+'</b></li>'; return '<li><b>'+esc((it.icon?it.icon+' ':'')+it.title)+'</b>'+(it.detail?'<span>'+esc(it.detail)+'</span>':'')+'</li>'; }).join('');
  let blocks='';
  if(past.length){
    /* Alle faelligen Punkte in einen Sofort-Block, Reihenfolge bleibt (frueheste zuerst). */
    blocks+='<div class="blk"><div class="when">Jetzt sofort<em>'+(past.length===present.length?'alles auf einmal':'nachholen')+'</em></div><ul>'+past.map(([k])=>liOf(pw[k])).join('')+'</ul></div>';
  }
  blocks+=future.map(([k,label])=>{
    const d=dueDate(k); const when=d?d.toLocaleDateString('de-DE',{day:'numeric',month:'short'}):'';
    return '<div class="blk"><div class="when">'+esc(label)+(when?'<em>bis '+esc(when)+'</em>':'')+'</div><ul>'+liOf(pw[k])+'</ul></div>';
  }).join('');
  const sub = !base ? 'Trag dein Datum im Planer ein, dann rechnen wir die Termine aus.'
    : (past.length ? ('kurzfristig geplant — der erste Block ist alles, was schon dran wäre (Party am '+fmtDate(PARTY.date)+')')
                   : ('gerechnet rückwärts ab '+fmtDate(PARTY.date)));
  return sheet(hd('Teil I · Vorbereitung','Countdown zum Piraten-Tag', sub)
    +'<div class="cd grow">'+blocks+'</div>'+foot('Seite 3 · Countdown'),'');
}

function shShopping(){
  const v=variant();
  const g=confirmedGuests().length;
  const items=(v.shoppingList||[]).map(it=>{
    const price=(typeof it.priceEur==='number')?('~'+String(it.priceEur).replace('.',',')+' €'):'';
    const link=(it.url&&it.hasAffiliate)?('<small><a href="'+esc(it.url)+'" target="_blank" rel="noopener sponsored">bei Amazon ansehen*</a></small>'):'';
    return '<div class="it"><span class="em">'+esc(it.emoji||'🛒')+'</span><span>'+esc(it.label)+link+'</span><span class="pr">'+esc(price)+'</span></div>';
  }).join('');
  return sheet(hd('Teil II · Einkauf','Einkaufsliste & Piraten-Menü', (g>0?('Für deine Crew von '+g+' Kindern. '):'')+(v.costContext||''))

function shGameCards(){

      +'<h3 style="font-size:17px;color:var(--navy);margin:4px 0 4px">'+esc(chosen.e+' '+chosen.t)+'</h3>'
      +'<p style="font-size:13px;margin:2px 0 8px">'+esc(chosen.s)+' Jeder Gast spielt es über die Einladung — und am Partytag läuft es auf dem Tablet in der Spielecke weiter.</p>'

    : '<div class="emptyhint"><b>Digitales Spiel:</b> Wähl im Planer ein Einladungs-Spiel, dann erscheint hier die Spielstation mit Link.</div>';
  const cards=(v.games||[]).map(g=>{
    /* parseDur statt Roh-String: klein/gross liefern "10 Min." — sonst stand "10 Min. Min" auf der Karte */
    const fac=[(g.duration?parseDur(g.duration)+' Min':''),(g.minAge?('ab '+g.minAge)+' J.':''),(g.indoor&&g.outdoor?'drinnen + draußen':(g.indoor?'drinnen':'draußen'))].filter(Boolean).join(' · ');
    /* Gate-M4 (01.08.): Motto-Daten liefern Steps mal als Strings (dino), mal als
       {name,content}-Objekte (piraten) — der Guard toleriert beide, wie der Ritual-Renderer. */
    const steps=(g.steps||[]).map(s=>{ if(typeof s==='string') return '<li>'+esc(s)+'</li>'; return '<li><b>'+esc(s.name)+':</b> '+esc(s.content)+'</li>'; }).join('');
    /* Gate-MAJOR 5 (30.07.): safetyRule (teils als PFLICHT markiert) MUSS auf die Vorlese-Karte */
    const safety=g.safetyRule?'<div class="mat" style="border-left:3px solid var(--rust)"><b>⚠️ Sicherheit:</b> '+esc(g.safetyRule)+'</div>':'';
    /* V2: Vorleser (nur Bildschirm) — liest Material, Sicherheit und Schritte vor */
    /* Bolle 01.08.: KEIN Vorleser auf Spielkarten — Materiallisten und Schritte sind
       Erwachsenen-Lesestoff. Vorlesen gibt es nur an den Schatzsuche-Stationen,
       wo eine Aufgabe/Story fuer die Kinder erzaehlt wird (shStations/renderStation). */
    return '<div class="gcard"><div class="gh"><h3>'+esc(stripEmojiLabel(g.name))+'</h3><span class="fac">'+esc(fac)+'</span></div>'
      +(g.material?'<div class="mat"><b>Material:</b> '+esc(g.material)+'</div>':'')
      +(g.prepText?'<div class="mat"><b>Vorbereitung:</b> '+esc(g.prepText)+'</div>':'')
      +safety
      +'<ol>'+steps+'</ol></div>';

  const rit=DATA.signatureRitual||{};
  const ritCard = rit.name ? '<div class="gcard" style="border-color:var(--rust)"><div class="gh"><h3>⚓ '+esc(rit.name)+'</h3><span class="fac">Anfang & Ende</span></div>'
      +(rit.introText?'<p style="font-size:13px;margin:4px 0">'+esc(rit.introText)+'</p>':'')
      +((rit.setupSteps&&rit.setupSteps.length)?('<ol>'+rit.setupSteps.map(s=>{ if(typeof s==='string') return '<li>'+esc(s)+'</li>'; const t=s.title||s.name||''; const c=s.content||''; return '<li>'+(t?'<b>'+esc(t)+':</b> ':'')+esc(c)+'</li>'; }).join('')+'</ol>'):'')
      +(rit.materialNote?'<div class="mat"><b>Material:</b> '+esc(rit.materialNote)+'</div>':'')+'</div>' : '';
  return sheet(hd('Teil III · Spiele','Spielkarten für deine Crew','Zum Vorlesen — Material, Schritte, Alter. Reihenfolge wie im Ablaufplan.')
    +'<div class="grow">'+digi+ritCard+cards+'</div>'+foot('Seiten 6-8 · Spielkarten'),'');

function shInvitations(){
  /* V2 (Bolle-Catch 30.07. „Einladungen?!"): Bordpost verzahnt sich mit dem BESTEHENDEN
     Party-Pass-System der Partyseite statt parallel zu laufen. Drei Quellen nach Prioritaet:
     1) party.invites (Name+ROLLE+Token) -> QR auf den persoenlichen ?g-Link (1-Tipp-Zusage)
     2) zugesagte Gaeste -> Namens-Karte mit generischem Party-QR (Nachzuegler/zweite Welle)
     3) Blanko mit generischem QR. Wizard-Partys starten mit LEEREN invites — der Hinweis
     unten macht die (versteckte) Crew-Anlage auf der Partyseite sichtbar. */
  const nm=(PARTY.childName||'').trim()||'Unser Piratenkind';
  const ds=fmtDate(PARTY.date); const t=PARTY.time?PARTY.time+' Uhr':'';
  const addr=PARTY.address||'';
  /* Abgleich invites<->guests (Token zuerst, dann Name) liegt im Kern: die Regel und
     ihre bewusste Grenze gelten fuer jedes Motto gleich. Siehe splitInvites(). */
  const sp=splitInvites(), invites=sp.open, declined=sp.declined;
  /* Re-Check 31.07.: declNote und der Alle-abgesagt-Hinweis standen doppelt untereinander und
     rieten beide zum Neudrucken. Der Text wird deshalb unten je nach Zweig EINMAL gesetzt. */
  const declLead=declined.length===1?'<b>Eine Absage:</b> für dieses Kind ist keine Karte dabei.':('<b>'+declined.length+' Absagen:</b> für diese Kinder sind keine Karten dabei.');
  const reprint=' Sagt doch noch jemand zu, drucke dieses Blatt einfach neu.';
  let declNote=declined.length ? '<div class="emptyhint" style="margin-bottom:14px">'+declLead+reprint+'</div>' : '';
  const mk=(gname,role,gtok,mission)=>{
    const purl = guestUrl(gtok);
    return '<div class="invcard"><div class="strow"><div class="stbody">'
      +'<div class="to">Geheime Bordpost für</div><div class="nm">'+(gname?esc(gname):'________________')+'</div>'
      +(role?'<p style="color:var(--rust);font-weight:700;margin-top:-3px">⚓ Deine Rolle an Bord: '+esc(role)+'</p>':'')
      +(role&&mission?'<p style="font-size:12px;color:var(--muted);margin-top:-2px">'+esc(mission)+'</p>':'')
      +'<p>🏴‍☠️ <b>'+esc(nm)+'</b> heuert eine Crew an'+(PARTY.age?(' — zum <b>'+esc(PARTY.age)+'. Geburtstag</b>'):'')+'!</p>'
      +(ds?'<p>📅 '+esc(ds)+(t?(' · ⏰ '+esc(t)):'')+'</p>':'')
      +(addr?'<p>📍 '+esc(addr)+'</p>':'')
      /* Re-Check 31.07.: „mit einem Tipp zusagen" stimmte nicht — Planer-Partys fragen immer
         Allergien/Abholung ab, damit ist der Autosend im Worker aus (INVITE_AUTOSEND=false).
         Ehrlicher Nutzen des Tokens: der Name ist schon eingetragen. */
      +'<p>'+(gtok?'Scannen — dein Name ist schon eingetragen, dein Party-Pass wartet:':'Alle Infos + kurz zusagen (Allergien &amp; Abholung) direkt hier:')+'</p>'
      +'<div class="url">'+esc(purl)+'</div></div>'
      +qrBlock(purl, gtok?'Dein persönlicher Link':'Zur Partyseite')
      +'</div></div>';
  };
  let cards='', note='';
  if(invites.length){
    /* Rollen-Name + Mission: invites tragen role-IDs; Katalog-Spiegel ROLES_P uebersetzt.
       F8: eine Blanko-Reserve auch hier — fuer das spontane siebte Kind. */
    cards = invites.map(i=>mk(i.n, roleLabel(i.role), i.t, roleMission(i.role))).join('') + mk('','','','');
  } else {
    const ja = confirmedGuests();
    if(ja.length){
      cards = ja.map(g=>mk(g.name,'','')).join('') + mk('','','');
      /* Re-Check 31.07.: Hat die eingetragene Crew KOMPLETT abgesagt und es gibt nur Walk-in-
         Zusagen, wäre „Trag die Namen deiner Crew ein" widersprüchlich — sie stehen ja drin. */
      note = declined.length
        ? '<div class="emptyhint" style="margin-bottom:14px">'+declLead+' Hier stehen die Karten der Kinder, die spontan zugesagt haben.'+reprint+'</div>'
        : '<div class="emptyhint" style="margin-bottom:14px"><b>Karten mit Rollen &amp; persönlichem QR-Code?</b> Trag die Namen deiner Crew ein — im Planer unter „Wer kommt?" oder auf deiner Partyseite (Bearbeiten → „💌 Persönliche Einladungen"). Dann bekommt jedes Kind hier seine eigene Karte mit Piraten-Rolle.</div>';
      if(declined.length) declNote = '';   // nicht doppelt
    } else {
      cards = mk('','','')+mk('','','')+mk('','','');
      /* Gate-Befund 31.07.: Wenn ALLE abgesagt haben, waere „Trag die Namen ein" falsch —
         sie sind ja eingetragen. Dann den passenden Hinweis zeigen. */
      if(declined.length){
        note = '<div class="emptyhint" style="margin-bottom:14px"><b>Alle haben abgesagt.</b> Deshalb hier nur Blanko-Karten mit dem allgemeinen Party-Code — für spontane Nachzügler.'+reprint+'</div>';
        declNote = '';   // Re-Check 31.07.: sonst stand der Neudruck-Rat zweimal untereinander
      } else {
        note = '<div class="emptyhint" style="margin-bottom:14px"><b>Tipp:</b> Trag die Namen deiner Crew ein — im Planer unter „Wer kommt?" oder auf deiner Partyseite (Bearbeiten → „💌 Persönliche Einladungen"). Dann stehen hier Namen + Piraten-Rollen und jedes Kind bekommt seinen eigenen QR-Code mit vorausgefülltem Namen. Bis dahin: Blanko-Karten mit dem allgemeinen Party-Code.</div>';
      }
    }
  }
  return sheet(hd('Teil IV · Einladungen','Bordpost für deine Crew','Ausschneiden und verteilen — der QR-Code führt direkt zur Zusage. Digital geht es wie gewohnt über deine Partyseite.')
    +'<div class="grow">'+declNote+note+cards+'</div>'+foot('Einladungen'),'');
}

/* ---------- V2: Schatzsuche-Stationskarten (QR -> Handy-Ansicht mit Vorleser) ---------- */
function shStations(){
  if(!SCHATZ) return '';
  const grp=ageGroup(PARTY.age);
  const sts=(SCHATZ.stations&&SCHATZ.stations[grp])||[];
  if(!sts.length) return '';
  const nm=(PARTY.childName||'').trim()||'die Crew';
  /* F1: Funktions-Replacement — sonst interpretiert String.replace $&, $', $`, $$ IM KINDERNAMEN
     (Name "Tino$'" haette den Intro-Rest dupliziert). Kein XSS, aber Text-Mangling durch Fremd-Input. */
  const intro=String((SCHATZ.intro&&SCHATZ.intro[grp])||'').replace('{name}',function(){ return nm; });
  const cards=sts.map((s,i)=>{
    const say=('Station '+(i+1)+': '+s.name+'. '+s.desc);
    return '<div class="gcard"><div class="strow"><div class="stbody">'
      +'<div class="gh"><h3><span class="stnum">'+(i+1)+'</span>'+esc(s.name)+'</h3><span class="fac">'+esc([(s.dauer?s.dauer+' Min':''),(s.typ||'')].filter(Boolean).join(' · '))+'</span></div>'
      +'<button class="vbtn screen-only" data-say="'+esc(say)+'" onclick="mlSpeak(this)">🔊 Vorlesen</button>'
      +'<p style="font-size:13.5px;margin:6px 0 4px">'+esc(s.desc)+'</p>'
      +(s.hint?'<div class="mat"><b>Vorbereitung:</b> '+esc(s.hint)+'</div>':'')
      +'</div>'+qrBlock(stationUrl(i+1),'Station '+(i+1)+' am Handy')+'</div></div>';
  }).join('');
  const mat=(SCHATZ.material&&SCHATZ.material[grp])||[];
  const matList=mat.length?'<div class="note">🧺 <b>Material komplett:</b> '+mat.map(esc).join(' · ')+'</div>':'';
  return sheet(hd('Teil III · Schatzsuche','Die 5 Stationen — Karten zum Aufhängen',intro)
    +'<div class="grow">'+cards+matList+'</div>'
    +'<div class="note screen-only">📱 <b>QR-Trick:</b> Karte an der Station aufhängen — wer sie scannt, bekommt die Station groß am Handy, mit Vorlese-Knopf für die Betreuer.</div>'
    +foot('Schatzsuche-Stationen'),'');
}

/* ---------- V2: Countdown-Poster (fuers Kind, vor der Party) ---------- */
function shPoster(){
  const nm=(PARTY.childName||'').trim();
  const ds=fmtDate(PARTY.date);
  let nights='';
  for(var i=14;i>=1;i--) nights+='<div class="night">'+i+'</div>';
  return sheet('<div class="poster grow"><div class="ey">Zum Aufhängen im Kinderzimmer</div>'
    +'<h2>'+(nm?esc(poss(nm))+' ':'')+'Piraten-Countdown</h2>'
    +'<div class="big">Noch ⬜ Nächte bis zur Party!</div>'
    +(ds?'<p style="color:var(--muted)">Der große Tag: <b>'+esc(ds)+'</b></p>':'')
    +'<div class="nights">'+nights+'</div>'
    +'<p style="font-size:12.5px;color:var(--muted);margin-top:16px">Jeden Abend einen Kreis ausmalen — wenn alle voll sind, geht es los! 🏴‍☠️</p></div>'
    +foot('Countdown-Poster'),'');
}

/* ---------- V2: Eltern-Handzettel (fuer die abgebenden Eltern) ---------- */
function shHandzettel(){
  const nm=(PARTY.childName||'').trim()||'Unser Kind';
  const ds=fmtDate(PARTY.date); const t=PARTY.time?PARTY.time+' Uhr':''; const et=PARTY.endTime?PARTY.endTime+' Uhr':'';
  const addr=PARTY.address||'';
  const card='<div class="cell"><div class="hzc"><div class="t">🏴‍☠️ '+esc(poss(nm))+' Piraten-Party — Eltern-Info</div>'
    +(ds?'<p>📅 '+esc(ds)+(t?(' · '+esc(t)):'')+(et?(' bis '+esc(et)):'')+'</p>':'')
    +(addr?'<p>📍 '+esc(addr)+'</p>':'')
    +'<p>✅ Bitte kurz zu-/absagen und Allergien melden:</p>'
    +'<p style="font-weight:700;color:var(--sea);word-break:break-all">'+esc(PARTYURL)+'</p>'
    +(PARTY.endTime?'<p>🕐 Abholung: '+esc(PARTY.endTime)+' Uhr</p>':'')
    +'</div></div>';
  const wa='🏴‍☠️ '+poss(nm)+' Piraten-Party!'+(ds?('\n📅 '+ds+(t?(' · '+t):'')):'')+(addr?('\n📍 '+addr):'')
    +'\n\nAlle Infos + Zusage (bitte Allergien angeben) hier:\n'+PARTYURL;
  return sheet(hd('Teil IV · Eltern-Info','Handzettel für die abgebenden Eltern','Viermal zum Ausschneiden — für Kita-Fach, Ranzen oder Haustür. Digital unten als WhatsApp-Text.')
    +'<div class="grow"><div class="cutgrid hz">'+card+card+card+card+'</div>'
    +'<div class="cuthint">✂️ An den Linien schneiden</div>'
    +'<div class="wacopy screen-only"><b>📲 Als WhatsApp-Text:</b>\n'+esc(wa)+'</div></div>'
    +foot('Eltern-Handzettel'),'');
}

/* ---------- V2: Stations-Modus (QR-Ziel) ---------- */
function renderStation(sIdx, grp){
  const el=document.getElementById('stmode');
  el.style.display='block';
  /* Gate-MAJOR F5 (30.07.): Rechtsfooter bleibt STEHEN. Der Stations-Modus ist eine
     gastgerichtete, eigenstaendig geoeffnete (QR!) und getrackte Unterseite — genau die
     Gattung, fuer die Welle 2 die Anbieterkennzeichnung nachgeruestet hat (§5 DDG,
     Art. 13 DSGVO). Ihn hier auszublenden wuerde die eigene Linie konterkarieren. */
  const sts=(SCHATZ&&SCHATZ.stations&&SCHATZ.stations[grp])||[];
  const s=sts[sIdx-1];
  if(!s){
    /* F4: Ladefehler (SCHATZ=null) liest sich sonst wie „Schatzsuche hat 0 Stationen" */
    el.innerHTML = sts.length
      ? '<div class="card"><h2>Station nicht gefunden</h2><p>Diese Schatzsuche hat '+sts.length+' Stationen.</p></div>'
      : '<div class="card"><h2>Station konnte nicht geladen werden</h2><p>Bitte die Seite neu laden — die Stationsdaten waren gerade nicht erreichbar.</p></div>';
    return;
  }
  const say='Station '+sIdx+': '+s.name+'. '+s.desc;
  const nav=[];
  if(sIdx>1) nav.push('<a href="'+esc(stationUrl(sIdx-1))+'">← Station '+(sIdx-1)+'</a>');
  if(sIdx<sts.length) nav.push('<a href="'+esc(stationUrl(sIdx+1))+'">Station '+(sIdx+1)+' →</a>');
  el.innerHTML='<div class="card">'
    +'<div class="ey">Schatzsuche · Station '+sIdx+' von '+sts.length+'</div>'
    +'<h2><span class="stnum">'+sIdx+'</span>'+esc(s.name)+'</h2>'
    +'<p>'+esc(s.desc)+'</p>'
    +'<button class="vbtn screen-only" style="font-size:15px;padding:10px 18px;margin-top:8px" data-say="'+esc(say)+'" onclick="mlSpeak(this)">🔊 Station vorlesen</button>'
    +(s.hint?'<div class="mat" style="margin-top:14px"><b>Nur für Betreuer:</b> '+esc(s.hint)+'</div>':'')
    +'<div class="nav">'+nav.join('')+'</div></div>';
  document.title='Station '+sIdx+' — Piraten-Schatzsuche';
}

/* ---------- Gesamt-Render ---------- */
function render(){
  const el=document.getElementById('dossier');
  el.innerHTML =
    shCover()
    +shTimeline()
    +shCountdown()
    +shPoster()
    +shShopping()
    +shDecoCake()
    +shGameCards()
    +shStations()
    +shSOS()
    +shCertificates()
    +shTableCards()
    +shGuestsWishes()
    +shInvitations()
    +shHandzettel()
    +shDanke()
    +shLogbuch();
}
