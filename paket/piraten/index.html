<style>
  /* ===== Design-System Piraten (Bolle-Freigabe 30.07.: Navy+Gold+Pergament) ===== */
  :root{
    --paper:#F3E7C9; --paper2:#EAD9B2; --ink:#2A2013; --muted:#6E5C43; --line:#D6C295;

  .vswitch button{border:0;background:transparent;color:#CFC1A0;font-size:12.5px;font-weight:700;
    padding:5px 12px;border-radius:99px;cursor:pointer}
  .vswitch button.on{background:var(--gold);color:#1a1305}
  .btn-print{border:0;background:var(--gold);color:#1a1305;font-weight:800;font-size:13px;
    padding:8px 16px;border-radius:10px;cursor:pointer}

  /* ===== Status / Fehler ===== */
  #status{max-width:720px;margin:40px auto;padding:0 18px;color:#EBDFC4;text-align:center;font-size:15px}
  #status .card{background:var(--navy);border:1px solid var(--gold);border-radius:14px;padding:26px 22px}
  #status a{color:var(--gold-lt)}

  /* ===== Blaetter: Footer IM FLUSS (Bolle-Bug 30.07.: absolute Footer wurde ueberlappt) ===== */
  .stack{display:flex;flex-direction:column;align-items:center;gap:26px;padding:26px 12px 70px}
  .sheet{width:min(760px,96vw);background:var(--paper);border-radius:6px;color:var(--ink);

    padding:34px 38px 18px;min-height:520px}
  .sheet .grow{flex:1}
  .sheetfoot{margin-top:26px;border-top:1px solid var(--line);padding-top:9px;

  h1,h2,h3,h4{font-family:var(--serif);line-height:1.14;margin:0}
  .ey{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--rust);font-weight:700}
  .hd{display:flex;align-items:center;gap:13px;border-bottom:2px solid var(--gold);padding-bottom:11px;margin-bottom:16px}
  .hd h2{font-size:24px;color:var(--navy)}
  .hd svg{flex:none}
  .sub{color:var(--muted);font-size:13.5px;margin:2px 0 0}

  .cover .brand2{font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:#C9AE6E;font-weight:700}
  .cover .kind{font-family:var(--serif);font-style:italic;color:#D9C79A;font-size:14.5px;margin-top:6px}
  .cover h1{font-size:clamp(30px,6vw,46px);color:#F7ECCB;margin:16px 0 8px;text-shadow:0 2px 18px rgba(0,0,0,.35)}

  .cover svg.sea{position:absolute;left:0;right:0;bottom:0;width:100%;height:72%;z-index:1}
  .cover .ribbon{position:absolute;bottom:64px;left:50%;transform:translateX(-50%);z-index:4;

  .cover .cfoot .mk{font-family:var(--serif);font-weight:700;color:var(--gold-lt)}

  /* Timeline */
  .tl .row{display:grid;grid-template-columns:64px 1fr;gap:14px;padding:11px 0;break-inside:avoid}
  .tl .row+.row{border-top:1px dashed var(--line)}
  .tl .t{font-family:var(--serif);font-weight:700;color:var(--rust);font-size:16px;white-space:nowrap}
  .tl b{font-size:15px;font-weight:600;display:block}
  .tl span{font-size:12.5px;color:var(--muted)}
  .tag{display:inline-block;margin-left:6px;font-size:10px;font-weight:700;letter-spacing:.05em;

  .tag.gold{color:var(--gold);background:rgba(185,135,36,.13)}

    padding:10px 13px;font-size:12.5px;color:#5a4a34;break-inside:avoid}

  /* Countdown */

  .cd .when{font-family:var(--serif);font-weight:700;color:var(--navy);font-size:15.5px}

  .shop .it small{display:block;color:var(--muted);font-size:11.5px}
  .shop .it a{color:var(--rust);text-decoration:none;border-bottom:1px dotted var(--rust)}
  .cols2{display:grid;grid-template-columns:1fr 1fr;gap:8px 26px}
  @media(max-width:640px){.cols2{grid-template-columns:1fr}}
  .plain{white-space:pre-line;font-size:13.5px}
  .plain-tight{white-space:pre-line;font-size:13px;color:#4a3d2b}

  /* Spielkarten */
  .gcard{border:1.5px solid var(--gold);border-radius:12px;padding:16px 18px;margin-bottom:14px;
    background:linear-gradient(180deg,rgba(185,135,36,.05),transparent 40%);break-inside:avoid}
  .gcard .gh{display:flex;justify-content:space-between;align-items:baseline;gap:10px;border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:8px}
  .gcard h3{font-size:17px;color:var(--navy)}
  .gcard .fac{font-size:11px;color:var(--muted);white-space:nowrap}
  .gcard .mat{font-size:12.5px;color:#5a4a34;background:var(--paper2);border-radius:8px;padding:7px 11px;margin:7px 0}
  .gcard .mat b{color:var(--navy)}
  .gcard ol{margin:8px 0 2px;padding-left:20px}
  .gcard ol li{font-size:13px;padding:3px 0}
  .gcard ol li b{font-weight:600}
  .digi{border:1.5px dashed var(--sea);border-radius:12px;padding:14px 18px;margin-bottom:14px;break-inside:avoid}
  .digi .lnk{font-family:var(--serif);font-weight:700;color:var(--sea);font-size:15px;word-break:break-all}

  /* Urkunde */
  .sheet.cert{text-align:center;position:relative;min-height:920px}
  .cert .frame{position:absolute;inset:22px;border:2px solid var(--gold);border-radius:4px;pointer-events:none}

  .cert .cin{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:34px 30px 8px}
  .cert .ey{letter-spacing:.24em}
  .cert h2{font-size:34px;color:var(--navy);margin:8px 0 2px;border:0}
  .cert .csub{font-family:var(--serif);font-style:italic;color:var(--muted);font-size:14px}
  .cert .verl{margin-top:36px;font-size:13.5px;color:var(--muted)}
  .cert .cname{font-family:var(--serif);font-size:44px;color:var(--rust);margin:4px 0 0;line-height:1.05;min-height:52px}
  .cert .rule{width:52%;height:1px;background:var(--gold);margin:6px auto 0}
  .cert .cbody{margin-top:30px;font-size:14px;color:#4a3d2b;max-width:80%;line-height:1.6}
  .cert .cbody b{color:var(--navy)}
  .cert .seal{margin-top:30px}
  .cert .sign{margin-top:34px;display:flex;gap:12%;justify-content:center;width:100%;font-size:11px;color:var(--muted)}
  .cert .sign .s{flex:0 1 34%}
  .cert .sign .s .ln{border-top:1px solid var(--ink);padding-top:3px}
  .cert .sign .s .v{font-family:var(--serif);color:var(--navy);font-size:14px;padding-bottom:2px}

  /* Tischkaertchen / Etiketten */
  .cutgrid{display:grid;grid-template-columns:1fr 1fr;gap:0;border:1px dashed #b39}
  .cutgrid{border:1px dashed var(--muted)}
  .cutgrid .cell{border:1px dashed var(--muted);padding:0;min-height:150px;display:flex;align-items:center;justify-content:center}
  .tcard{text-align:center;padding:18px 10px}
  .tcard .flag{font-size:20px}
  .tcard .nm{font-family:var(--serif);font-size:24px;color:var(--navy);font-weight:700}
  .tcard .rl{font-size:11px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-top:2px}
  .lbl{text-align:center;padding:14px 8px}
  .lbl .t1{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--rust);font-weight:700}
  .lbl .nm{font-family:var(--serif);font-size:19px;color:var(--navy);font-weight:700;margin:2px 0}
  .lbl .s{font-size:10.5px;color:var(--muted)}
  .cuthint{font-size:11px;color:var(--muted);margin-top:8px}

  /* Tabellen (Allergie/Abholung, Wunschliste) */
  table.tb{width:100%;border-collapse:collapse;font-size:13px}
  .tb th{font-family:var(--serif);text-align:left;color:var(--navy);border-bottom:2px solid var(--gold);padding:7px 8px;font-size:13px}
  .tb td{border-bottom:1px dotted var(--line);padding:7px 8px;vertical-align:top}
  .tb td.mu{color:var(--muted)}
  .pillok{color:var(--ok);font-weight:700}

  /* Einladungskarten */
  .invcard{border:2px solid var(--navy);border-radius:12px;padding:18px 20px;margin-bottom:14px;
    background:linear-gradient(180deg,rgba(18,50,74,.05),transparent 45%);break-inside:avoid}
  .invcard .to{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--rust);font-weight:700}
  .invcard .nm{font-family:var(--serif);font-size:22px;color:var(--navy);font-weight:700;margin:1px 0 7px}
  .invcard p{margin:4px 0;font-size:13.5px}
  .invcard .url{font-size:12.5px;color:var(--sea);word-break:break-all;font-weight:600}

  .emptyhint{border:1.5px dashed var(--line);border-radius:12px;padding:16px 18px;font-size:13.5px;
    color:var(--muted);background:rgba(255,255,255,.35);break-inside:avoid}
  .emptyhint b{color:var(--navy)}

  /* Rechtsfooter (nur Bildschirm) */
  .legal{max-width:760px;margin:0 auto;padding:0 14px 46px;text-align:center;font-size:12px;color:#b9b3a4}
  .legal a{color:#d8cba6}

  /* ===== Druck ===== */
  @page{size:A4;margin:11mm}
  @media print{
    body{background:#fff}
    .toolbar,.legal,#status,.screen-only{display:none !important}
    .stack{padding:0;gap:0;display:block}
    .sheet{width:auto;min-height:0;box-shadow:none;border-radius:0;page-break-after:always;
      padding:6mm 4mm 4mm;background:var(--paper) !important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
    .sheet.cover,.sheet.cert{min-height:262mm}
    .sheet:last-child{page-break-after:auto}
    a{text-decoration:none;color:inherit}
    .shop .it a{border-bottom:0;color:inherit}
  }
</style>
</head>

<script>
"use strict";
/* =====================================================================
   PIRATEN-KOMPLETTPAKET (Pilot) — Generator
   Datenquellen:
   - party.machsleicht.de/api/party/<id>?edit=<token>  (Schicht A-Basis + C: Kind, Datum, Gaeste, Wuensche, gameId)
   - /data/motto/piraten-<klein|mittel|gross>.json      (Schicht A+B: Programm, Spiele, Einkauf, Countdown, Kuchen, SOS)
   Ohne gueltigen edit-Token liefert der Worker das Public-Objekt (ohne Gaeste/Adresse)
   -> das Paket rendert dann mit Hinweis statt Namen. ?demo=1 rendert Beispieldaten.
   ===================================================================== */

/* ---------- Helpers ---------- */
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
/* Possessiv nach Bolle-Regel: Name+s, bei Zischlaut-Endung (s/ß/x/z) nur Apostroph (Mats') */
function poss(n){ n=String(n||'').trim(); if(!n) return ''; return /[sßxz]$/i.test(n) ? n+'’' : n+'s'; }
function fmtDate(iso){ /* YYYY-MM-DD -> "Samstag, 12. September 2026" */
  if(!/^\d{4}-\d{2}-\d{2}$/.test(iso||'')) return '';
  const d = new Date(iso+'T12:00:00');
  if(isNaN(d)) return '';
  return d.toLocaleDateString('de-DE',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
}
function parseHM(s){ const m=/^(\d{1,2}):(\d{2})$/.exec(String(s||'').trim()); return m ? (+m[1])*60+(+m[2]) : null; }
function fmtHM(min){ min=((min%1440)+1440)%1440; return String(Math.floor(min/60)).padStart(2,'0')+':'+String(min%60).padStart(2,'0'); }
function stripEmojiLabel(s){ return String(s||'').replace(/\s*—\s*Spielanleitung\s*$/,''); }

/* Kurz-Metadaten des gewaehlten Einladungs-Spiels (Teilmenge GAME_META, piraten) */
const GAME_META_P = {
  "piraten-klassik":{t:"Der Klassiker",s:"Einfaches Tipp-Spiel — antippen, knacken, Überraschung. Perfekt schon für die Kleinsten.",e:"✨"},
  "kanone-piraten":{t:"Kanonen-Schuss",s:"Die Schatzkarte ist hinter dicken Brettern vernagelt!",e:"💣"},
  "flaschenpost-piraten":{t:"Flaschenpost",s:"In der Flasche steckt eine geheime Nachricht.",e:"🍾"},
  "memory-piraten":{t:"Schatz-Memory",s:"Hinter den Schatzkarten versteckt sich jemand.",e:"🗺"},
  "piraten-schatzjagd":{t:"Die Schatzjagd",s:"9 Felder aufdecken, den Dieb schnappen — Foto-Finale!",e:"🪙"}
};

/* ---------- Demo-Daten (fuer ?demo=1 / Review) ---------- */
const DEMO_PARTY = {
  childName:"Tino", age:"8", motto:"Piraten", mottoId:"piraten", mottoEmoji:"🏴‍☠️",
  date:"2026-09-12", time:"14:00", endTime:"17:00", address:"Ankerweg 7, 21075 Hamburg",
  gameId:"kanone-piraten",
  guests:[
    {name:"Emma", status:"ja", allergies:"Erdnüsse", pickupPerson:"Papa Jens", pickupTime:"17:00"},
    {name:"Mats", status:"ja", allergies:"", pickupPerson:"", pickupTime:""},
    {name:"Lina", status:"ja", allergies:"laktosefrei", pickupPerson:"Oma", pickupTime:"16:45"},
    {name:"Noah", status:"ja", allergies:"", pickupPerson:"", pickupTime:""},
    {name:"Ida", status:"nein", allergies:"", pickupPerson:"", pickupTime:""}
  ],
  wishes:[{title:"LEGO Piratenschiff",price:"39,99 €",sharedGift:true},{title:"Kapla Steine",price:"",sharedGift:false},{title:"Buch: Piratengeschichten",price:"",sharedGift:false}],
  invites:[{n:"Emma"},{n:"Mats"},{n:"Lina"},{n:"Noah"},{n:"Ida"},{n:"Ben"}]
};

/* ---------- State ---------- */
let PARTY=null, DATA=null, VARIANT='standard', HASTOKEN=false, PARTYURL='';

function ageGroup(age){ const n=parseInt(age,10); if(!isFinite(n)) return 'mittel'; if(n<=5) return 'klein'; if(n<=8) return 'mittel'; return 'gross'; }

/* ---------- Boot ---------- */
(async function boot(){
  const q = new URLSearchParams(location.search);
  const demo = q.get('demo')==='1';
  let id = (q.get('id')||q.get('p')||'').replace(/[^a-z0-9]/gi,'');
  let tok = (q.get('edit')||q.get('token')||'').replace(/[^a-z0-9]/gi,'');
  // Token-Hygiene: editToken ist der einzige Schluessel zur Party. Er darf NICHT dauerhaft
  // in der Adresszeile stehen (Umami trackt Pageview-URLs; Verlauf/Screenshots leaken).
  // -> in sessionStorage sichern, URL sofort bereinigen; Reload holt ihn aus dem Storage.
  try{
    if(tok && id){ sessionStorage.setItem('paketAuth', id+':'+tok); }
    else if(id){ const s=(sessionStorage.getItem('paketAuth')||'').split(':'); if(s[0]===id && s[1]) tok=s[1]; }
    if(q.has('edit')||q.has('token')){
      q.delete('edit'); q.delete('token');
      history.replaceState(null,'',location.pathname+(q.toString()?('?'+q.toString()):''));
    }
  }catch(e){ /* sessionStorage gesperrt (Privatmodus): Token bleibt in-memory, URL wird trotzdem bereinigt-best-effort */ }
  const st = document.getElementById('status');
  try{
    if(demo){ PARTY = DEMO_PARTY; HASTOKEN = true; PARTYURL='https://party.machsleicht.de/demo'; }
    else{
      if(!id){ st.innerHTML='<div class="card"><b>Kein Party-Link.</b><br>Dieses Paket wird aus deiner Partyseite gebaut. Öffne es über den Button im <a href="/kindergeburtstag">Planer</a> — oder schau dir die <a href="?demo=1">Beispiel-Vorschau</a> an.</div>'; return; }
      const r = await fetch('https://party.machsleicht.de/api/party/'+encodeURIComponent(id)+(tok?('?edit='+encodeURIComponent(tok)):''));
      if(!r.ok) throw new Error('Party nicht gefunden (HTTP '+r.status+')');
      PARTY = await r.json();
      HASTOKEN = !!(tok && PARTY && PARTY.editToken);   /* voller Datensatz nur mit korrektem Token (Worker liefert editToken nur dann mit) */
      PARTYURL = 'https://party.machsleicht.de/'+id;
    }
    const grp = ageGroup(PARTY.age);
    const dr = await fetch('/data/motto/piraten-'+grp+'.json');
    if(!dr.ok) throw new Error('Piraten-Daten fehlen ('+grp+')');
    DATA = await dr.json();
    try{ if(window.plausible) plausible('paket_view',{props:{motto:'piraten', demo: demo?'1':'0', full: HASTOKEN?'1':'0'}}); }catch(e){}
    st.style.display='none';

function buildTimeline(){
  /* Deterministischer Ablauf aus party.time/endTime + Varianten-Spielen + Signature-Ritual.
     Reihenfolge: Ankunft/Aufnahme -> 2 Spiele -> Essen -> restliche Spiele -> freies Spiel -> Uebergabe -> Ende */
  const start = parseHM(PARTY.time) ?? parseHM('14:00');
  let end = parseHM(PARTY.endTime); if(end==null || end<=start) end = start+180;
  const v = variant();
  const games = (v.games||[]).map(g=>({name:stripEmojiLabel(g.name), dur:(+g.duration||15)}));
  const rit = DATA.signatureRitual||{};
  const rows=[]; let t=start;
  const push=(dur,tit,sub,tag)=>{ rows.push({t:fmtHM(t),tit,sub,tag}); t+=dur; };
  push(20,'Landgang & Piraten-Aufnahme', (rit.name?rit.name+' — ':'')+'Ankommen, Augenklappe & Kopftuch, Crew-Foto vor der Kulisse.','ritual');
  const firstTwo = games.slice(0,2), rest = games.slice(2);
  firstTwo.forEach(g=>push(g.dur+5, g.name, 'Anleitung auf der Spielkarte in Teil III.','spiel'));
  push(40,'Kombüse: Kuchen & Kanonenkugeln','Pause am Tisch — Menü und Mengen stehen in Teil II.','menu');
  rest.forEach(g=>push(g.dur+5, g.name, 'Anleitung auf der Spielkarte in Teil III.','spiel'));
  const remaining = (end-15)-t;
  if(remaining>=10) push(remaining,'Freies Toben & Beutezug','Auslauf für die Crew — Goodie-Bags stehen bereit.','');
  rows.push({t:fmtHM(end-15),tit:'Schatzkisten-Übergabe & Urkunden',sub:'Urkunden aus Teil IV verleihen, Mitgebsel verteilen.',tag:'ritual'});
  rows.push({t:fmtHM(end),tit:'Landgang zu Ende — Abholung',sub:'Abhol-Infos je Kind stehen in der Gästeübersicht (Teil IV).',tag:''});
  return rows;
}

function shCountdown(){
  const pw=DATA.preparationWeeks||{};
  /* minus6Weeks existiert nur in piraten-gross.json — Reihenfolge deckt alle 3 Gruppen ab */
  const order=[['minus6Weeks','6 Wochen vorher'],['minus4Weeks','4 Wochen vorher'],['minus2Weeks','2 Wochen vorher'],['minus1Week','1 Woche vorher'],['minus2Days','2 Tage vorher'],['minus1Day','Vortag'],['dayOf','Der große Tag']];
  const base = /^\d{4}-\d{2}-\d{2}$/.test(PARTY.date||'') ? new Date(PARTY.date+'T12:00:00') : null;
  const offs={minus6Weeks:-42,minus4Weeks:-28,minus2Weeks:-14,minus1Week:-7,minus2Days:-2,minus1Day:-1,dayOf:0};
  const blocks=order.filter(([k])=>pw[k]).map(([k,label])=>{
    const b=pw[k]; let when='';
    if(base){ const d=new Date(base); d.setDate(d.getDate()+offs[k]); when=d.toLocaleDateString('de-DE',{day:'numeric',month:'short'}); }
    const items=(b.items||[]).map(it=>'<li><b>'+esc((it.icon?it.icon+' ':'')+it.title)+'</b>'+(it.detail?'<span>'+esc(it.detail)+'</span>':'')+'</li>').join('');
    return '<div class="blk"><div class="when">'+esc(label)+(when?'<em>bis '+esc(when)+'</em>':'')+'</div><ul>'+items+'</ul></div>';
  }).join('');
  return sheet(hd('Teil I · Vorbereitung','Countdown zum Piraten-Tag', base?('gerechnet rückwärts ab '+fmtDate(PARTY.date)):'Trag dein Datum im Planer ein, dann rechnen wir die Termine aus.')
    +'<div class="cd grow">'+blocks+'</div>'+foot('Seite 3 · Countdown'),'');
}

    +'<div class="grow">'+hint
    +'<table class="tb"><thead><tr><th>Kind</th><th>Allergien / Essen</th><th>Abholung</th></tr></thead><tbody>'+rows+'</tbody></table>'
    +'<h3 style="font-size:16px;color:var(--navy);margin:20px 0 8px">🎁 '+esc(poss((PARTY.childName||'').trim()||'Unser Kind'))+' Wunschliste</h3>'
    +'<table class="tb"><thead><tr><th>Wunsch</th><th>ca.-Preis</th></tr></thead><tbody>'+wrows+'</tbody></table></div>'
    +foot('Küchen-Zettel'),'');
}

function shInvitations(){
  const nm=(PARTY.childName||'').trim()||'Unser Piratenkind';
  const ds=fmtDate(PARTY.date); const t=PARTY.time?PARTY.time+' Uhr':'';
  const addr=PARTY.address||'';
  const invites=(Array.isArray(PARTY.invites)?PARTY.invites:[]).filter(i=>i&&i.n);
  const mk=(gname)=>('<div class="invcard"><div class="to">Geheime Bordpost für</div><div class="nm">'+(gname?esc(gname):'________________')+'</div>'
    +'<p>🏴‍☠️ <b>'+esc(nm)+'</b> heuert eine Crew an'+(PARTY.age?(' — zum <b>'+esc(PARTY.age)+'. Geburtstag</b>'):'')+'!</p>'
    +(ds?'<p>📅 '+esc(ds)+(t?(' · ⏰ '+esc(t)):'')+'</p>':'')
    +(addr?'<p>📍 '+esc(addr)+'</p>':'')
    +'<p>Alle Infos + kurz zusagen (Allergien &amp; Abholung) direkt hier:</p>'
    +'<div class="url">'+esc(PARTYURL)+'</div></div>');
  const cards = invites.length ? invites.map(i=>mk(i.n)).join('') : (mk('')+mk('')+mk(''));
  const note = invites.length?'':'<div class="emptyhint" style="margin-bottom:14px"><b>Tipp:</b> Namen der eingeladenen Kinder stehen hier automatisch, wenn du sie beim Erstellen der Partyseite angibst — bis dahin: Blanko-Karten zum Selbstbeschriften.</div>';
  return sheet(hd('Teil IV · Einladungen','Bordpost für deine Crew','Ausschneiden und verteilen — oder digital per WhatsApp über deine Partyseite verschicken.')
    +'<div class="grow">'+note+cards+'</div>'+foot('Einladungen'),'');
}

/* ---------- Gesamt-Render ---------- */
function render(){
  const el=document.getElementById('dossier');
  el.innerHTML =
    shCover()
    +shTimeline()
    +shCountdown()
    +shShopping()
    +shDecoCake()
    +shGameCards()
    +shSOS()
    +shCertificates()
    +shTableCards()
    +shGuestsWishes()
    +shInvitations();
}
</script>
</body>
</html>
