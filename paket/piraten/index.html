<script>
// Shim: plausible()-Aufrufe auf umami.track() mappen (Provider-Abstraktion, Konvention CLAUDE.md).
// F11 (Gate 30.07.): Umami laedt mit defer, die ersten Events (paket_view/paket_station) feuern
// nach schnellen Same-Origin-Fetches oft VORHER — der alte Shim verwarf sie still (Undercount
// genau der neuen Station-Metrik). Jetzt: Mini-Queue + Flush, sobald umami da ist.
window.plausible=function(name,opts){
  var props=(opts&&opts.props)||{};
  if(window.umami){ try{ umami.track(name,props); }catch(e){} return; }
  try{ window.plausible.q.push([name,props]); }catch(e){}
};
window.plausible.init=function(){};window.plausible.q=[];
(function(){
  var tries=0;
  var iv=setInterval(function(){
    tries++;
    if(window.umami){
      clearInterval(iv);
      var q=window.plausible.q||[]; window.plausible.q=[];
      q.forEach(function(e){ try{ umami.track(e[0],e[1]); }catch(x){} });
    } else if(tries>40){
      clearInterval(iv);
      /* ~10 s: Tracker blockiert/Spaetlader -> Queue wirklich verwerfen und nie mehr anfuellen
         (Re-Check-Nit: vorher log der Kommentar, q wuchs still weiter). Direkt-Track bleibt,
         falls Umami doch noch spaeter laedt. */
      window.plausible=function(name,opts){ if(window.umami){ try{ umami.track(name,(opts&&opts.props)||{}); }catch(e){} } };
    }
  },250);
})();

<style>
  /* ===== Design-System Piraten (Bolle-Freigabe 30.07.: Navy+Gold+Pergament) ===== */

<script>
"use strict";
/* =====================================================================
   PIRATEN-KOMPLETTPAKET (Pilot) — Generator
   Datenquellen:
   - party.machsleicht.de/api/party/<id>?edit=<token>  (Schicht A-Basis + C: Kind, Datum, Gaeste, Wuensche, gameId)
   - /data/motto/piraten-<klein|mittel|gross>.json      (Schicht A+B: Programm, Spiele, Einkauf, Countdown, Kuchen, SOS)
   Ohne gueltigen edit-Token liefert der Worker das Public-Objekt (ohne Gaeste/Adresse)
   -> das Paket rendert dann mit Hinweis statt Namen. ?demo=1 rendert Beispieldaten.
   ===================================================================== */

/* ---------- Helpers ---------- */
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
/* Possessiv nach Bolle-Regel: Name+s, bei Zischlaut-Endung (s/ß/x/z) nur Apostroph (Mats') */
function poss(n){ n=String(n||'').trim(); if(!n) return ''; return /[sßxz]$/i.test(n) ? n+'’' : n+'s'; }
function fmtDate(iso){ /* YYYY-MM-DD -> "Samstag, 12. September 2026" */
  if(!/^\d{4}-\d{2}-\d{2}$/.test(iso||'')) return '';
  const d = new Date(iso+'T12:00:00');
  if(isNaN(d)) return '';
  return d.toLocaleDateString('de-DE',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
}

function fmtHM(min){ min=((min%1440)+1440)%1440; return String(Math.floor(min/60)).padStart(2,'0')+':'+String(min%60).padStart(2,'0'); }

/* Stimmen-Auswahl (Bolle 30.07.: Default klang „wie Navigationssystem 1995").
   speechSynthesis nimmt sonst die schlechteste Kompakt-Stimme. Heuristik: Premium/Enhanced/
   Neural > Google-Netzstimme (Chrome/Android, deutlich natuerlicher) > Netz > Rest;
   Eloquence/eSpeak-Klasse aktiv abwerten. onvoiceschanged, weil die Liste async kommt. */
var VOICE=null;
function pickVoice(){
  try{
    var vs=window.speechSynthesis.getVoices().filter(function(v){ return /^de([-_]|$)/i.test(v.lang||''); });
    if(!vs.length) return null;
    function score(v){
      var n=(v.name||'').toLowerCase(), s=0;
      if(/siri/.test(n)) s+=50;
      if(/premium|enhanced|erweitert|neural|natural/.test(n)) s+=40;
      if(/google/.test(n)) s+=30;
      if(v.localService===false) s+=15;
      if(/anna|petra|helena|katja|viktoria|markus|conrad/.test(n)) s+=5;
      if(/eloquence|compact|espeak|robot/.test(n)) s-=40;
      return s;
    }
    vs.sort(function(a,b){ return score(b)-score(a); });
    return vs[0]||null;
  }catch(e){ return null; }
}
try{ window.speechSynthesis.onvoiceschanged=function(){ VOICE=pickVoice(); }; VOICE=pickVoice(); }catch(e){}
/* Re-Check N3: Generationszaehler + gemerkter Timer — sonst konnte (a) ein Stopp-Klick im
   60-ms-Fenster den geplanten Start NICHT verhindern und (b) ein spaetes onend eines
   gecancelten u den Status der NEUEN Session loeschen. */
var speakGen=0, speakTimer=null;
function speak(txt,btn){
  try{
    if(!('speechSynthesis' in window)){ alert('Vorlesen wird von diesem Browser nicht unterstützt.'); return; }
    var ss=window.speechSynthesis;
    if(speakTimer){ clearTimeout(speakTimer); speakTimer=null; }
    var gen=++speakGen;
    /* F6: Toggle statt Neustart — Klick auf den LAUFENDEN Knopf stoppt (vorher liess sich
       eine lange Spielkarte gar nicht stummschalten). */
    if(btn && btn.classList.contains('speaking')){
      ss.cancel(); btn.classList.remove('speaking'); return;
    }
    document.querySelectorAll('.vbtn.speaking').forEach(function(b){ b.classList.remove('speaking'); });
    var busy = ss.speaking || ss.pending;
    if(busy) ss.cancel();
    var u=new SpeechSynthesisUtterance(txt);
    u.lang='de-DE'; u.rate=0.97; u.pitch=1.02;
    if(!VOICE) VOICE=pickVoice();
    if(VOICE) u.voice=VOICE;
    if(btn){ btn.classList.add('speaking'); u.onend=u.onerror=function(){ if(gen===speakGen) btn.classList.remove('speaking'); }; }
    /* F7: iOS/WebKit verschluckt Utterances, wenn cancel() und speak() synchron aufeinander
       folgen — nach einem echten cancel deshalb kurz warten (Stations-Modus IST das Handy-Produkt). */
    if(busy) speakTimer=setTimeout(function(){ speakTimer=null; if(gen!==speakGen) return; try{ ss.speak(u); }catch(e){} }, 60);
    else ss.speak(u);
    try{ if(window.plausible) plausible('paket_vorleser',{props:{motto:'piraten'}}); }catch(e){}
  }catch(e){}
}

     Wirft sessionStorage (Safari "Alle Cookies blockieren", geblockte Site-Daten),
     muss replaceState TROTZDEM laufen — sonst bleibt der Token in der URL und
     geht mit der Umami-Pageview an den Drittanbieter. Key je Party-ID (Zweittab-safe). */

    if(q.has('edit')||q.has('token')){
      q.delete('edit'); q.delete('token');

/* Gate-MAJOR 3 (30.07.): duration ist in klein/gross ein String ("45 Min.") — +g.duration
   ergab NaN -> stiller 15er-Fallback. parseInt liest die fuehrende Zahl aus beidem. */
function parseDur(d){ const n=parseInt(d,10); return (isFinite(n)&&n>0)?n:15; }
function buildTimeline(){
  /* Gate-MAJOR 2 (30.07.): Zeilen werden NUR noch hinter einem monoton laufenden Zeiger
     gedruckt. Spiele, die nicht mehr vor die Schatzkisten-Uebergabe passen, wandern in
     eine zeitlose Reserve-Liste ("wenn Zeit bleibt") — nie wieder Rueckwaerts-Uhrzeiten.
     Reihenfolge: Ankunft/Aufnahme -> 2 Spiele -> Essen -> restliche Spiele -> freies Spiel
     -> Uebergabe (end-15) -> Ende. */
  const timeAssumed = parseHM(PARTY.time)==null;
  const start = parseHM(PARTY.time) ?? parseHM('14:00');
  const endRaw = parseHM(PARTY.endTime);
  const endAssumed = (endRaw==null || endRaw<=start);
  const end = endAssumed ? start+180 : endRaw;
  const UEBERGABE=15, ESSEN=40, ESSEN_MIN=25, RIT=20;
  const endCap = end - UEBERGABE;                      /* letzte planbare Minute */
  const v = variant();
  const games = (v.games||[]).map(g=>({name:stripEmojiLabel(g.name), dur:parseDur(g.duration)}));
  const rit = DATA.signatureRitual||{};
  const rows=[]; const reserve=[]; let t=start; let essenDone=false;
  const push=(dur,tit,sub,tag)=>{ rows.push({t:fmtHM(t),tit,sub,tag}); t+=dur; };
  push(Math.min(RIT,Math.max(10,endCap-t)),'Landgang & Piraten-Aufnahme','Ankommen, Augenklappe & Kopftuch, Crew-Foto vor der Kulisse ('+(rit.name||'Piraten-Aufnahme')+').','ritual');
  const queue=[]; const firstTwo=games.slice(0,2), rest=games.slice(2);
  firstTwo.forEach(g=>queue.push({game:g})); queue.push({essen:true}); rest.forEach(g=>queue.push({game:g}));
  for(const item of queue){
    if(item.essen){
      const d=Math.max(Math.min(ESSEN,endCap-t),0);
      if(d>=ESSEN_MIN){ push(d,'Kombüse: Kuchen & Kanonenkugeln','Pause am Tisch — Menü und Mengen stehen in Teil II.','menu'); }
      else if(endCap-t>=10){ push(endCap-t,'Kombüse: Kuchen & Kanonenkugeln (kompakt)','Kurzes Fenster — Kuchen zuerst, Snacks nebenher.','menu'); }
      essenDone=true; continue;
    }
    const need=item.game.dur+5 + (essenDone?0:ESSEN_MIN);   /* vor dem Essen Platz fuers Essen freihalten */
    if(t+need<=endCap){ push(item.game.dur+5, item.game.name, 'Anleitung auf der Spielkarte in Teil III.','spiel'); }
    else reserve.push(item.game);
  }
  const remaining = endCap-t;
  if(remaining>=10) push(remaining,'Freies Toben & Beutezug','Auslauf für die Crew — Goodie-Bags stehen bereit.','');
  /* Re-Check N1: bei pathologisch kurzem Fenster (<15 Min) darf die Uebergabe nie vor dem Zeiger liegen */
  rows.push({t:fmtHM(Math.max(end-UEBERGABE,t)),tit:'Schatzkisten-Übergabe & Urkunden',sub:'Urkunden aus Teil IV verleihen, Mitgebsel verteilen.',tag:'ritual'});
  rows.push({t:fmtHM(Math.max(end,t)),tit:'Landgang zu Ende — Abholung',sub:'Abhol-Infos je Kind stehen in der Gästeübersicht (Teil IV).',tag:''});
  return {rows, reserve, timeAssumed, endAssumed};
}

function shInvitations(){
  /* V2 (Bolle-Catch 30.07. „Einladungen?!"): Bordpost verzahnt sich mit dem BESTEHENDEN
     Party-Pass-System der Partyseite statt parallel zu laufen. Drei Quellen nach Prioritaet:
     1) party.invites (Name+ROLLE+Token) -> QR auf den persoenlichen ?g-Link (1-Tipp-Zusage)
     2) zugesagte Gaeste -> Namens-Karte mit generischem Party-QR (Nachzuegler/zweite Welle)
     3) Blanko mit generischem QR. Wizard-Partys starten mit LEEREN invites — der Hinweis
     unten macht die (versteckte) Crew-Anlage auf der Partyseite sichtbar. */
  const nm=(PARTY.childName||'').trim()||'Unser Piratenkind';
  const ds=fmtDate(PARTY.date); const t=PARTY.time?PARTY.time+' Uhr':'';
  const addr=PARTY.address||'';
  const invitesAll=(Array.isArray(PARTY.invites)?PARTY.invites:[]).filter(i=>i&&i.n);
  /* Playtest 31.07.: Karten fuer bereits ABGESAGTE Kinder wurden mitgedruckt (kein Abgleich
     invites <-> guests). Zuordnung wie im Worker: erst Token (guest.inv), dann Name — nur gegen
     token-lose Eintraege, damit ein gleichnamiges Walk-in-Kind niemandem die Karte klaut.
     Ohne edit-Token liefert der Worker keine guests -> nichts wird gefiltert (korrekt). */
  const guestsAll=(Array.isArray(PARTY.guests)?PARTY.guests:[]);
  function inviteStatus(inv){
    const byTok=guestsAll.find(g=>g&&g.inv&&g.inv===inv.t);
    if(byTok) return String(byTok.status||'');
    const byName=guestsAll.find(g=>g&&!g.inv&&String(g.name||'').toLowerCase()===String(inv.n||'').toLowerCase());
    return byName?String(byName.status||''):'';
  }
  const declined=invitesAll.filter(i=>inviteStatus(i)==='nein');
  const invites=invitesAll.filter(i=>inviteStatus(i)!=='nein');
  const declNote=declined.length
    ? '<div class="emptyhint" style="margin-bottom:14px">'+(declined.length===1?'<b>Eine Absage:</b> für dieses Kind ist keine Karte dabei.':('<b>'+declined.length+' Absagen:</b> für diese Kinder sind keine Karten dabei.'))+' Sagt doch noch jemand zu, drucke dieses Blatt einfach neu.</div>'
    : '';
  const mk=(gname,role,gtok,mission)=>{
    /* Re-Check N1: Demo-PARTYURL traegt bereits ?demo=1 — zweites '?' haette die Query
       zerstoert (demo="1?g=..." -> „Kein Party-Link"-Karte hinter jedem Demo-Bordpost-QR). */
    const purl = gtok ? (PARTYURL+(PARTYURL.indexOf('?')>=0?'&':'?')+'g='+encodeURIComponent(gtok)) : PARTYURL;
    return '<div class="invcard"><div class="strow"><div class="stbody">'
      +'<div class="to">Geheime Bordpost für</div><div class="nm">'+(gname?esc(gname):'________________')+'</div>'
      +(role?'<p style="color:var(--rust);font-weight:700;margin-top:-3px">⚓ Deine Rolle an Bord: '+esc(role)+'</p>':'')
      +(role&&mission?'<p style="font-size:12px;color:var(--muted);margin-top:-2px">'+esc(mission)+'</p>':'')
      +'<p>🏴‍☠️ <b>'+esc(nm)+'</b> heuert eine Crew an'+(PARTY.age?(' — zum <b>'+esc(PARTY.age)+'. Geburtstag</b>'):'')+'!</p>'
      +(ds?'<p>📅 '+esc(ds)+(t?(' · ⏰ '+esc(t)):'')+'</p>':'')
      +(addr?'<p>📍 '+esc(addr)+'</p>':'')
      +'<p>'+(gtok?'Scannen und mit einem Tipp zusagen — dein Party-Pass wartet:':'Alle Infos + kurz zusagen (Allergien &amp; Abholung) direkt hier:')+'</p>'
      +'<div class="url">'+esc(purl)+'</div></div>'
      +qrBlock(purl, gtok?'Dein persönlicher Link':'Zur Partyseite')
      +'</div></div>';
  };
  let cards='', note='';
  if(invites.length){
    /* Rollen-Name + Mission: invites tragen role-IDs; Katalog-Spiegel ROLES_P uebersetzt.
       F8: eine Blanko-Reserve auch hier — fuer das spontane siebte Kind. */
    cards = invites.map(i=>mk(i.n, roleLabel(i.role), i.t, roleMission(i.role))).join('') + mk('','','','');
  } else {
    const ja = confirmedGuests();
    if(ja.length){
      cards = ja.map(g=>mk(g.name,'','')).join('') + mk('','','');
      note = '<div class="emptyhint" style="margin-bottom:14px"><b>Karten mit Rollen &amp; 1-Tipp-Zusage?</b> Trag die Namen deiner Crew ein — im Planer unter „Wer kommt?" oder jederzeit auf der Partyseite (Bearbeiten → Gäste). Dann bekommt jedes Kind hier seine persönliche Karte mit Piraten-Rolle und eigenem QR-Code.</div>';
    } else {
      cards = mk('','','')+mk('','','')+mk('','','');
      note = '<div class="emptyhint" style="margin-bottom:14px"><b>Tipp:</b> Trag die Namen deiner Crew ein — im Planer unter „Wer kommt?" oder auf der Partyseite (Bearbeiten → Gäste). Dann stehen hier Namen + Piraten-Rollen und jedes Kind bekommt seinen persönlichen QR-Code zur 1-Tipp-Zusage. Bis dahin: Blanko-Karten mit dem allgemeinen Party-Code.</div>';
    }
  }
  return sheet(hd('Teil IV · Einladungen','Bordpost für deine Crew','Ausschneiden und verteilen — der QR-Code führt direkt zur Zusage. Digital geht es wie gewohnt über deine Partyseite.')
    +'<div class="grow">'+declNote+note+cards+'</div>'+foot('Einladungen'),'');
}
/* Piraten-Rollen — EXAKT der ROLE_CATALOG der Partyseite (party-worker.js), inkl. Mission.
   Unbekannte IDs (Katalog-Drift) werden kapitalisiert statt verworfen. */
var ROLES_P={
  ausguck:{n:'Ausguck',m:'Halte die Augen offen — du entdeckst versteckte Hinweise zuerst!'},
  kompass:{n:'Kompass-Profi',m:'Du sagst der Crew, wo es langgeht.'},
  schatzwaechter:{n:'Schatzwächter',m:'Pass auf, dass der Schatz nicht noch einmal verschwindet.'},
  flagge:{n:'Flaggen-Meister',m:'Du hisst die Flagge und gibst das Startsignal.'},
  kanonier:{n:'Kanonier',m:'Bei den Spielen gibst du das laute Startsignal.'}
};
function roleLabel(rid){
  rid=String(rid||'').trim(); if(!rid) return '';
  if(ROLES_P[rid]) return ROLES_P[rid].n;
  return rid.charAt(0).toUpperCase()+rid.slice(1).replace(/-/g,' ');
}
function roleMission(rid){ rid=String(rid||'').trim(); return (ROLES_P[rid]&&ROLES_P[rid].m)||''; }

/* ---------- V2: Schatzsuche-Stationskarten (QR -> Handy-Ansicht mit Vorleser) ---------- */
function shStations(){
  if(!SCHATZ) return '';
  const grp=ageGroup(PARTY.age);
  const sts=(SCHATZ.stations&&SCHATZ.stations[grp])||[];
  if(!sts.length) return '';
  const nm=(PARTY.childName||'').trim()||'die Crew';
  /* F1: Funktions-Replacement — sonst interpretiert String.replace $&, $', $`, $$ IM KINDERNAMEN
     (Name "Tino$'" haette den Intro-Rest dupliziert). Kein XSS, aber Text-Mangling durch Fremd-Input. */
  const intro=String((SCHATZ.intro&&SCHATZ.intro[grp])||'').replace('{name}',function(){ return nm; });
  const cards=sts.map((s,i)=>{
    const say=('Station '+(i+1)+': '+s.name+'. '+s.desc);
    return '<div class="gcard"><div class="strow"><div class="stbody">'
      +'<div class="gh"><h3><span class="stnum">'+(i+1)+'</span>'+esc(s.name)+'</h3><span class="fac">'+esc([(s.dauer?s.dauer+' Min':''),(s.typ||'')].filter(Boolean).join(' · '))+'</span></div>'
      +'<button class="vbtn screen-only" data-say="'+esc(say)+'" onclick="mlSpeak(this)">🔊 Vorlesen</button>'
      +'<p style="font-size:13.5px;margin:6px 0 4px">'+esc(s.desc)+'</p>'
      +(s.hint?'<div class="mat"><b>Vorbereitung:</b> '+esc(s.hint)+'</div>':'')
      +'</div>'+qrBlock(stationUrl(i+1),'Station '+(i+1)+' am Handy')+'</div></div>';
  }).join('');
  const mat=(SCHATZ.material&&SCHATZ.material[grp])||[];
  const matList=mat.length?'<div class="note">🧺 <b>Material komplett:</b> '+mat.map(esc).join(' · ')+'</div>':'';
  return sheet(hd('Teil III · Schatzsuche','Die 5 Stationen — Karten zum Aufhängen',intro)
    +'<div class="grow">'+cards+matList+'</div>'
    +'<div class="note screen-only">📱 <b>QR-Trick:</b> Karte an der Station aufhängen — wer sie scannt, bekommt die Station groß am Handy, mit Vorlese-Knopf für die Betreuer.</div>'
    +foot('Schatzsuche-Stationen'),'');
}
/* ---------- V2: Danke-Karten (Post-Party) ---------- */
function shDanke(){
  const nm=(PARTY.childName||'').trim()||'deinem Piraten';
  const ja=confirmedGuests();
  const mk=(g)=>('<div class="dankecard"><div class="to" style="font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--sea);font-weight:700">Ahoi und danke!</div>'
    +'<div class="nm">'+(g?esc(g)+' „'+esc(pirateName(g))+'“':'________________')+'</div>'
    +'<p>Danke, dass du dabei warst — ohne dich hätte die Crew den Schatz nie gefunden! Bis zum nächsten Abenteuer. ⚓</p>'
    +'<p style="font-family:var(--serif);color:var(--navy);font-weight:700">– Kapitän '+esc(nm)+'</p></div>');
  const cards = ja.length ? ja.map(g=>mk(g.name)).join('')+mk('') : (mk('')+mk('')+mk(''));
  return sheet(hd('Nach der Party','Danke-Karten für die Crew','Nach der Party in die Beute-Beutel oder per Briefkasten — der Abschluss, an den keiner denkt und alle sich erinnern.')
    +'<div class="grow">'+cards+'</div>'+foot('Danke-Karten'),'');
}
/* ---------- V2: Logbuch des Kapitäns (Keepsake) ---------- */
function shLogbuch(){
  const nm=(PARTY.childName||'').trim()||'des Kapitäns';
  const qs=['Der beste Moment der Party:','Das Lustigste, was passiert ist:','So haben wir den Schatz gefunden:','Meine Crew (alle Piraten an Bord):','Das nächste Abenteuer wird:'];
  const rows=qs.map(q=>'<div class="lbq">'+esc(q)+'</div><div class="lbline"></div><div class="lbline"></div>').join('');
  return sheet(hd('Erinnerung','Logbuch '+(nm!=='des Kapitäns'?'von Kapitän '+nm:nm),'Nach der Party gemeinsam ausfüllen — das Blatt, das in die Erinnerungskiste wandert.')
    +'<div class="grow">'+rows
    +'<div class="lbq" style="margin-top:26px">Datum &amp; Unterschrift des Kapitäns:</div><div class="lbline" style="max-width:60%"></div></div>'
    +foot('Logbuch'),'');
}
/* ---------- V2: Countdown-Poster (fuers Kind, vor der Party) ---------- */
function shPoster(){
  const nm=(PARTY.childName||'').trim();
  const ds=fmtDate(PARTY.date);
  let nights='';
  for(var i=14;i>=1;i--) nights+='<div class="night">'+i+'</div>';
  return sheet('<div class="poster grow"><div class="ey">Zum Aufhängen im Kinderzimmer</div>'
    +'<h2>'+(nm?esc(poss(nm))+' ':'')+'Piraten-Countdown</h2>'
    +'<div class="big">Noch ⬜ Nächte bis zur Party!</div>'
    +(ds?'<p style="color:var(--muted)">Der große Tag: <b>'+esc(ds)+'</b></p>':'')
    +'<div class="nights">'+nights+'</div>'
    +'<p style="font-size:12.5px;color:var(--muted);margin-top:16px">Jeden Abend einen Kreis ausmalen — wenn alle voll sind, geht es los! 🏴‍☠️</p></div>'
    +foot('Countdown-Poster'),'');
}
/* ---------- V2: Eltern-Handzettel (fuer die abgebenden Eltern) ---------- */
function shHandzettel(){
  const nm=(PARTY.childName||'').trim()||'Unser Kind';
  const ds=fmtDate(PARTY.date); const t=PARTY.time?PARTY.time+' Uhr':''; const et=PARTY.endTime?PARTY.endTime+' Uhr':'';
  const addr=PARTY.address||'';
  const card='<div class="cell"><div class="hzc"><div class="t">🏴‍☠️ '+esc(poss(nm))+' Piraten-Party — Eltern-Info</div>'
    +(ds?'<p>📅 '+esc(ds)+(t?(' · '+esc(t)):'')+(et?(' bis '+esc(et)):'')+'</p>':'')
    +(addr?'<p>📍 '+esc(addr)+'</p>':'')
    +'<p>✅ Bitte kurz zu-/absagen und Allergien melden:</p>'
    +'<p style="font-weight:700;color:var(--sea);word-break:break-all">'+esc(PARTYURL)+'</p>'
    +(PARTY.endTime?'<p>🕐 Abholung: '+esc(PARTY.endTime)+' Uhr</p>':'')
    +'</div></div>';
  const wa='🏴‍☠️ '+poss(nm)+' Piraten-Party!'+(ds?('\n📅 '+ds+(t?(' · '+t):'')):'')+(addr?('\n📍 '+addr):'')
    +'\n\nAlle Infos + Zusage (bitte Allergien angeben) hier:\n'+PARTYURL;
  return sheet(hd('Teil IV · Eltern-Info','Handzettel für die abgebenden Eltern','Viermal zum Ausschneiden — für Kita-Fach, Ranzen oder Haustür. Digital unten als WhatsApp-Text.')
    +'<div class="grow"><div class="cutgrid hz">'+card+card+card+card+'</div>'
    +'<div class="cuthint">✂️ An den Linien schneiden</div>'
    +'<div class="wacopy screen-only"><b>📲 Als WhatsApp-Text:</b>\n'+esc(wa)+'</div></div>'
    +foot('Eltern-Handzettel'),'');
}
/* ---------- V2: Stations-Modus (QR-Ziel) ---------- */
function renderStation(sIdx, grp){
  const el=document.getElementById('stmode');
  el.style.display='block';
  /* Gate-MAJOR F5 (30.07.): Rechtsfooter bleibt STEHEN. Der Stations-Modus ist eine
     gastgerichtete, eigenstaendig geoeffnete (QR!) und getrackte Unterseite — genau die
     Gattung, fuer die Welle 2 die Anbieterkennzeichnung nachgeruestet hat (§5 DDG,
     Art. 13 DSGVO). Ihn hier auszublenden wuerde die eigene Linie konterkarieren. */
  const sts=(SCHATZ&&SCHATZ.stations&&SCHATZ.stations[grp])||[];
  const s=sts[sIdx-1];
  if(!s){
    /* F4: Ladefehler (SCHATZ=null) liest sich sonst wie „Schatzsuche hat 0 Stationen" */
    el.innerHTML = sts.length
      ? '<div class="card"><h2>Station nicht gefunden</h2><p>Diese Schatzsuche hat '+sts.length+' Stationen.</p></div>'
      : '<div class="card"><h2>Station konnte nicht geladen werden</h2><p>Bitte die Seite neu laden — die Stationsdaten waren gerade nicht erreichbar.</p></div>';
    return;
  }
  const say='Station '+sIdx+': '+s.name+'. '+s.desc;
  const nav=[];
  if(sIdx>1) nav.push('<a href="'+esc(stationUrl(sIdx-1))+'">← Station '+(sIdx-1)+'</a>');
  if(sIdx<sts.length) nav.push('<a href="'+esc(stationUrl(sIdx+1))+'">Station '+(sIdx+1)+' →</a>');
  el.innerHTML='<div class="card">'
    +'<div class="ey">Schatzsuche · Station '+sIdx+' von '+sts.length+'</div>'
    +'<h2><span class="stnum">'+sIdx+'</span>'+esc(s.name)+'</h2>'
    +'<p>'+esc(s.desc)+'</p>'
    +'<button class="vbtn screen-only" style="font-size:15px;padding:10px 18px;margin-top:8px" data-say="'+esc(say)+'" onclick="mlSpeak(this)">🔊 Station vorlesen</button>'
    +(s.hint?'<div class="mat" style="margin-top:14px"><b>Nur für Betreuer:</b> '+esc(s.hint)+'</div>':'')
    +'<div class="nav">'+nav.join('')+'</div></div>';
  document.title='Station '+sIdx+' — Piraten-Schatzsuche';
}

/* ---------- Gesamt-Render ---------- */
function render(){
  const el=document.getElementById('dossier');
  el.innerHTML =
    shCover()
    +shTimeline()
    +shCountdown()
    +shPoster()
    +shShopping()
    +shDecoCake()
    +shGameCards()
    +shStations()
    +shSOS()
    +shCertificates()
    +shTableCards()
    +shGuestsWishes()
    +shInvitations()
    +shHandzettel()
    +shDanke()
    +shLogbuch();
}
</script>
