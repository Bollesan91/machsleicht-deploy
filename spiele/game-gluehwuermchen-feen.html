<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Glühwürmchen-Melodie — Feen</title>
<link rel="stylesheet" href="core/core.css?v=20260708">
<style>
  /* E11 Simon/Sequenz: Glühwürmchen-Folge nachtippen (Position+Ton) -> Foto-Reveal. Feen. Auf Shared Core. Story-Muster v2. */
  :root{--bg1:#0e1f2a;--bg2:#2e5e54;--fg:#fff;--accent:#bfe66a;--accent-dk:#5a8a2a;--ink:#16281f}
  .screen{width:100%;max-width:330px;text-align:center;font-size:16px;font-weight:800;color:#cfeaa0;min-height:24px}
  /* Feenwald-Kulisse (C5 „mehr Liebe in die Optik"): Nachthimmel mit Mond + Sternen, zwei
     gestaffelte Baumreihen, Waldboden mit Pilzen und Farn, zwei driftende Nebelbänder.
     Alles CSS-Formen wie im Rest des Sets (hufeisen-Stallgasse) — keine Bilder, kein Emoji. */
  .grove{position:relative;width:100%;max-width:330px;aspect-ratio:1.15;border-radius:18px;background:linear-gradient(180deg,#0a1626 0%,#0c2430 44%,#0f3329 100%);box-shadow:0 12px 30px rgba(0,0,0,.5),inset 0 0 0 3px rgba(120,200,120,.12);overflow:hidden}
  .moon{position:absolute;right:12%;top:8%;width:42px;height:42px;border-radius:50%;background:radial-gradient(circle at 38% 34%,#fdffe8,#eaf5bd 60%,#cfe08a);box-shadow:0 0 34px 14px rgba(230,255,170,.20);z-index:0;pointer-events:none}
  .stars{position:absolute;inset:0;z-index:0;pointer-events:none;background-image:
    radial-gradient(1.6px 1.6px at 14% 12%,#eaffd0,transparent),radial-gradient(1.4px 1.4px at 32% 7%,#dff0ff,transparent),
    radial-gradient(1.8px 1.8px at 52% 15%,#fff,transparent),radial-gradient(1.3px 1.3px at 68% 6%,#eaffd0,transparent),
    radial-gradient(1.5px 1.5px at 86% 20%,#dff0ff,transparent),radial-gradient(1.2px 1.2px at 22% 24%,#fff,transparent),
    radial-gradient(1.4px 1.4px at 44% 27%,#eaffd0,transparent),radial-gradient(1.2px 1.2px at 76% 30%,#fff,transparent);opacity:.8}
  /* hintere Baumreihe: weiche Kronen-Halbellipsen, sehr dunkel -> Tiefe hinter den vorderen Stämmen */
  .treeline{position:absolute;left:-6%;right:-6%;bottom:24%;height:42%;z-index:0;pointer-events:none;background:
    radial-gradient(44px 58px at 8% 100%,#0a2019 0 96%,transparent 97%),radial-gradient(52px 76px at 24% 100%,#09201a 0 96%,transparent 97%),
    radial-gradient(38px 50px at 39% 100%,#0a2019 0 96%,transparent 97%),radial-gradient(56px 82px at 56% 100%,#09201a 0 96%,transparent 97%),
    radial-gradient(40px 54px at 73% 100%,#0a2019 0 96%,transparent 97%),radial-gradient(50px 70px at 91% 100%,#09201a 0 96%,transparent 97%)}
  .tree{position:absolute;bottom:17%;width:60px;height:52%;z-index:1;pointer-events:none}
  .tree.l{left:-12px}.tree.r{right:-12px;height:44%}
  .tree::before{content:"";position:absolute;bottom:0;left:50%;margin-left:-7px;width:14px;height:100%;background:linear-gradient(90deg,#06120d,#14291c 46%,#06120d);border-radius:3px}
  .tree::after{content:"";position:absolute;top:-14%;left:-46%;width:192%;height:58%;border-radius:52% 52% 44% 44%;background:radial-gradient(ellipse at 50% 62%,#10301f,#06140f)}
  .ground{position:absolute;left:-6%;right:-6%;bottom:-7%;height:30%;z-index:2;border-radius:50% 50% 0 0/26% 26% 0 0;background:radial-gradient(ellipse at 50% 0%,#18452e,#092016 74%);box-shadow:inset 0 2px 0 rgba(170,225,145,.16);pointer-events:none}
  .mush{position:absolute;width:15px;height:17px;z-index:3;pointer-events:none}
  .mush::before{content:"";position:absolute;bottom:0;left:50%;margin-left:-2.5px;width:5px;height:8px;background:#eef4dc;border-radius:2px}
  .mush::after{content:"";position:absolute;top:0;left:0;width:15px;height:11px;border-radius:9px 9px 3px 3px;background:radial-gradient(circle at 34% 32%,#ff9aa8,#c33d5c);box-shadow:0 0 9px rgba(255,140,165,.3)}
  .mush.m2{transform:scale(.78)}.mush.m3{transform:scale(.62)}
  .fern{position:absolute;bottom:2%;width:44px;height:26px;z-index:3;pointer-events:none;border-radius:50% 50% 0 0;background:radial-gradient(ellipse at 50% 100%,#1d5236,transparent 72%)}
  .mist{position:absolute;left:-30%;right:-30%;height:24%;z-index:3;pointer-events:none;background:radial-gradient(ellipse at 50% 50%,rgba(198,240,214,.15),transparent 70%);animation:drift 19s ease-in-out infinite}
  .mist.m1{bottom:20%}.mist.m2{bottom:6%;animation-duration:26s;animation-direction:reverse;opacity:.75}
  @keyframes drift{0%,100%{transform:translateX(-11%)}50%{transform:translateX(11%)}}
  /* Glühwürmchen: leuchtender Körper statt Käfer-Emoji. Die 64px-Box ist nur Trefferfläche
     (Daumen 3-5), sichtbar ist der 22px-Punkt — der atmet im Ruhezustand und leuchtet beim Ton auf.
     Die Atem-Animation läuft auf dem INNEREN <b>, damit die Trefferfläche nie wandert. */
  .fly{position:absolute;width:64px;height:64px;border-radius:50%;transform:translate(-50%,-50%);cursor:pointer;background:radial-gradient(circle,rgba(200,255,150,.10),transparent 62%);transition:opacity .5s ease;display:flex;align-items:center;justify-content:center;z-index:5;-webkit-tap-highlight-color:transparent}
  .fly b{display:block;width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 44% 38%,#fbffdf,#cfe98a 56%,#7fae3e);box-shadow:0 0 12px 4px rgba(200,255,140,.35);transition:box-shadow .14s,background .14s;animation:fbreath 3.4s ease-in-out infinite}
  /* Atem-Versatz je Glühwürmchen setzt buildGrove() inline (--fd) — nth-of-type zählt hier alle
     Kulissen-Divs mit und würde danebengreifen. */
  .fly b{animation-delay:var(--fd,0s)}
  @keyframes fbreath{0%,100%{opacity:.5;transform:translateY(2px) scale(.9)}50%{opacity:.95;transform:translateY(-2px) scale(1.04)}}
  .fly:active b{animation:none;transform:scale(.86)}
  .fly.lit b{animation:none;background:radial-gradient(circle at 44% 38%,#fffde8,#f2ff9e 44%,#bfe66a);box-shadow:0 0 34px 14px rgba(226,255,150,.9);transform:scale(1.3)}
  /* „Jetzt du" ohne Worte (P4): während der Eingabe leuchten alle vier deutlich einladender */
  .grove.turn .fly b{animation:fready 1.3s ease-in-out infinite;box-shadow:0 0 18px 7px rgba(200,255,140,.5)}
  @keyframes fready{0%,100%{transform:scale(.96);opacity:.75}50%{transform:scale(1.12);opacity:1}}
  .grove.turn .fly.lit b{animation:none}
  .grove.shake{animation:gsh .3s}@keyframes gsh{0%,100%{transform:translateX(0)}33%{transform:translateX(-7px)}66%{transform:translateX(7px)}}
  /* Foto-Layer hinter dem Schwarm: fügt sich mit jedem richtigen Ton zusammen; im Finale flutet es die ganze Lichtung (Reveal = Höhepunkt) */
  .grovephoto{position:absolute;inset:0;background-image:var(--photo);background-size:cover;background-position:center;opacity:0;filter:blur(16px) saturate(.5) brightness(.7);transition:opacity .6s ease,filter .6s ease;pointer-events:none;z-index:4}
  /* Story-Outro: Fee Lumis Reaktion auf dem Reveal (tap-getaktet) */
  .storyOut{position:absolute;left:50%;bottom:6%;transform:translateX(-50%);background:rgba(255,255,255,.94);color:#16281f;font-weight:800;font-size:15px;padding:10px 16px;border-radius:14px;box-shadow:0 6px 16px rgba(0,0,0,.35);opacity:0;transition:opacity .4s ease .7s;z-index:7;max-width:88%;text-align:center;pointer-events:none}
  .storyOut.on{opacity:1}
  .storyOut.on::after{content:" ▸";opacity:.65;animation:blinkA 1.2s infinite} /* Tap-Affordanz: weiter per Tipp */
  @keyframes blinkA{50%{opacity:.15}}
  /* Magic-Moment (C1-Medaillon-Standard wie Piraten-Familie/Turm/Bagger): das verborgene Licht
     steigt aus dem Schwarm auf, LANDET mittig und wackelt -> EIN Tap öffnet es. Keine Jagd auf
     ein bewegliches Ziel mehr (Hannes-Entscheid 19.07.). Blur NUR auf dem Foto (::before, 15px),
     der Ring und sein Glühen bleiben scharf. No-Fail: öffnet sich nach 5s von selbst. */
  .magicFly{position:absolute;left:50%;top:46%;width:112px;height:112px;margin:-56px 0 0 -56px;border-radius:50%;border:5px solid var(--accent);overflow:hidden;opacity:0;transform:scale(.5);transition:opacity .35s;z-index:8;pointer-events:none;cursor:pointer;box-shadow:0 0 30px 8px rgba(191,230,106,.55)}
  .magicFly::before{content:"";position:absolute;inset:-8px;border-radius:50%;background-image:var(--photo);background-size:cover;background-position:center;background-color:#16281f;filter:blur(15px);transition:filter .55s}
  .magicFly.landed{opacity:1;pointer-events:auto;animation:mland 1s ease-in-out infinite}
  .magicFly.caught{opacity:1;pointer-events:none;animation:none;box-shadow:0 6px 20px rgba(0,0,0,.35),0 0 46px 14px rgba(226,255,150,.9);transition:transform .5s cubic-bezier(.3,1.4,.5,1);transform:scale(1.55)}
  .magicFly.caught::before{filter:blur(0)}
  .magicFly.caught.joy{animation:mjoy2 .5s ease-in-out 4}
  @keyframes mland{0%,100%{transform:scale(1) rotate(-4deg)}25%{transform:scale(1.06) rotate(3deg)}50%{transform:scale(1.09) rotate(-2deg)}75%{transform:scale(1.06) rotate(4deg)}}
  @keyframes mjoy2{0%,100%{transform:scale(1.55)}50%{transform:translateY(-12px) scale(1.66)}}

  /* Reveal */
  .invite{width:100%;background:linear-gradient(170deg,#f3fbe6,#dff0c4);color:var(--ink);border-radius:20px;padding:22px;box-shadow:0 14px 40px rgba(0,0,0,.4);text-align:center;border:3px solid var(--accent-dk)}
  .hero{width:140px;height:140px;border-radius:50%;margin:0 auto 6px;border:5px solid var(--accent);background-image:var(--photo);background-size:cover;background-position:center;background-color:#16281f;box-shadow:0 0 26px rgba(191,230,106,.6);position:relative;animation:pop .6s cubic-bezier(.3,1.5,.5,1)}

  @keyframes pop{from{transform:scale(.3) rotate(-8deg);opacity:0}to{transform:none;opacity:1}}
  .invite h2{font-size:23px;margin:6px 0 2px}.invite .who{font-size:17px;font-weight:800;color:var(--accent-dk)}
  .invite dl{display:grid;grid-template-columns:auto 1fr;gap:8px 12px;text-align:left;margin:14px auto;max-width:240px;font-size:16px}.invite dt{font-size:20px}.invite dd{font-weight:700}
</style>

<body>
<div class="wrap">
  <section class="scene on" id="s-intro">
    <!-- Beschreibung komplett auf EINER Seite (Hannes-FB 13.08.): kein Weiter/Überspringen mehr,
         die drei Panels sind zu einem Absatz zusammengezogen. Wer lesen will, liest einmal;
         wer nicht, tippt sofort auf „Lauschen". -->
    <div class="big" id="pIcon">🧚</div>
    <h1 id="pTitle">Pssst … ich bin Fee Lumi!</h1>
    <p class="sub" id="pText">…</p>
    <div id="introForm" style="width:100%;flex-direction:column;align-items:center;gap:12px;display:flex">
      <input id="gname" placeholder="Dein Name (optional)" maxlength="20" autocomplete="off" style="width:80%;max-width:240px;padding:11px 14px;border:0;border-radius:12px;font-size:16px;text-align:center;background:rgba(255,255,255,.92);color:#2a2a2a;outline:none">
      <button class="btn" id="startBtn">Lauschen ✨</button>
    </div>
  </section>

  <section class="scene" id="s-game">
    <div class="screen" id="msg">Achtung — die Melodie beginnt …</div>
    <div class="grove" id="grove">
      <div class="stars"></div><div class="moon"></div>
      <div class="treeline"></div><div class="tree l"></div><div class="tree r"></div>
      <div class="ground"></div>
      <div class="fern" style="left:6%"></div><div class="fern" style="right:9%;width:36px"></div>
      <div class="mush" style="left:13%;bottom:5%"></div><div class="mush m2" style="left:23%;bottom:3%"></div><div class="mush m3" style="right:17%;bottom:6%"></div>
      <div class="mist m1"></div><div class="mist m2"></div>
      <div class="storyOut" id="storyOut"></div><div class="magicFly" id="magicFly"></div>
    </div>
    <button class="btn" id="tippBtn" style="background:rgba(255,255,255,.16);font-size:15px;padding:8px 20px">💡 Hilfe</button>
  </section>

  <section class="scene" id="s-win">
    <div class="invite">
      <div class="hero"></div>
      <h2 id="winTitle">Melodie komplett!</h2>
      <p class="who" id="winWho">Die Melodie ist komplett! Komm zur Feen-Party:</p>
      <dl><dt>📅</dt><dd id="wDate">Samstag, 11. Juli</dd><dt>🕒</dt><dd id="wTime">15:00 Uhr</dd><dt>📍</dt><dd id="wPlace">Auf der Feenlichtung</dd></dl>
      <button class="btn ja" id="rsvpBtn">🧚 Ich flieg mit!</button>
      <p class="note">(Demo — im Original geht die Zusage per WhatsApp an die Eltern)</p>
    </div>
  </section>
</div>
<div class="confetti" id="confetti"></div>
<script src="core/core.js?v=20260802"></script>
<script>
const NOPHOTO="data:image/svg+xml,"+encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><rect width='200' height='200' fill='#0e1f2a'/><g fill='#bfe66a'><circle cx='60' cy='70' r='6'/><circle cx='140' cy='60' r='6'/><circle cx='150' cy='130' r='6'/><circle cx='56' cy='140' r='6'/></g><g fill='#fffad0' opacity='.6'><circle cx='60' cy='70' r='12'/><circle cx='140' cy='60' r='12'/><circle cx='150' cy='130' r='12'/><circle cx='56' cy='140' r='12'/></g><path d='M100 86 q14 -16 28 0 q-14 18 -28 0z' fill='#bfe66a'/><circle cx='100' cy='110' r='10' fill='#ffe6a0'/></svg>`);
const THEME={ photo:'/spiele/core/demo-kid.jpg' };
const HAS_PHOTO=setPhoto(THEME,NOPHOTO);
const CC=['#bfe66a','#ffe6a0','#a98cff','#fff','#5a8a2a'];
const POS=[[26,30],[74,26],[80,72],[22,74]]; const TONES=[392,494,587,698];
const sfx={
  tone(i){const t=AC().currentTime;note(TONES[i],t,0.24,{type:'sine',vol:0.12});note(TONES[i]*2,t,0.16,{type:'sine',vol:0.04});},
  buzz(){note(150,AC().currentTime,0.26,{type:'sawtooth',vol:0.12,glideTo:90});},
  win(){const t=AC().currentTime;[523,659,784,1047,1319].forEach((f,i)=>note(f,t+i*0.1,0.34,{type:'triangle',vol:0.14}));},
  ding(){const t=AC().currentTime;note(880,t,0.12,{type:'sine',vol:0.15});note(1320,t+0.09,0.24,{type:'sine',vol:0.13});}
};
const GOAL=(ageNum()<=6?3:ageNum()<=9?4:5), FLASH_MS=(ageNum()<=6?560:ageNum()<=9?500:400); // Länge UND Tempo nach Alter (10+ schneller = echter Merk-Skill)
const GUEST=(()=>{ const s=(new URLSearchParams(location.search).get('g')||'').trim(); return s.length<=20?s:''; })(); // Gastname für den Twist-Beat; >20 verwerfen
// Story-Intro auf EINER Seite (Hannes-FB 13.08.): Fee Lumi, Geheimnis und Spielauftrag in einem
// Absatz — vorher drei tippbare Panels. Der Twist im Finale (das Licht IST das Geburtstagskind)
// bleibt unverspoilert: das Intro spricht weiter nur vom „verborgenen Licht".
$('#pText').textContent='Heute Nacht summt im Feenwald ein Geheimnis: ein verborgenes Licht, heller als alle Glühwürmchen zusammen. Es kommt nur hervor, wenn du die Leucht-Melodie nachspielst — merk dir, welche Glühwürmchen leuchten, und tippe sie genau so nach.';
function kidCap(){ const k=kid(); return k.charAt(0).toUpperCase()+k.slice(1); } // Fallback 'das Geburtstagskind' satzinitial groß
function guestNow(){ const f=document.getElementById('gname'); const v=((f&&f.value)||'').trim(); return (v&&v.length<=20)?v:GUEST; } // Namensfeld vor URL-Param
let seq=[], step=0, accepting=false, done=false, flies=[], magicPhase=false, finT=null;
let outroStep=0, outroT=null, beat2='', winAt=0;
function advanceOutro(){ if(!outroStep || Date.now()-winAt<1150)return; clearTimeout(outroT); winAt=Date.now(); // Grace 1150ms: deckt volle Beat-1-Einblendung, kein Reflex-Tap überspringt Flood+Beats
  if(outroStep===1){ outroStep=2; $('#storyOut').textContent=beat2; vib(8); outroT=setTimeout(advanceOutro,14000); }
  else { outroStep=0; show('s-win'); confetti(CC); } } // tap-getaktet (Fallback Beat 1 11s, Beat 2 14s für 60-WpM-Leser)
function sharpen(frac){ const ph=$('#grove').querySelector('.grovephoto'); if(!ph||magicPhase)return; const f=Math.max(0,Math.min(1,frac)); ph.style.opacity=(f<=0?0:Math.min(0.28,0.15+0.4*f*f)).toFixed(2); ph.style.filter='blur('+Math.max(15,17*(1-f*f)).toFixed(1)+'px) saturate('+(0.5+0.5*f).toFixed(2)+') brightness('+(0.7+0.3*f).toFixed(2)+')'; } /* Blur hinten gewichtet (1-f^2) */
function buildGrove(){ const g=$('#grove'); [...g.querySelectorAll('.fly,.grovephoto')].forEach(e=>e.remove()); flies=[]; const ph=document.createElement('div'); ph.className='grovephoto'; g.insertBefore(ph,g.firstChild); POS.forEach((p,i)=>{ const f=document.createElement('div'); f.className='fly'; f.style.left=p[0]+'%'; f.style.top=p[1]+'%'; f.style.setProperty('--fd',(-0.9*i)+'s'); f.innerHTML='<b></b>'; f.addEventListener('click',()=>press(i)); g.appendChild(f); flies.push(f); }); } // <b> = der leuchtende Körper; der Atem-Versatz macht aus vier gleichen Punkten einen lebendigen Schwarm
function flash(i){ const f=flies[i]; f.classList.add('lit'); sfx.tone(i); setTimeout(()=>f.classList.remove('lit'),FLASH_MS*0.55); }
/* Melodie-Aufbau (Hannes-FB 13.08. „die Melodie lässt nur ein Licht aufleuchten"): zwei Ursachen,
   beide hier behoben. (1) Die erste Runde war EIN Ton — eine einzelne Blinke sieht nicht nach
   Melodie aus, sondern nach Fehler. Jetzt starten alle Altersstufen mit ZWEI Lichtern.
   (2) Der Zufall durfte dasselbe Glühwürmchen direkt wiederholen; gemessen kam z.B. 3,3,0,3 heraus
   — dann leuchtet dreimal derselbe Punkt und es wirkt, als seien die anderen kaputt. pushTone()
   schließt die direkte Wiederholung aus, die Melodie wandert also sichtbar durch den Schwarm
   (und klingt auch nach Melodie, weil nie derselbe Ton doppelt kommt). Endlängen 3/4/5 unverändert.
   Solange die Melodie kürzer als vier Töne ist, wird zusätzlich jedes Glühwürmchen nur EINMAL
   genommen — sonst hüpfte eine 3-Ton-Melodie schon mal zwischen nur zwei Lichtern hin und her
   (gemessen: 3,2,3). So beteiligt sich sichtbar der ganze Schwarm, und für die Kleinen sind vier
   verschiedene Punkte leichter zu merken als eine Wiederholung. */
const START_LEN=2;
function pushTone(){ const used=new Set(seq); let n,guard=0;
  do{ n=Math.floor(Math.random()*4); guard++; }
  while(guard<40 && ((seq.length && n===seq[seq.length-1]) || (seq.length<4 && used.has(n))));
  seq.push(n); }
function nextRound(){ do{ pushTone(); } while(seq.length<START_LEN); step=0; playSeq(); }
function playSeq(){ accepting=false; step=0; /* step-Reset: bei Replay nach Fehltipp wieder von vorn pruefen, sonst Buzz-Endlosschleife = No-Fail-Bruch fuer aktiv-falsch tippendes 4-6-Kind (Reviewer-MAJOR 10.07.) */ $('#grove').classList.remove('turn'); $('#msg').textContent='Achtung — die Melodie …'; let i=0; const iv=setInterval(()=>{ if(done){clearInterval(iv);return;} if(i>=seq.length){ clearInterval(iv); accepting=true; $('#grove').classList.add('turn'); $('#msg').textContent='Jetzt du — tippe nach!'; return; } flash(seq[i]); i++; }, FLASH_MS); } // .turn = „jetzt du" ohne Worte: alle vier pulsieren einladend (P4, 3-5 lesen nicht)
function press(i){
  if(!accepting||done)return; flash(i);
  if(i===seq[step]){ step++; if(step===seq.length){ accepting=false; $('#grove').classList.remove('turn'); if(seq.length>=GOAL) return win(); sharpen(seq.length/GOAL); $('#msg').textContent='Das Bild wird heller! Noch eine …'; setTimeout(nextRound,750); } }
  else { accepting=false; $('#grove').classList.remove('turn'); sfx.buzz(); vib([30,40,30]); $('#grove').classList.add('shake'); setTimeout(()=>$('#grove').classList.remove('shake'),300); $('#msg').textContent='Daneben — nochmal lauschen!'; setTimeout(playSeq,850); }
}
function win(){ /* Melodie komplett -> das verborgene Licht steigt aus dem Schwarm auf und LANDET mittig -> EIN Tap öffnet es -> scharf + huepft -> Story. No-Fail (Auto-Oeffnen 5s) */
  done=true; accepting=false; $('#grove').classList.remove('turn'); flies.forEach(f=>f.style.opacity='0'); $('#tippBtn').style.visibility='hidden'; // Glühwürmchen frei, kein toter Button
  const ph=$('#grove').querySelector('.grovephoto'); if(ph) ph.style.opacity='0'; // das gesammelte Licht bündelt sich ins Medaillon (kein Doppel-Gesicht)
  $('#msg').textContent='Das verborgene Licht kommt zu dir …'; sfx.ding(); vib(8);
  // 700ms Landeschlag: erst DANACH ist magicPhase scharf. Ohne diese Pause fing der Gewinn-Tap
  // das Licht in derselben Klick-Welle wieder ein (der Tap auf das Glühwürmchen bubbelt in den
  // #grove-Handler) -> das Ritual wurde uebersprungen, die Zeile blitzte nur auf. Gemessen 13.08.
  finT=setTimeout(()=>{ const mf=$('#magicFly'); mf.classList.add('landed'); magicPhase=true;
    mf.addEventListener('click', catchMagic, {once:true});
    finT=setTimeout(()=>{ if(magicPhase) catchMagic(); }, 5000); // No-Fail: oeffnet sich von selbst
  }, 700);
}
function catchMagic(){ if(!magicPhase)return; magicPhase=false; clearTimeout(finT); const mf=$('#magicFly'); mf.classList.remove('landed'); mf.classList.add('caught'); $('#msg').textContent='✨ Das verborgene Licht!'; sfx.win(); vib([20,40,20,40,80]);
  finT=setTimeout(()=>{ mf.classList.add('joy'); confetti(CC); vib([10,30,10]); // Foto scharf + huepft vor Freude, Konfetti AM Reveal
    const g=guestNow(); const so=$('#storyOut');
    if(HAS_PHOTO && !document.documentElement.hasAttribute('data-photo-failed')){ so.textContent='Fee Lumi staunt: Das verborgene Licht ist '+kid()+'! 🎉'; beat2=kidCap()+' lacht: „Na endlich'+(g?', '+g:'')+'! Ich hab schon auf dich gewartet!“'; } // Beat 1 Identität, Beat 2 Rollenumkehr
    else { so.textContent='Fee Lumi funkelt: Da ist es — das verborgene Licht! 🎉'; beat2='Und '+kid()+' hat es für dich entzündet'+(g?', '+g:'')+'!'; } // nofoto: kid() als Gastgeber
    so.classList.add('on'); winAt=Date.now(); outroStep=1; outroT=setTimeout(advanceOutro,11000);
    if(HAS_PHOTO && !document.documentElement.hasAttribute('data-photo-failed')){ $('#winTitle').textContent='Licht gefunden!'; $('#winWho').textContent=`Im Glühwürmchen-Licht erscheint das verborgene Leuchten — das ist ${kid()}! Komm zur Feen-Party:`; } else { $('#winTitle').textContent='Melodie komplett!'; $('#winWho').textContent=`Alle Glühwürmchen leuchten im Takt — ${kid()} lädt dich zur Feen-Party ein:`; } guestName();
  }, 620);
}
$('#grove').addEventListener('click',()=>{ if(magicPhase){ catchMagic(); return; } if(done && outroStep){ advanceOutro(); } }); // Magic-Moment: Tap faengt das Foto; danach taktet der Tap die Story-Beats
// Tipp sichtbar: das naechste richtige Glühwürmchen wird echt getippt
function tip(){ if(magicPhase){ catchMagic(); return; } if(accepting && !done) press(seq[step]); } // im Magic-Moment oeffnet der Tipp das Medaillon (Haus-Idiom bagger); globale tip(): verdrahtet gluehwuermchen ins core.js Idle-Auto-Tipp-No-Fail-Netz (_sgameOn braucht typeof tip==='function', sonst feuert Auto-Tipp nie)
