<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Hürden-Springen — Pferde</title>
<link rel="stylesheet" href="core/core.css?v=20260708">
<style>
  /* E10 Timing-Tap — nur Spiel-Eigenes; Skelett aus core.css. */
  :root{--bg1:#3f5f86;--bg2:#7fa8d8;--fg:#fff;--accent:#e0913a;--accent-dk:#a8631a;--ink:#2e1c0a;--leapDur:.68s}
  .field{position:relative;width:100%;aspect-ratio:1.25;border-radius:16px;overflow:hidden;background:linear-gradient(180deg,#a9d0f2 0%,#bfe0a0 58%,#8fbf63 58%,#79a850 100%);box-shadow:0 12px 30px rgba(0,0,0,.45)}
  /* #track spannt die GANZE Feldhoehe (Stufe-2-Fix 14.08.). Vorher war es nur 42% hoch und
     .hurdle{bottom:30%} rechnete gegen DIESE 42% -> Huerden standen auf 12,6% der Feldhoehe,
     Pferd und Zieltor (beide direkte .field-Kinder) auf 30%. Sie haben sich nie beruehrt,
     die namensgebende Mechanik war nicht dargestellt. Jetzt liegt bottom:30% ueberall auf
     derselben Bezugsgroesse = eine gemeinsame Standlinie. */
  #track{position:absolute;left:0;right:0;top:0;bottom:0;z-index:3;pointer-events:none}
  .ground{position:absolute;left:0;right:0;bottom:0;height:42%;background:repeating-linear-gradient(90deg,#79a850,#79a850 28px,#71a049 28px,#71a049 56px);animation:scroll .4s linear infinite}
  @keyframes scroll{to{background-position:-56px 0}}

  /* ===== Publikum: Tribüne hinter dem Parcours. Die Zuschauer sind gekachelte radial-gradients
     (je Reihe zwei Personen-Sets mit eigener Kachelbreite + Farbe -> wirkt gemischt statt geklont),
     kein Bild-Asset und kein zusätzlicher Request. Beim Zieleinlauf wippen sie schneller = Jubel. ===== */
  .stand{position:absolute;left:0;right:0;bottom:42%;height:22%;overflow:hidden;z-index:1;background:linear-gradient(180deg,#8697ad 0 32%,#75879e 32% 64%,#65778e 64% 100%)}
  .row{position:absolute;left:-9%;right:-9%;height:30%;background-repeat:repeat-x;background-position:0 100%;animation:wave 2.8s ease-in-out infinite alternate}
  .row.r1{bottom:70%;background-image:radial-gradient(circle at 50% 30%,#f2c9a4 0 26%,transparent 27%),radial-gradient(circle at 50% 98%,#e2604c 0 40%,transparent 41%),radial-gradient(circle at 50% 30%,#c98d5e 0 26%,transparent 27%),radial-gradient(circle at 50% 98%,#4f86c6 0 40%,transparent 41%);background-size:15px 100%,15px 100%,23px 100%,23px 100%}
  .row.r2{bottom:44%;animation-delay:-.9s;background-image:radial-gradient(circle at 50% 30%,#f6d3ae 0 26%,transparent 27%),radial-gradient(circle at 50% 98%,#f0c04a 0 40%,transparent 41%),radial-gradient(circle at 50% 30%,#b9784b 0 26%,transparent 27%),radial-gradient(circle at 50% 98%,#5fb37a 0 40%,transparent 41%);background-size:17px 100%,17px 100%,27px 100%,27px 100%}
  .row.r3{bottom:19%;animation-delay:-1.8s;background-image:radial-gradient(circle at 50% 30%,#eec49c 0 26%,transparent 27%),radial-gradient(circle at 50% 98%,#d8dde4 0 40%,transparent 41%),radial-gradient(circle at 50% 30%,#c4874f 0 26%,transparent 27%),radial-gradient(circle at 50% 98%,#9b6fc0 0 40%,transparent 41%);background-size:19px 100%,19px 100%,29px 100%,29px 100%}
  @keyframes wave{from{transform:translateY(1.5px)}to{transform:translateY(-2.5px)}}
  .field.cheer .row{animation-duration:.42s}
  .rail{position:absolute;left:0;right:0;bottom:0;height:19%;background:linear-gradient(180deg,#fff 0 52%,#3f5f86 52% 100%);border-top:2px solid rgba(0,0,0,.16);box-shadow:0 2px 6px rgba(0,0,0,.2)}

  .zone{position:absolute;bottom:0;height:42%;left:26%;width:14%;z-index:2;background:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,.05));border-left:3px dashed rgba(255,255,255,.55);border-right:3px dashed rgba(255,255,255,.55)}
  .horse{position:absolute;bottom:30%;left:22%;transform:translateX(-50%) scaleX(-1);font-size:46px;z-index:4;filter:drop-shadow(0 4px 4px rgba(0,0,0,.4))} /* scaleX(-1): 🐎 schaut per Default nach links, galoppiert hier aber nach rechts → spiegeln, sonst läuft es rückwärts */
  .horse.jump{animation:leap var(--leapDur) ease}
  @keyframes leap{0%{transform:translateX(-50%) scaleX(-1) translateY(0)}45%{transform:translateX(-50%) scaleX(-1) translateY(-78px) rotate(-8deg)}100%{transform:translateX(-50%) scaleX(-1) translateY(0)}}
  .horse.stumble{animation:stb .3s}@keyframes stb{0%,100%{transform:translateX(-50%) scaleX(-1)}33%{transform:translateX(-54%) scaleX(-1) rotate(-8deg)}66%{transform:translateX(-50%) scaleX(-1) rotate(6deg)}}

  /* ===== Hürde als echtes Springturnier-Hindernis: zwei weiße Ständer auf Holzfüßen, drei bunte
     Stangen. Kein Emoji mehr — die Silhouette sagt ohne Text, was zu tun ist (P4). ===== */
  .hurdle{position:absolute;bottom:30%;width:52px;height:42px;transform:translateX(-50%);z-index:3;filter:drop-shadow(0 3px 3px rgba(0,0,0,.35))}
  .hurdle i{position:absolute;display:block}
  .hurdle .post{bottom:0;width:7px;height:100%;border-radius:3px;background:linear-gradient(90deg,#fff 0 55%,#dde5ee 55% 100%);box-shadow:inset 0 0 0 1px rgba(0,0,0,.14)}
  .hurdle .post.l{left:0}.hurdle .post.r{right:0}
  .hurdle .post::after{content:"";position:absolute;left:-4px;bottom:-3px;width:15px;height:5px;border-radius:2px;background:#8a6a44}
  .hurdle .bar{left:5px;right:5px;height:6px;border-radius:3px;box-shadow:inset 0 -2px 0 rgba(0,0,0,.14)}
  .hurdle .b1{bottom:10%;background:repeating-linear-gradient(90deg,#e0413a 0 8px,#fff 8px 16px)}
  .hurdle .b2{bottom:38%;background:repeating-linear-gradient(90deg,#2f6fd0 0 8px,#fff 8px 16px)}
  .hurdle .b3{bottom:66%;background:repeating-linear-gradient(90deg,#f0b429 0 8px,#fff 8px 16px)}
  /* sauber drüber: Hindernis bleibt STEHEN und blitzt gold — Umwerfen wäre im Springreiten ein Fehler */
  .hurdle.cleared{animation:clearHop .5s ease,clearGlow .5s ease}
  @keyframes clearHop{0%{transform:translateX(-50%)}30%{transform:translateX(-50%) translateY(-7px) scale(1.06)}100%{transform:translateX(-50%)}}
  @keyframes clearGlow{30%{filter:drop-shadow(0 0 9px gold) brightness(1.4)}100%{filter:drop-shadow(0 3px 3px rgba(0,0,0,.35))}}
  /* verpasst: die oberste Stange kippt — Springreit-Sprache, verständlich ohne Lesen */
  .hurdle.knocked .b3{transform-origin:left center;animation:knock .45s ease forwards}
  @keyframes knock{to{transform:rotate(24deg) translateY(9px);opacity:.9}}

  .plus1{position:absolute;font-size:22px;font-weight:900;color:#ffd34d;text-shadow:0 2px 5px rgba(0,0,0,.55);z-index:8;pointer-events:none;animation:plus1 .8s ease forwards}
  @keyframes plus1{0%{opacity:0;transform:translate(-50%,0) scale(.6)}22%{opacity:1;transform:translate(-50%,-16px) scale(1.15)}100%{opacity:0;transform:translate(-50%,-54px) scale(1)}}

  /* ===== Zieltor: fährt mit jedem geschafften Sprung ins Bild — das ist die Fortschrittsanzeige
     ohne Foto (Reveal-last: das Kinderfoto taucht im Spielfeld gar nicht mehr auf). ===== */
  .finish{position:absolute;bottom:30%;right:-16%;width:74px;height:80px;z-index:3;transition:right .5s ease}
  .finish .gpost{position:absolute;bottom:0;width:8px;height:74px;border-radius:3px;background:linear-gradient(90deg,#fff 0 50%,#e6ecf3 50% 100%);box-shadow:0 2px 5px rgba(0,0,0,.3)}
  .finish .gpost.l{left:0}.finish .gpost.r{right:0}
  .finish .gbar{position:absolute;top:0;left:0;right:0;height:19px;border-radius:4px;background:#fff;background-image:repeating-conic-gradient(#2e1c0a 0 25%,#fff 0 50%);background-size:10px 10px;box-shadow:0 2px 5px rgba(0,0,0,.3)}
  .finish .gtxt{position:absolute;top:23px;left:3px;right:3px;text-align:center;font-size:11px;font-weight:900;color:#fff;background:#c0392b;border-radius:4px;padding:2px 0;letter-spacing:1.5px}

  /* Sieger-Banner am Ziel — kurz, dann kommt automatisch die Einladung */
  .banner{position:absolute;left:50%;top:11%;transform:translateX(-50%) scale(.8);background:rgba(255,255,255,.96);color:#2e1c0a;font-weight:900;font-size:19px;padding:11px 20px;border-radius:16px;box-shadow:0 8px 22px rgba(0,0,0,.4);opacity:0;transition:opacity .35s ease,transform .45s cubic-bezier(.3,1.5,.5,1);z-index:9;white-space:nowrap;pointer-events:none}
  .banner.on{opacity:1;transform:translateX(-50%) scale(1)}

  /* Reveal — das Foto erscheint erst hier, auf der Einladung */
  .rosette{width:100%;background:linear-gradient(170deg,#fff3e2,#ffe0bd);color:var(--ink);border-radius:20px;padding:22px;box-shadow:0 14px 40px rgba(0,0,0,.45);text-align:center;border:4px solid var(--accent-dk);position:relative}
  .hero{width:148px;height:148px;border-radius:50%;margin:8px auto 6px;border:5px solid var(--accent);background-image:var(--photo);background-size:cover;background-position:center;background-color:#3a2a16;box-shadow:0 8px 20px rgba(0,0,0,.3);position:relative;animation:pop .6s cubic-bezier(.3,1.5,.5,1)}
  /* Kein Medaillen-Badge mehr am Foto-Rahmen (Hannes 15.08.) — das Bild soll fuer sich stehen. */
  @keyframes pop{from{transform:scale(.3) rotate(-8deg);opacity:0}to{transform:none;opacity:1}}
  .rosette h2{font-size:23px;margin:6px 0 2px}.rosette .who{font-size:17px;font-weight:800;color:var(--accent-dk)}
  .rosette dl{display:grid;grid-template-columns:auto 1fr;gap:8px 12px;text-align:left;margin:14px auto;max-width:240px;font-size:16px}.rosette dt{font-size:20px}.rosette dd{font-weight:700}
  .tapBtn{width:90%;max-width:320px}

  /* ===== prefers-reduced-motion: Erfolgssignale sichtbar halten (Stufe-2-MAJOR 2, 15.08.) =====
     core.css Z.64-73 setzt set-weit animation-duration:.001ms + iteration-count:1. Eine Animation
     OHNE "forwards" faellt damit sofort auf ihren Ausgangszustand zurueck und ist unsichtbar --
     und "forwards" hilft nur, wenn der LETZTE Keyframe sichtbar ist. In diesem Spiel traf beides
     zusammen ausgerechnet nur bei .hurdle.knocked zu (Endframe = gekippte Stange). Fuer ein Kind
     mit reduzierter Bewegung ueberlebte deshalb EINZIG das Fehlersignal, waehrend Sprung,
     Gold-Blitz, "+1", Stolpern und Jubel verschwanden -- die textfreie Anleitung fiel aus.
     Unten bekommt jedes dieser Signale einen statischen, sichtbaren ZUSTAND. Bewusst ohne
     Animation und ohne Transition, nur mit Eigenschaften, die core.css nicht ueberschreibt.
     Ausserhalb dieser Media-Query aendert sich nichts am Spiel.
     Konfetti bleibt ausgeblendet -- das ist Flacker-/Photosensitivitaetsschutz, kein Versehen. */
  @media (prefers-reduced-motion: reduce){
    /* Sprung: das Pferd steht sichtbar oben, solange .jump gesetzt ist (das JS nimmt die Klasse
       nach LEAP wieder weg). Aus "gar kein Sprung" wird ein deutlicher Hoehenwechsel. */
    .horse.jump{transform:translateX(-50%) scaleX(-1) translateY(-78px) rotate(-8deg)}
    /* Stolpern: sichtbare Schraeglage statt Wackeln */
    .horse.stumble{transform:translateX(-54%) scaleX(-1) rotate(-9deg)}
    /* Sauber uebersprungen: die Huerde BLEIBT angehoben und gold umrandet. Damit ist der Erfolg
       genauso dauerhaft ablesbar wie der Fehler an der gekippten Stange -- das war die Luecke. */
    .hurdle.cleared{transform:translateX(-50%) translateY(-7px);
      filter:drop-shadow(0 0 8px gold) drop-shadow(0 3px 3px rgba(0,0,0,.35)) brightness(1.22)}
    /* "+1" haengt sichtbar ueber der Huerde, bis das JS es nach 820 ms entfernt.
       !important ist hier noetig: plus1 laeuft mit "forwards" und eine gefuellte Animation
       schlaegt normale Deklarationen -- ihr Endframe ist opacity:0, also unsichtbar. */
    .plus1{opacity:1!important;transform:translate(-50%,-30px) scale(1.1)!important}
    /* Jubel: die Reihen ruecken einmal sichtbar hoch, statt zu wippen */
    .field.cheer .row{transform:translateY(-4px)}
    /* Idle-Hinweis aus core.js: statischer Ring statt Puls */
    #tippBtn.nudge{transform:scale(1.06);box-shadow:0 0 0 7px rgba(255,255,255,.4)}
  }
</style>

<body>
<div class="wrap">
  <!-- Intro auf EINER Seite: Icon, ein Satz Erklärung, Namensfeld, Start (Hannes 12.08.2026) -->
  <section class="scene on" id="s-intro">
    <div class="big">🐴</div>
    <h1>Hallo, ich bin Flo!</h1>
    <p class="sub" id="pText">…</p>
    <div id="introForm" style="width:100%;display:flex;flex-direction:column;align-items:center;gap:12px">
      <input id="gname" placeholder="Dein Name (optional)" maxlength="20" autocomplete="off" style="width:80%;max-width:240px;padding:11px 14px;border:0;border-radius:12px;font-size:16px;text-align:center;background:rgba(255,255,255,.92);color:#2a2a2a;outline:none">
      <button class="btn" id="startBtn">Aufs Pferd! 🏇</button>
    </div>
  </section>

  <section class="scene" id="s-game">
    <div class="hud"><span class="pill">Hürden 🏅 <b id="cl">0</b>/<b id="clmax">5</b></span></div>
    <div class="field" id="field">
      <div class="ground"></div>
      <div class="stand"><div class="row r1"></div><div class="row r2"></div><div class="row r3"></div><div class="rail"></div></div>
      <div class="zone"></div>
      <div id="track"></div>
      <div class="finish" id="finish"><i class="gbar"></i><i class="gtxt">ZIEL</i><i class="gpost l"></i><i class="gpost r"></i></div>
      <div class="horse" id="horse">🐎</div>
      <div class="banner" id="banner"></div>
    </div>
    <button class="btn tapBtn" id="jumpBtn">⬆ SPRUNG</button>
  </section>

  <section class="scene" id="s-win">
    <div class="rosette">
      <div class="hero"></div>
      <h2 id="winTitle">Turnier gewonnen!</h2>
      <p id="winWho" class="who">Komm zur Reiter-Party:</p>
      <dl><dt>📅</dt><dd id="wDate">Samstag, 11. Juli</dd><dt>🕒</dt><dd id="wTime">15:00 Uhr</dd><dt>📍</dt><dd id="wPlace">Reiterhof Sonnenweide</dd></dl>
      <button class="btn ja" id="rsvpBtn">🐴 Ich sattle mit!</button>
      <p class="note">(Demo — im Original geht die Zusage per WhatsApp an die Eltern)</p>
    </div>
  </section>
</div>
<div class="confetti" id="confetti"></div>
<script src="core/core.js?v=20260802"></script>
<script>
// Ohne-Foto-Default: eine junge Reiterin auf ihrem Pony (Hannes 12.08.2026) — Motiv mittig,
// damit es im runden .hero-Rahmen (background-size:cover) nicht angeschnitten wirkt.
const NOPHOTO="data:image/svg+xml,"+encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200' viewBox='0 0 200 200'><defs><linearGradient id='sky' x1='0' y1='0' x2='0' y2='1'><stop offset='0' stop-color='#9fd2f0'/><stop offset='1' stop-color='#e6f4fb'/></linearGradient><linearGradient id='gras' x1='0' y1='0' x2='0' y2='1'><stop offset='0' stop-color='#8fc267'/><stop offset='1' stop-color='#6ea348'/></linearGradient></defs><rect width='200' height='200' fill='url(#sky)'/><circle cx='166' cy='30' r='15' fill='#ffe9a3'/><circle cx='166' cy='30' r='9' fill='#ffd764'/><ellipse cx='42' cy='126' rx='58' ry='20' fill='#a8cf88' opacity='.75'/><ellipse cx='150' cy='128' rx='52' ry='17' fill='#a8cf88' opacity='.6'/><rect y='138' width='200' height='62' fill='url(#gras)'/><path d='M0 138 q26 -6 50 0 q26 6 52 0 q26 -6 50 0 q26 6 48 0 v6 H0z' fill='#7cb257'/><ellipse cx='100' cy='170' rx='58' ry='8' fill='#4d7a33' opacity='.28'/><path d='M112 106 q7 26 4 52 l1 8 h-13 l1 -8 q3 -26 -3 -52z' fill='#8a5330'/><path d='M96 118 q-5 22 -6 40 l-1 8 h13 l-1 -8 q2 -20 6 -38z' fill='#8a5330'/><rect x='103' y='163' width='14' height='7' rx='3' fill='#40290f'/><rect x='87' y='163' width='14' height='7' rx='3' fill='#40290f'/><path d='M56 100 q-16 4 -24 22 q-8 18 -4 34 q6 -16 14 -26 q8 -12 18 -16z' fill='#f2ddbe'/><path d='M54 104 q-12 8 -17 22 q-4 12 -3 22 q5 -14 12 -23 q6 -9 13 -13z' fill='#e2c79e'/><path d='M54 100 Q56 90 68 90 Q92 84 118 89 Q132 78 147 60 Q154 50 164 54 Q175 60 180 72 Q183 80 174 83 Q162 84 151 76 Q143 74 136 86 Q128 96 128 108 L133 112 Q136 134 132 156 L135 166 L123 166 L125 156 Q120 134 118 112 Q106 126 86 130 Q80 142 78 152 L80 166 L68 166 L64 152 Q58 140 64 126 Q56 114 54 100 Z' fill='#b0713c'/><path d='M120 114 q-14 14 -34 17 q-10 2 -18 0 q10 6 22 4 q20 -3 32 -15z' fill='#96602f' opacity='.55'/><path d='M64 126 q-6 -10 -2 -20 q4 12 10 18z' fill='#96602f' opacity='.5'/><path d='M54 100 Q56 90 68 90 Q92 84 118 89 Q132 78 147 60 Q154 50 164 54 Q175 60 180 72 Q183 80 174 83 Q162 84 151 76 Q143 74 136 86 Q128 96 128 108 L133 112 Q136 134 132 156 L135 166 L123 166 L125 156 Q120 134 118 112 Q106 126 86 130 Q80 142 78 152 L80 166 L68 166 L64 152 Q58 140 64 126 Q56 114 54 100 Z' fill='none' stroke='#5e3517' stroke-width='2.4' stroke-linejoin='round'/><path d='M123 166 h12 l1 5 h-14z' fill='#40290f'/><path d='M68 166 h12 l1 5 h-14z' fill='#40290f'/><path d='M118 89 q14 -10 27 -28 q8 -11 18 -7 q-6 5 -9 12 q-6 14 -16 24 q-9 9 -20 12z' fill='#f2ddbe'/><path d='M120 91 q12 -9 23 -25 q6 -9 13 -8 q-5 5 -8 11 q-6 13 -15 21 q-6 6 -13 8z' fill='#fbeed6'/><path d='M164 54 q9 1 12 8 q-8 -3 -14 1z' fill='#f2ddbe'/><path d='M166 56 q7 6 12 16 q3 6 -2 9 q-4 -12 -13 -20z' fill='#f6e6d2' opacity='.85'/><circle cx='164' cy='64' r='2.6' fill='#2a1a0c'/><ellipse cx='177' cy='78' rx='2.4' ry='1.8' fill='#5e3517'/><path d='M158 62 q10 6 15 16' stroke='#3f4a6b' stroke-width='2.6' fill='none' stroke-linecap='round'/><path d='M152 74 q10 4 18 6' stroke='#3f4a6b' stroke-width='2.4' fill='none' stroke-linecap='round'/><path d='M86 92 q16 -5 32 -1 l-3 14 q-14 -4 -27 0z' fill='#fdfdfb'/><path d='M86 92 q16 -5 32 -1 l-1 4 q-16 -4 -30 1z' fill='#3f4a6b'/><path d='M92 90 q12 -4 22 -1 q4 6 1 12 q-12 -3 -23 0 q-3 -6 0 -11z' fill='#7a4a22'/><path d='M170 80 q-22 2 -40 8' stroke='#4a2f14' stroke-width='2.2' fill='none' stroke-linecap='round'/><path d='M100 94 q10 4 15 14 l-4 3 q-6 -9 -14 -12z' fill='#efe9dd'/><path d='M110 110 q6 8 5 18 l-11 1 q1 -9 -3 -15z' fill='#22180d'/><path d='M104 126 h12 v6 h-13z' fill='#171008'/><path d='M96 66 q13 -3 19 10 l5 16 q-13 7 -26 1 l-2 -19z' fill='#c0392b'/><path d='M112 78 q11 3 18 10' stroke='#c0392b' stroke-width='9' fill='none' stroke-linecap='round'/><circle cx='131' cy='89' r='4.6' fill='#efe9dd'/><circle cx='99' cy='54' r='12' fill='#f7cfa6'/><path d='M88 60 q-8 6 -5 20 l8 2 q-4 -13 2 -19z' fill='#8a5a2b'/><path d='M113 55 q3 -20 -14 -20 q-17 0 -14 20z' fill='#2b3350'/><path d='M109 55 q12 0 16 6 q-11 4 -18 1z' fill='#1e2438'/><circle cx='105' cy='55' r='1.8' fill='#2a1a0c'/><path d='M99 61 q4 3 8 0' stroke='#b4523f' stroke-width='2' fill='none' stroke-linecap='round'/></svg>`);
const THEME={ photo:'/spiele/core/demo-kid.jpg' };
const HAS_PHOTO=setPhoto(THEME,NOPHOTO);
const CC=['#e0913a','#37c46e','#c0392b','#fff','#a8631a'];
const sfx={jump(){note(440,AC().currentTime,0.16,{type:'sine',vol:0.12,glideTo:780});},clear(){const t=AC().currentTime;note(660,t,0.1,{type:'triangle',vol:0.13});note(990,t+0.08,0.18,{type:'triangle',vol:0.12});},stumble(){noise(AC().currentTime,0.2,{vol:0.16,freq:200,filter:'lowpass'});},win(){const t=AC().currentTime;[523,659,784,1047,1319].forEach((f,i)=>note(f,t+i*0.1,0.34,{type:'triangle',vol:0.14}));},ding(){const t=AC().currentTime;note(880,t,0.12,{type:'sine',vol:0.15});note(1320,t+0.09,0.24,{type:'sine',vol:0.13});}};
// Alters-Staffel: jüngere Kinder = weniger Hürden, langsamer, breitere Zone, größere Spawn-Lücken.
// TOLERANZ +50% (Hannes-Playtest 12.08.2026): Zonenbreite 16/14/10 -> 24/21/15, das Zeitfenster
// wächst mit (SPEED unverändert): 565/350/200ms -> 847/525/300ms.
// LEAP koppelt Sprung und Hindernis: die Hürde braucht vom hinteren Zonenrand bis zum Pferd
// (HORSE_X) eine gewisse Zeit — ist der Sprung kürzer, steht das Pferd schon wieder, wenn die
// Hürde ankommt (war vor dem 12.08. bei U6 der Fall). Die Sprungdauer skaliert deshalb mit der
// Zone: Flugzeit hinterer Rand 847/525/300ms bleibt unter LEAP 1050/740/580ms.
// ZONE_LO nie unter HORSE_X — sonst zählt ein Tap, obwohl die Hürde schon am Pferd vorbei ist.
const HORSE_X=22;
const GOAL=(ageNum()<=6?4:ageNum()<=9?5:6), SPEED=(ageNum()<=6?1.7:ageNum()<=9?2.4:3.0), SPAWN=(ageNum()<=6?1600:ageNum()<=9?1300:1050), ZONE_LO=(ageNum()<=6?22:ageNum()<=9?24:26), ZONE_HI=(ageNum()<=6?46:ageNum()<=9?45:41), LEAP=(ageNum()<=6?1.05:ageNum()<=9?0.74:0.58);
document.documentElement.style.setProperty('--leapDur',LEAP+'s');
$('#pText').textContent='Wir reiten beim großen Turnier! Tippe ⬆ SPRUNG, wenn eine Hürde im hellen Feld ist — '+GOAL+' saubere Sprünge bis zum Ziel.';
let cleared=0, done=false, jumping=false, moveT=null, spawnT=null, spawnInitT=null, hurdles=[], winT=null, winAt=0;
// Fortschritt: das Zieltor rückt näher. Kein Foto-Teaser mehr im Spielfeld (reveal-last ist damit
// trivial erfüllt — das Kinderfoto erscheint ausschließlich auf der Einladung).
function progress(frac){ const f=Math.max(0,Math.min(1,frac)); const fi=$('#finish'); if(fi) fi.style.right=(-16+28*f).toFixed(1)+'%'; }
function spawnHurdle(){ if(done)return; const h=document.createElement('div'); h.className='hurdle'; h._x=106; h.style.left='106%'; h.innerHTML='<i class="post l"></i><i class="post r"></i><i class="bar b1"></i><i class="bar b2"></i><i class="bar b3"></i>'; $('#track').appendChild(h); hurdles.push(h); }
function stumble(){ $('#horse').classList.add('stumble'); setTimeout(()=>$('#horse').classList.remove('stumble'),300); sfx.stumble(); vib([10,30]); }
function pop1(x){ const p=document.createElement('div'); p.className='plus1'; p.textContent='+1 🏅'; p.style.left=(x||30)+'%'; p.style.bottom='58%'; $('#field').appendChild(p); setTimeout(()=>p.remove(),820); } // Score-Popup „+1" steigt an der übersprungenen Hürde auf
function moveHurdles(){ if(done)return; for(const h of hurdles.slice()){ h._x-=SPEED; h.style.left=h._x+'%'; if(!h._done && h._x<ZONE_LO && h._x>=ZONE_LO-6){ if(!jumping){ h._done='miss'; h.classList.add('knocked'); stumble(); } } if(h._x<-14){ h.remove(); const k=hurdles.indexOf(h); if(k>=0)hurdles.splice(k,1); } } } // Miss erst NACH Verlassen der Zone — sonst frisst das Miss-Band bei U6 sichtbare Sprungzone (Lektion lianen-F1)
function jump(){ if(done||jumping)return; jumping=true; $('#horse').classList.add('jump'); sfx.jump(); vib(10); setTimeout(()=>{ $('#horse').classList.remove('jump'); jumping=false; },LEAP*1000-30);
  const h=hurdles.find(x=>!x._done && x._x>=ZONE_LO && x._x<=ZONE_HI);
  if(h){ h._done='clear'; h.classList.add('cleared'); pop1(h._x); cleared++; $('#cl').textContent=cleared; progress(cleared/GOAL); sfx.clear(); vib([10,30]); if(cleared>=GOAL) winSeq(); } // sauberer Sprung: Hindernis bleibt stehen, +1-Punkt fliegt hoch
}
// Finale (Hannes 12.08.2026): kein Foto-Fangen mehr. Das Pferd galoppiert durchs Zieltor,
// das Publikum jubelt, Konfetti fällt — und danach kommt die Einladung von allein.
function winSeq(){ done=true; clearInterval(moveT); clearInterval(spawnT); clearTimeout(spawnInitT);
  $('#jumpBtn').style.visibility='hidden';
  $('#horse').style.left='70%'; // Zieleinlauf (transition left .7s)
  $('#field').classList.add('cheer');
  vib([20,40]);
  setTimeout(()=>{ if(!done)return; confetti(CC,{count:110,timeout:4200}); sfx.win(); vib([20,40,20,40,80]);
    const b=$('#banner'); b.textContent='Zieleinlauf — gewonnen! 🏅'; b.classList.add('on');
  },780); // erst wenn das Pferd wirklich an der Ziellinie steht
  winAt=Date.now();
  winT=setTimeout(showWin,3400); // No-Fail: die Einladung kommt automatisch, ohne dass getippt werden muss
}
function showWin(){ clearTimeout(winT);
  $('#winWho').textContent='Du hast das Turnier gewonnen — und '+kid()+' lädt dich zur Reiter-Party ein:'; // kein Genitiv: bei Namen auf s/x/z bricht sonst die Beugung
  guestName(); show('s-win');
}
// Tipp sichtbar: eine Hürde erscheint in der Zone und das Pferd springt sie echt
function tip(){ if(done)return; let h=hurdles.find(x=>!x._done && x._x>=ZONE_LO-6 && x._x<=ZONE_HI); if(!h) h=hurdles.find(x=>!x._done && x._x>ZONE_HI); if(!h){ spawnHurdle(); h=hurdles[hurdles.length-1]; } if(!h)return; h._x=(ZONE_LO+ZONE_HI)/2; h.style.left=h._x+'%'; jumping=false; $('#horse').classList.remove('jump'); jump(); }
// Start (AC() = iOS-Audio-Unlock per Geste)
$('#startBtn').addEventListener('click',()=>{ AC(); cleared=0;done=false;jumping=false; winAt=0; clearTimeout(winT); hurdles.forEach(h=>h.remove()); hurdles=[]; $('#cl').textContent=0; $('#clmax').textContent=GOAL; $('#banner').classList.remove('on'); $('#field').classList.remove('cheer'); [...document.querySelectorAll('#s-game button')].forEach(b=>b.style.visibility=''); const z=document.querySelector('.zone'); z.style.left=ZONE_LO+'%'; z.style.width=(ZONE_HI-ZONE_LO)+'%'; const ho=$('#horse'); ho.style.left=HORSE_X+'%'; progress(0); show('s-game'); clearInterval(moveT);clearInterval(spawnT);clearTimeout(spawnInitT); moveT=setInterval(moveHurdles,60); spawnT=setInterval(spawnHurdle,SPAWN); spawnInitT=setTimeout(spawnHurdle,400); }); // Initial-Spawn: kein Leerlauf; Timeout gecleart, damit Start-Doppeltipp keine Doppel-Hürde spawnt
$('#jumpBtn').addEventListener('click',jump);
$('#field').addEventListener('click',()=>{ if(done){ if(Date.now()-winAt>1400) showWin(); return; } jump(); }); // im Finale darf ein Tap die Einladung vorziehen — aber erst, wenn der Zieleinlauf gelaufen ist
$('#rsvpBtn').addEventListener('click',e=>{e.target.textContent='Zusage gesendet ✓';e.target.disabled=true;confetti(CC);sfx.ding();});
</script>
</body>
</html>
