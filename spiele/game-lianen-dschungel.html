<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Lianen-Schwung — Dschungel</title>
<link rel="stylesheet" href="core/core.css?v=20260708">
<style>
  /* E10 Liane-zu-Liane (Tarzan-Prinzip, Neubau 23.08.2026 auf Hannes-Wunsch):
     Die Lianen hängen fest am Ast und PENDELN. Der Affe greift eine, schwingt mit ihr hin und her,
     und am rechten Umkehrpunkt (grosszuegiges Zeitfenster, die Ziel-Liane leuchtet) traegt EIN Tap
     ihn zur naechsten. 3-5 mal, dann ins Baumhaus. Kein Scroll-Timing mehr. Auf Shared Core. */
  :root{--bg1:#13301a;--bg2:#3f6f3a;--fg:#fff;--accent:#f0a93a;--accent-dk:#b07414;--ink:#16240f}
  .field{position:relative;width:100%;aspect-ratio:1.25;border-radius:16px;overflow:hidden;background:linear-gradient(180deg,#a8d977 0%,#68a84e 16%,#3d7a37 42%,#1e4a22 74%,#0d2c14 100%);box-shadow:0 12px 30px rgba(0,0,0,.45);touch-action:manipulation}

  /* --- Kulisse: wir sind OBEN im Blaetterdach. Licht von oben, unter uns faellt der Wald in die Tiefe. --- */
  .rays{position:absolute;inset:0;background:repeating-linear-gradient(104deg,rgba(255,249,196,.16) 0 16px,transparent 16px 62px);mix-blend-mode:screen;pointer-events:none}
  .far{position:absolute;left:0;right:0;bottom:0;height:34%;background:
      radial-gradient(60px 26px at 12% 42%,#17401d 60%,transparent 61%),
      radial-gradient(76px 30px at 38% 60%,#12351a 60%,transparent 61%),
      radial-gradient(66px 26px at 64% 40%,#17401d 60%,transparent 61%),
      radial-gradient(88px 34px at 88% 62%,#102f16 60%,transparent 61%),
      linear-gradient(180deg,transparent,#08210f 78%);filter:blur(1.5px);opacity:.95} /* ferne Kronen TIEF unter uns */
  .haze{position:absolute;left:0;right:0;bottom:26%;height:16%;background:linear-gradient(180deg,transparent,rgba(200,230,190,.22),transparent);filter:blur(4px);pointer-events:none} /* Dunstschicht = Hoehengefuehl */
  .backLeaves{position:absolute;left:0;right:0;top:0;height:46%;background:
      radial-gradient(46px 22px at 8% 26%,rgba(31,86,38,.85) 62%,transparent 63%),
      radial-gradient(58px 26px at 30% 14%,rgba(24,72,32,.8) 62%,transparent 63%),
      radial-gradient(50px 24px at 52% 30%,rgba(31,86,38,.75) 62%,transparent 63%),
      radial-gradient(64px 28px at 74% 16%,rgba(24,72,32,.8) 62%,transparent 63%),
      radial-gradient(48px 22px at 94% 30%,rgba(31,86,38,.75) 62%,transparent 63%);filter:blur(1px)}

  #world{position:absolute;inset:0;will-change:transform}
  /* Der Ast, an dem ALLE Lianen haengen — er erklaert die Lianen, statt sie schweben zu lassen */
  .branch{position:absolute;left:-20%;right:-40%;top:9.4%;height:4.6%;background:linear-gradient(180deg,#8a5f34,#5f3f22 46%,#3d2815);border-radius:8px;box-shadow:0 5px 12px rgba(0,0,0,.45)}
  .branch::after{content:"";position:absolute;left:0;right:0;top:8%;height:22%;background:repeating-linear-gradient(90deg,rgba(255,255,255,.09) 0 3px,transparent 3px 11px)} /* Rinde */
  .twig{position:absolute;top:6.5%;font-size:30px;filter:drop-shadow(0 3px 3px rgba(0,0,0,.35));z-index:2} /* Blattbuescheln auf dem Ast */
  .perch{position:absolute;height:3.4%;width:15%;background:linear-gradient(180deg,#7a5230,#4a3120);border-radius:7px;box-shadow:0 4px 10px rgba(0,0,0,.4);z-index:2} /* Start-Ast */

  /* --- Lianen: haengen am Ast, pendeln um ihren Aufhaengepunkt --- */
  .vine{position:absolute;width:0;top:12.6%;height:37.5%;transform-origin:top center;z-index:3;pointer-events:none}
  .vine .rope{position:absolute;left:-3px;top:0;width:6px;height:100%;background:linear-gradient(180deg,#4a7c38,#6fae5a 40%,#54903f);border-radius:3px;box-shadow:0 0 3px rgba(0,0,0,.35)}
  .vine .knot{position:absolute;left:0;top:100%;transform:translate(-50%,-46%);font-size:30px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.4));transition:transform .2s}
  .vine.hot .knot{animation:knotPulse .5s ease-in-out infinite} /* JETZT springen: das Ziel leuchtet + pulsiert */
  .vine.hot .ring{opacity:1;animation:ringPulse .8s ease-out infinite}
  .vine .ring{position:absolute;left:0;top:100%;width:56px;height:56px;transform:translate(-50%,-46%);border-radius:50%;border:4px solid var(--accent);opacity:0;box-shadow:0 0 16px 4px rgba(240,169,58,.55)}
  @keyframes knotPulse{50%{transform:translate(-50%,-46%) scale(1.28)}}
  @keyframes ringPulse{0%{transform:translate(-50%,-46%) scale(.85);opacity:.95}100%{transform:translate(-50%,-46%) scale(1.5);opacity:0}}
  .vine.used .rope{opacity:.5}
  .vine.used .knot{opacity:.65}

  /* --- Der Affe --- */
  .swinger{position:absolute;font-size:42px;z-index:6;filter:drop-shadow(0 4px 5px rgba(0,0,0,.45));transform:translate(-50%,-50%);will-change:left,top}
  .swinger.miss{animation:ms .32s}
  @keyframes ms{0%,100%{filter:drop-shadow(0 4px 5px rgba(0,0,0,.45))}40%{filter:drop-shadow(0 4px 5px rgba(0,0,0,.45)) brightness(1.5) saturate(.4)}}
  .swinger.ready{animation:rdy .5s ease-in-out infinite} /* im Zeitfenster holt er sichtbar aus */
  @keyframes rdy{50%{font-size:48px}}

  /* --- Baumhaus in der Ferne: kommt naeher, je mehr Lianen geschafft sind --- */
  .hut{position:absolute;top:14%;right:-16%;font-size:40px;z-index:4;transition:right .7s ease,font-size .7s ease;filter:drop-shadow(0 4px 6px rgba(0,0,0,.4))}
  .hut.goalOn{animation:hutPulse .55s ease-in-out infinite} /* letzter Sprung: das Ziel selbst ist die Affordanz */
  @keyframes hutPulse{50%{filter:drop-shadow(0 4px 6px rgba(0,0,0,.4)) drop-shadow(0 0 12px rgba(240,169,58,.95))}}
  /* Baumhaus-Guckloch: wer wartet da oben? Foto tritt pro Liane aus dem Schatten (Reveal an Mechanik gekoppelt) */
  .hutphoto{position:absolute;top:23%;right:-14%;width:78px;height:78px;border-radius:50%;border:5px solid #7a5230;box-shadow:0 4px 12px rgba(0,0,0,.4),inset 0 0 10px rgba(0,0,0,.4);background-image:var(--photo);background-size:cover;background-position:center;background-color:#16240f;opacity:0;filter:blur(16px) saturate(.5) brightness(.55);transition:opacity .5s ease,filter .5s ease,right .7s ease;pointer-events:none;z-index:5}

  /* Vordergrund-Blaetter: wir stecken MITTEN im Blaetterdach */
  .fg{position:absolute;font-size:64px;pointer-events:none;z-index:7;opacity:.9;filter:drop-shadow(0 4px 8px rgba(0,0,0,.4))}
  .fg.l{left:-14px;top:-10px;transform:rotate(24deg)}
  .fg.r{right:-16px;bottom:-8px;transform:rotate(-150deg)}

  /* Story-Outro: Kokos Reaktion auf dem Reveal, bevor die Karte kommt */
  .storyOut{position:absolute;left:50%;bottom:7%;transform:translateX(-50%);background:rgba(255,255,255,.94);color:#16240f;font-weight:800;font-size:15px;padding:10px 16px;border-radius:14px;box-shadow:0 6px 16px rgba(0,0,0,.35);opacity:0;transition:opacity .4s ease .7s;z-index:9;max-width:88%;text-align:center;pointer-events:none}
  .storyOut.on{opacity:1}
  .storyOut.on::after{content:" ▸";opacity:.65;animation:blinkA 1.2s infinite} /* Tap-Affordanz: weiter per Tipp */
  @keyframes blinkA{50%{opacity:.15}}

  /* Magic-Moment (C1 Medaillon-Standard wie Piraten-Familie/Turm): der geheime Dschungel-Boss LANDET
     mittig im Blaetterlicht und wackelt -> EIN Tap oeffnet ihn. Blur NUR aufs Foto (::before, 15px),
     Goldring + Glow scharf. No-Fail: 5s-Auto-Oeffnen. */
  .magicFly{position:absolute;left:50%;top:42%;width:112px;height:112px;margin:-56px 0 0 -56px;border-radius:50%;border:5px solid var(--accent);overflow:hidden;opacity:0;transform:scale(.4);transition:opacity .3s;z-index:10;pointer-events:none;cursor:pointer;box-shadow:0 0 24px 5px rgba(240,169,58,.5)}
  .magicFly::before{content:"";position:absolute;inset:-8px;border-radius:50%;background-image:var(--photo);background-size:cover;background-position:center;background-color:#16240f;filter:blur(15px);transition:filter .55s}
  .magicFly.landed{opacity:1;pointer-events:auto;animation:mland 1s ease-in-out infinite}
  .magicFly.caught{opacity:1;pointer-events:none;animation:none;box-shadow:0 6px 20px rgba(0,0,0,.35),0 0 30px 8px rgba(240,169,58,.65);transition:transform .5s cubic-bezier(.3,1.4,.5,1);transform:scale(1.5)}
  .magicFly.caught::before{filter:blur(0)}
  .magicFly.caught.joy{animation:mjoy .5s ease-in-out 4}
  @keyframes mland{0%,100%{transform:scale(1) rotate(-4deg)}25%{transform:scale(1.06) rotate(3deg)}50%{transform:scale(1.09) rotate(-2deg)}75%{transform:scale(1.06) rotate(4deg)}}
  @keyframes mjoy{0%,100%{transform:scale(1.5)}50%{transform:scale(1.62) translateY(-12px)}}
  .mhint{position:absolute;left:50%;top:6%;transform:translateX(-50%);background:rgba(22,36,15,.85);color:#eaffd6;font-weight:800;font-size:14px;padding:6px 14px;border-radius:16px;opacity:0;transition:opacity .3s;z-index:11;pointer-events:none;width:max-content;max-width:86%;text-align:center} /* kein nowrap: auf 320er-Feldern muss die Anleitung umbrechen statt gekappt zu werden */
  .mhint.on{opacity:1}

  /* Reveal */
  .invite{width:100%;background:linear-gradient(170deg,#f2fbe8,#d6efbf);color:var(--ink);border-radius:20px;padding:22px;box-shadow:0 14px 40px rgba(0,0,0,.45);text-align:center;border:4px solid var(--accent-dk);position:relative}
  .hero{width:148px;height:148px;border-radius:50%;margin:6px auto 6px;border:5px solid var(--accent);background-image:var(--photo);background-size:cover;background-position:center;background-color:#16240f;box-shadow:0 8px 20px rgba(0,0,0,.3);position:relative;animation:pop .6s cubic-bezier(.3,1.5,.5,1)}
  @keyframes pop{from{transform:scale(.3) rotate(-8deg);opacity:0}to{transform:none;opacity:1}}
  .invite h2{font-size:23px;margin:6px 0 2px}.invite .who{font-size:17px;font-weight:800;color:var(--accent-dk)}
  .invite dl{display:grid;grid-template-columns:auto 1fr;gap:8px 12px;text-align:left;margin:14px auto;max-width:240px;font-size:16px}.invite dt{font-size:20px}.invite dd{font-weight:700}
  .tapBtn{width:90%;max-width:320px}
</style>
</head>
<body>
<div class="wrap">
  <section class="scene on" id="s-intro">
    <div class="big" id="pIcon">🐒</div>
    <h1 id="pTitle">Psst — ich bin Koko!</h1>
    <p class="sub" id="pText">…</p>
    <button class="btn" id="nextPan">Weiter ▸</button>
    <button class="btn" id="skipPan" style="background:rgba(255,255,255,.16);font-size:14px;padding:8px 20px">Überspringen ▸▸</button>
    <div id="introForm" style="width:100%;flex-direction:column;align-items:center;gap:12px;display:none">
      <input id="gname" placeholder="Dein Name (optional)" maxlength="20" autocomplete="off" style="width:80%;max-width:240px;padding:11px 14px;border:0;border-radius:12px;font-size:16px;text-align:center;background:rgba(255,255,255,.92);color:#2a2a2a;outline:none">
      <button class="btn" id="startBtn">Los geht's! 🌿</button>
    </div>
  </section>

  <section class="scene" id="s-game">
    <div class="hud"><span class="pill">Lianen 🌿 <b id="cl">0</b>/<b id="clmax">4</b></span></div>
    <div class="field" id="field">
      <div class="backLeaves"></div>
      <div class="rays"></div>
      <div class="haze"></div>
      <div class="far"></div>
      <div id="world">
        <div class="branch"></div>
        <div class="perch" id="perch"></div>
        <div id="vines"></div>
      </div>
      <div class="hut" id="hut">🛖</div>
      <div class="hutphoto" id="hutphoto"></div>
      <div class="swinger" id="swinger">🐒</div>
      <div class="fg l">🌿</div>
      <div class="fg r">🌿</div>
      <div class="storyOut" id="storyOut"></div>
      <div class="magicFly" id="magicFly"></div>
      <div class="mhint" id="mhint"></div>
    </div>
    <button class="btn tapBtn" id="swingBtn">🐒 SPRINGEN</button>
  </section>

  <section class="scene" id="s-win">
    <div class="invite">
      <div class="hero"></div>
      <h2 id="winTitle">Im Baumhaus!</h2>
      <p id="winWho" class="who">Im Baumhaus angekommen! Komm zur Dschungel-Party:</p>
      <dl><dt>📅</dt><dd id="wDate">Samstag, 11. Juli</dd><dt>🕒</dt><dd id="wTime">15:00 Uhr</dd><dt>📍</dt><dd id="wPlace">Im Garten-Dschungel</dd></dl>
      <button class="btn ja" id="rsvpBtn">🌴 Ich schwinge mit!</button>
      <p class="note">(Demo — im Original geht die Zusage per WhatsApp an die Eltern)</p>
    </div>
  </section>
</div>
<div class="confetti" id="confetti"></div>
<script src="core/core.js?v=20260802"></script>
<script>
const NOPHOTO="data:image/svg+xml,"+encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><rect width='200' height='200' fill='#3f6f3a'/><path d='M40 30 q10 60 0 140 M160 30 q-10 60 0 140' stroke='#2f5e2a' stroke-width='6' fill='none'/><g fill='#6fae5a'><ellipse cx='40' cy='60' rx='16' ry='8'/><ellipse cx='160' cy='90' rx='16' ry='8'/><ellipse cx='40' cy='120' rx='16' ry='8'/></g><circle cx='100' cy='96' r='30' fill='#7a5230'/><circle cx='100' cy='90' r='22' fill='#caa078'/><circle cx='91' cy='88' r='4' fill='#3a2412'/><circle cx='109' cy='88' r='4' fill='#3a2412'/><path d='M92 100 q8 7 16 0' stroke='#3a2412' stroke-width='3' fill='none'/><circle cx='74' cy='86' r='9' fill='#7a5230'/><circle cx='126' cy='86' r='9' fill='#7a5230'/></svg>`);
const THEME={ photo:'/spiele/core/demo-kid.jpg' };
const HAS_PHOTO=setPhoto(THEME,NOPHOTO);
const CC=['#f0a93a','#37c46e','#6fae5a','#fff','#b07414'];
const sfx={
  grab(){const t=AC().currentTime;note(520,t,0.1,{type:'triangle',vol:0.13});note(780,t+0.07,0.16,{type:'triangle',vol:0.12});},
  fly(){note(380,AC().currentTime,0.22,{type:'sine',vol:0.12,glideTo:820});},
  miss(){noise(AC().currentTime,0.18,{vol:0.12,freq:200,filter:'lowpass'});},
  win(){const t=AC().currentTime;[523,659,784,1047,1319].forEach((f,i)=>note(f,t+i*0.1,0.34,{type:'triangle',vol:0.14}));},
  ding(){const t=AC().currentTime;note(880,t,0.12,{type:'sine',vol:0.15});note(1320,t+0.09,0.24,{type:'sine',vol:0.13});}
};

/* Alters-Staffel: juengere Kinder = weniger Lianen, langsameres Pendel, breiteres Zeitfenster.
   Das Fenster ist bewusst grosszuegig — die Mechanik soll Rhythmus belohnen, nicht Reflexe. */
const GOAL =(ageNum()<=6?3:ageNum()<=9?4:5);      // so viele Lianen bis zum Baumhaus
const PER  =(ageNum()<=6?2600:ageNum()<=9?2100:1700); // Pendel-Periode in ms (hin UND zurueck)
const WINF =(ageNum()<=6?0.42:ageNum()<=9?0.34:0.27); // Fensterbreite als Anteil der Halbperiode
/* Geometrie in Prozent des Spielfelds. Weil das Feld aspect-ratio 1.25 hat, entspricht
   1% Breite genau 1,25% Hoehe -> LX/LY sind dieselbe echte Lianenlaenge in beiden Achsen. */
const AMP=40, LX=30, LY=37.5, BRY=12.6, GAP=56, FIRST=52, FLY=430;
const vineX=i=>FIRST+i*GAP;
const rad=d=>d*Math.PI/180;

// Story-Intro (Pilot): Koko fuehrt in 3 tippbaren Panels zur Mission — vorlesefreundlich, ueberspringbar
// Falsche Faehrte fuers Twist-Finale: Der „Boss" klingt streng-geheimnisvoll — und ist dann der beste Freund
const PANELS=[
  {i:'🐒',t:'Psst — ich bin Koko!',x:'Hoch oben im Blätterdach wohnt der geheime Dschungel-Boss. Niemand hat den Boss je gesehen!'},
  {i:'🛖',t:'Streng geheim!',x:'Man sagt: Der Boss lässt nur die allerbesten Kletterer zu sich hoch …'},
  {i:'🌿',t:'Schwing mit mir!',x:'Tippe, wenn die leuchtende Liane zu dir schwingt — und oben am Wendepunkt wieder, dann fliegst du zur nächsten!'}
];
const GUEST=(()=>{ const s=(new URLSearchParams(location.search).get('g')||'').trim(); return s.length<=20?s:''; })(); // Gastname fuer den Twist-Beat; >20 Zeichen verwerfen statt kuerzen (konsistent mit guestName in core.js)
let pIdx=0;
function showPan(){ const p=PANELS[pIdx]; $('#pIcon').textContent=p.i; $('#pTitle').textContent=p.t; $('#pText').textContent=p.x; const last=pIdx>=PANELS.length-1; $('#nextPan').style.display=last?'none':''; $('#skipPan').style.display=last?'none':''; $('#introForm').style.display=last?'flex':'none'; }
$('#nextPan').addEventListener('click',()=>{ AC(); pIdx=Math.min(pIdx+1,PANELS.length-1); showPan(); vib(6); });
$('#skipPan').addEventListener('click',()=>{ AC(); pIdx=PANELS.length-1; showPan(); });
showPan();

let vines=[], cur=-1, cleared=0, done=false, magicPhase=false;
let mode='perch', flight=null, camX=0, camT=0, tickT=null, finT=null;

function buildScene(){
  const box=$('#vines'); box.innerHTML=''; vines=[];
  for(let i=0;i<GOAL;i++){
    const v=document.createElement('div'); v.className='vine'; v.style.left=vineX(i)+'%';
    v.innerHTML='<div class="rope"></div><div class="ring"></div><div class="knot">🌿</div>';
    box.appendChild(v); vines.push(v);
  }
  // Blattbueschel auf dem Ast: erklaeren, dass die Lianen an EINEM Ast haengen
  [...document.querySelectorAll('#world .twig')].forEach(e=>e.remove());
  for(let i=0;i<GOAL+2;i++){
    const t=document.createElement('div'); t.className='twig'; t.textContent='🌿';
    t.style.left=(FIRST-34+i*GAP*0.72)+'%'; $('#world').appendChild(t);
  }
  $('#perch').style.left=(vineX(0)-34)+'%'; $('#perch').style.top='48%';
}

/* Pendel: Winkel = -AMP * cos(2pi * tau / PER). tau=0 -> ganz LINKS (beim Affen bzw. Greifmoment),
   tau=PER/2 -> ganz RECHTS (Absprung Richtung naechste Liane). */
function tau(v,now){ let x=(now-v._t0)%PER; if(x<0)x+=PER; return x; }
function ang(v,now){ return -AMP*Math.cos(2*Math.PI*tau(v,now)/PER); }
function knotPos(i,a){ return { x:vineX(i)+LX*Math.sin(rad(a)), y:BRY+LY*Math.cos(rad(a)) }; }
/* Zeitfenster: beim Sitzen auf dem Ast zaehlt der LINKE Umkehrpunkt (Liane kommt zu mir),
   beim Haengen der RECHTE (von dort traegt der Schwung zur naechsten Liane). */
function inWin(v,now,right){ const x=tau(v,now), h=WINF*PER/2; return right ? Math.abs(x-PER/2)<h : (x<h||x>PER-h); }
function target(){ return mode==='perch' ? vines[0] : vines[cur]; }
function winOpen(now){ const v=target(); return !!v && !done && !flight && inWin(v,now,mode==='swing'); }

function tick(){
  const now=performance.now();
  for(let i=0;i<vines.length;i++) vines[i].style.transform='rotate('+ang(vines[i],now).toFixed(2)+'deg)';
  camX+=(camT-camX)*0.16; $('#world').style.transform='translateX('+(-camX).toFixed(2)+'%)';
  const sw=$('#swinger'); let px,py,tilt=0;
  if(flight){
    const p=Math.min(1,(now-flight.t)/FLY);
    const to=flight.hut?flight.to:knotPos(flight.i,-AMP);
    px=flight.from.x+(to.x-flight.from.x)*p;
    py=flight.from.y+(to.y-flight.from.y)*p-flight.arc*Math.sin(Math.PI*p);
    tilt=18*Math.sin(Math.PI*p);
    if(p>=1){ const f=flight; flight=null; f.hut?reachHut():grab(f.i,now); }
  } else if(mode==='swing'){
    const a=ang(vines[cur],now); const k=knotPos(cur,a); px=k.x; py=k.y+2.4; tilt=a*0.55;
  } else {
    px=vineX(0)-30; py=45.4;
  }
  sw.style.left=(px-camX).toFixed(2)+'%'; sw.style.top=py.toFixed(2)+'%';
  sw.style.transform='translate(-50%,-50%) rotate('+tilt.toFixed(1)+'deg)';
  const open=winOpen(now);
  const hotV=open?(mode==='swing'?(cur+1<GOAL?vines[cur+1]:null):vines[0]):null;
  for(let i=0;i<vines.length;i++) vines[i].classList.toggle('hot',vines[i]===hotV);
  sw.classList.toggle('ready',open);
  $('#hut').classList.toggle('goalOn',open&&mode==='swing'&&cur+1>=GOAL);
}

function grab(i,now){
  cur=i; mode='swing'; vines[i]._t0=now; vines[i].classList.add('used');
  cleared=i+1; $('#cl').textContent=cleared; sharpen(cleared/GOAL); sfx.grab(); vib([10,26]);
  camT=vineX(i)-30;
  /* Die naechste Liane wird JETZT auf Empfang gestellt: sie ist bei jeder moeglichen Ankunft
     (Absprung PER/2 + FLY, auch eine Runde spaeter) gerade links ausgeschwungen. */
  if(i+1<GOAL) vines[i+1]._t0=now+PER/2+FLY;
}
function launch(toIdx,now){
  const from=mode==='swing'?knotPos(cur,ang(vines[cur],now)):{x:vineX(0)-30,y:45.4};
  flight={t:now,from:from,i:toIdx,arc:9,hut:false}; mode='fly'; sfx.fly(); vib(10);
}
function launchHut(now){
  const from=knotPos(cur,ang(vines[cur],now));
  camT=vineX(cur)-30;
  flight={t:now,from:from,to:{x:camT+86,y:20},arc:13,hut:true}; mode='fly'; sfx.fly(); vib([10,30]);
}
function reachHut(){ mode='done'; winSeq(); }
function stumble(){ const sw=$('#swinger'); sw.classList.remove('miss'); void sw.offsetWidth; sw.classList.add('miss'); setTimeout(()=>sw.classList.remove('miss'),320); sfx.miss(); vib([8,24]); }

function jump(){
  if(magicPhase){ catchMagic(); return; }
  if(done||flight) return;
  const now=performance.now();
  if(!winOpen(now)){ stumble(); return; } // Fehltipp kostet NICHTS — nur Feedback, kein Rueckschritt
  if(mode==='perch'){ launch(0,now); return; }
  if(cur+1<GOAL) launch(cur+1,now); else launchHut(now);
}

function sharpen(frac){ const p=$('#hutphoto'); if(!p||magicPhase)return; const f=Math.max(0,Math.min(1,frac));
  p.style.opacity=(f<=0?0:Math.min(0.28,0.15+0.4*f*f)).toFixed(2);
  p.style.filter='blur('+Math.max(15,17*(1-f*f)).toFixed(1)+'px) saturate('+(0.5+0.3*f).toFixed(2)+') brightness('+(0.55+0.25*f).toFixed(2)+')';
  p.style.right=(-14+20*f).toFixed(1)+'%';
  const hu=$('#hut'); if(hu){ hu.style.right=(-16+24*f).toFixed(1)+'%'; hu.style.fontSize=(40+26*f).toFixed(0)+'px'; } }
  // GEDECKELT auf den Haus-Standard: Guckloch bleibt unscharfe Silhouette (opacity<=.28 / blur>=15px)
  // -> scharf erst beim Tap aufs Medaillon (reveal-last); Baumhaus kommt trotzdem sichtbar naeher

function kidCap(){ const k=kid(); return k.charAt(0).toUpperCase()+k.slice(1); } // Fallback 'das Geburtstagskind' satzinitial gross
function guestNow(){ const f=document.getElementById('gname'); const v=((f&&f.value)||'').trim(); return (v&&v.length<=20)?v:GUEST; } // gleiche Praezedenz wie guestName(): Namensfeld vor URL-Param; >20 verwerfen wie core.js

let outroStep=0, outroT=null, beat2='', winAt=0;
function advanceOutro(){ if(!outroStep || Date.now()-winAt<900)return; clearTimeout(outroT); winAt=Date.now(); // Grace-Fenster: Reflex-Taps nach dem Sieg duerfen die Story-Beats nicht ueberspringen
  if(outroStep===1){ outroStep=2; $('#storyOut').textContent=beat2; vib(8); outroT=setTimeout(advanceOutro,14000); }
  else { outroStep=0; show('s-win'); } } // Tap-getaktet (Fallback: Beat 1 11s, Beat 2 14s — laengster Beat 2 hat 11 Woerter, 60-WpM-Leser brauchen Puffer)

function winSeq(){ done=true; clearInterval(tickT); tickT=null; // KEIN sharpen(1) -> der Boss landet unscharf, scharf erst beim Tap (reveal-last)
  $('#hutphoto').style.opacity='0'; // Guckloch aus: der Boss verlaesst das Fenster und landet gleich vorne
  $('#swingBtn').style.visibility='hidden'; // Sprung-Button weg; Feld bleibt Tap-Flaeche
  $('#swinger').classList.remove('ready'); vines.forEach(v=>v.classList.remove('hot'));
  vib([20,40]); // Affe und Baumhaus bleiben stehen — Koko kommentiert gleich den Reveal
  setTimeout(()=>{
    const mf=$('#magicFly'); mf.classList.add('landed'); magicPhase=true; // C1: landet + wackelt, EIN Tap oeffnet
    mf.addEventListener('click',catchMagic,{once:true});
    finT=setTimeout(()=>{ if(magicPhase)catchMagic(); },5000); // No-Fail: oeffnet sich von selbst
    const mh=$('#mhint'); if(mh){ mh.textContent='Der geheime Dschungel-Boss ist da — tipp ihn an!'; mh.classList.add('on'); }
  }, 560);
}
function catchMagic(){ if(!magicPhase)return; magicPhase=false; clearTimeout(finT);
  const mf=$('#magicFly'); mf.classList.remove('landed'); mf.classList.add('caught'); const mh=$('#mhint'); if(mh)mh.classList.remove('on'); sfx.win(); note(440,AC().currentTime,0.5,{type:'sine',vol:0.1,glideTo:880}); confetti(CC); vib([20,40,20,40,80]);
  setTimeout(()=>mf.classList.add('joy'),560);
  setTimeout(startOutro,1500); // nach dem Fang: Tap-getaktete Story-Beats
}
function startOutro(){ const g=guestNow(); const so=$('#storyOut');
  if(HAS_PHOTO && !document.documentElement.hasAttribute('data-photo-failed')){ so.textContent='Koko staunt: Der Dschungel-Boss ist '+kid()+'! 🎉'; beat2=kidCap()+' lacht: „Na endlich'+(g?', '+g:'')+'! Ich hab schon auf dich gewartet!“'; } // Beat 1 Identitaet, Beat 2 Rollenumkehr
  else { so.textContent='Koko staunt: Du hast den Boss gefunden — ein freches Äffchen! 🎉'; beat2='Und oben wartet schon die Dschungel-Party'+(g?' auf dich, '+g:'')+'!'; } // nofoto: DU hast geklettert, Boss-Raetsel aufgeloest
  so.classList.add('on'); winAt=Date.now(); outroStep=1; outroT=setTimeout(advanceOutro,11000);
  if(HAS_PHOTO && !document.documentElement.hasAttribute('data-photo-failed')){ $('#winWho').textContent=`Das Baumhaus-Fenster öffnet sich weit — drinnen strahlt der Dschungel-Boss: ${kid()}! Komm zur Dschungel-Party:`; } else { $('#winTitle').textContent='Im Baumhaus!'; $('#winWho').textContent=`Du hast den Dschungel geschafft — und oben wartet ein freches Äffchen! ${kidCap()} lädt dich zur Dschungel-Party ein:`; } guestName(); }

/* No-Fail-Netz (core.js ruft tip() bei Idle ~18s und als Floor ab 30s):
   dreht die Ziel-Liane auf ihr Zeitfenster und springt sichtbar — jeder Aufruf ist garantiert +1. */
function tip(){ if(magicPhase)return; /* Medaillon oeffnet nur per Tap oder 5s-Timer — das Netz kuerzt die Choreografie nicht ab */
  if(done)return;
  const now=performance.now();
  if(flight)return; // mitten im Flug: der laufende Sprung bringt den Fortschritt ohnehin
  const v=target(); if(!v)return;
  v._t0 = (mode==='swing') ? now-PER/2 : now; // exakt ins Fenster drehen
  jump(); }

$('#startBtn').addEventListener('click',()=>{ AC();
  cleared=0; done=false; cur=-1; mode='perch'; flight=null; magicPhase=false; outroStep=0;
  clearTimeout(outroT); clearTimeout(finT); clearInterval(tickT);
  $('#magicFly').classList.remove('landed','caught','joy'); $('#mhint').classList.remove('on'); $('#storyOut').classList.remove('on');
  [...document.querySelectorAll('#s-game button')].forEach(b=>b.style.visibility='');
  const rb=$('#rsvpBtn'); if(rb){ rb.disabled=false; rb.textContent='🌴 Ich schwinge mit!'; } // Demo-Replay: Zusage-Knopf war sonst dauerhaft abgehakt
  buildScene();
  const now=performance.now();
  vines.forEach((v,i)=>{ v.classList.remove('used','hot'); v._t0=now+1100-i*260; }); // erstes Fenster erst nach ~1s: Kind sieht das Pendel, bevor es zaehlt
  $('#cl').textContent=0; $('#clmax').textContent=GOAL;
  $('#hutphoto').style.opacity=''; sharpen(0);
  camX=vineX(0)-52; camT=camX;
  $('#swinger').classList.remove('ready','miss');
  show('s-game');
  tickT=setInterval(tick,30); tick(); });
$('#swingBtn').addEventListener('click',jump);
$('#field').addEventListener('click',()=>{ if(magicPhase){ catchMagic(); return; } if(done && outroStep){ advanceOutro(); } else { jump(); } }); // magicPhase: Feld faengt den Boss; im Finale taktet der Tap die Story-Beats
$('#rsvpBtn').addEventListener('click',e=>{e.target.textContent='Zusage gesendet ✓';e.target.disabled=true;confetti(CC);sfx.ding();});
</script>
