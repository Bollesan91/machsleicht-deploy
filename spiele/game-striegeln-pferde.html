<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Pony striegeln — Pferde</title>
<link rel="stylesheet" href="core/core.css?v=20260708">
<style>
  /* E1 Wischen: ein schmutziges Pony steht da, Dreckflecken werden mit der Bürste weggestriegelt,
     bei jedem Strich staubt es. Sauber -> Konfetti -> Einladung. (Hannes 13.08.2026)
     Das Kinderfoto liegt NICHT mehr unter dem Dreck — es erscheint erst auf der Einladung,
     genau wie bei huerden und hufeisen. Damit entfällt auch der ganze faceguard-Mechanismus. */
  :root{--bg1:#4a3220;--bg2:#b58a5a;--fg:#fff;--accent:#b9783f;--accent-dk:#8a5424;--ink:#3a2412}
  .meter{width:100%;max-width:280px;height:14px;border-radius:999px;background:rgba(0,0,0,.25);overflow:hidden}
  .meter .fill{height:100%;width:0%;background:linear-gradient(90deg,#e0a23a,#b9783f);transition:width .12s}
  .board{position:relative;width:100%;aspect-ratio:1;border-radius:16px;overflow:hidden;box-shadow:0 12px 30px rgba(0,0,0,.4);background:var(--pony) center/cover no-repeat,#c8a878;touch-action:none;cursor:none}
  .board canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
  /* Staubwölkchen bei jedem Strich */
  .puff{position:absolute;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;pointer-events:none;z-index:3;background:radial-gradient(circle,rgba(196,168,126,.8),rgba(196,168,126,0) 70%);animation:puff .75s ease-out forwards}
  @keyframes puff{0%{opacity:0;transform:scale(.35)}22%{opacity:.95}100%{opacity:0;transform:scale(2.3) translateY(-22px)}}
  /* Die Bürste folgt dem Finger — macht ohne ein Wort klar, was zu tun ist */
  .brush{position:absolute;width:52px;height:34px;margin:-24px 0 0 -26px;pointer-events:none;z-index:4;opacity:0;transition:opacity .18s;transform-origin:50% 30%}
  .brush.on{opacity:1}
  .brush .back{position:absolute;left:0;right:0;top:0;height:15px;border-radius:8px 8px 5px 5px;background:linear-gradient(180deg,#b5813f,#7d5426);box-shadow:0 2px 5px rgba(0,0,0,.5),inset 0 2px 0 rgba(255,225,180,.35)}
  .brush .bris{position:absolute;left:4px;right:4px;top:14px;height:18px;background:repeating-linear-gradient(90deg,#3f2b16 0 2px,transparent 2px 5px);border-radius:0 0 3px 3px}
  .board.wipe .brush{animation:wig .18s ease-in-out infinite alternate}
  @keyframes wig{from{transform:rotate(-7deg)}to{transform:rotate(7deg)}}
  /* Finale: das saubere Fell blitzt einmal auf */
  .shine{position:absolute;inset:0;pointer-events:none;z-index:5;opacity:0;background:linear-gradient(115deg,transparent 35%,rgba(255,248,214,.85) 50%,transparent 65%)}
  .board.done .shine{animation:shine 1s ease-out forwards}
  @keyframes shine{0%{opacity:0;transform:translateX(-60%)}35%{opacity:1}100%{opacity:0;transform:translateX(60%)}}
  /* Reveal */
  .invite{width:100%;background:linear-gradient(170deg,#fdf6ec,#f0dcc2);color:var(--ink);border-radius:20px;padding:22px;box-shadow:0 14px 40px rgba(0,0,0,.4);text-align:center;border:3px solid var(--accent-dk)}
  .hero{width:140px;height:140px;border-radius:50%;margin:0 auto 6px;border:5px solid var(--accent);background-image:var(--photo);background-size:cover;background-position:center;background-color:#2a1c10;box-shadow:0 8px 20px rgba(0,0,0,.3);position:relative;animation:pop .6s cubic-bezier(.3,1.5,.5,1)}
  @keyframes pop{from{transform:scale(.3) rotate(8deg);opacity:0}to{transform:none;opacity:1}}
  .invite h2{font-size:23px;margin:6px 0 2px}.invite .who{font-size:17px;font-weight:800;color:var(--accent-dk)}
  .invite dl{display:grid;grid-template-columns:auto 1fr;gap:8px 12px;text-align:left;margin:14px auto;max-width:240px;font-size:16px}.invite dt{font-size:20px}.invite dd{font-weight:700}
</style>
</head>
<body>
<div class="wrap">
  <section class="scene on" id="s-intro">
    <div class="big">🧽</div>
    <h1>Striegel das Pony blank!</h1>
    <p class="sub" id="pText">…</p>
    <input id="gname" placeholder="Dein Name (optional)" maxlength="20" autocomplete="off" style="width:80%;max-width:240px;padding:11px 14px;border:0;border-radius:12px;font-size:16px;text-align:center;background:rgba(255,255,255,.92);color:#2a2a2a;outline:none">
    <button class="btn" id="startBtn">Bürste schnappen 🧽</button>
  </section>

  <section class="scene" id="s-game">
    <div class="meter"><div class="fill" id="fill"></div></div>
    <div class="board" id="board">
      <canvas id="dust"></canvas>
      <div class="shine"></div>
      <div class="brush" id="brush"><i class="back"></i><i class="bris"></i></div>
    </div>
    <p class="sub" id="hint">Wisch mit dem Finger über die Dreckflecken!</p>
  </section>

  <section class="scene" id="s-win">
    <div class="invite">
      <div class="hero"></div>
      <h2 id="winTitle">Blitzeblank!</h2>
      <p class="who" id="winWho">Komm zur Pferde-Party:</p>
      <dl><dt>📅</dt><dd id="wDate">Samstag, 11. Juli</dd><dt>🕒</dt><dd id="wTime">15:00 Uhr</dd><dt>📍</dt><dd id="wPlace">Auf dem Reiterhof</dd></dl>
      <button class="btn ja" id="rsvpBtn">🐎 Ich reite mit!</button>
      <p class="note">(Demo — im Original geht die Zusage per WhatsApp an die Eltern)</p>
    </div>
  </section>
</div>
<div class="confetti" id="confetti"></div>
<script src="core/core.js?v=20260802"></script>
<script>
// Das Pony im Spielfeld: Seitenansicht, formatfüllend. Es ist das SPIELOBJEKT, nicht der Reveal —
// deshalb liegt hier bewusst kein Kinderfoto mehr darunter.
const PONY="data:image/svg+xml,"+encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300' viewBox='0 0 300 300'> <defs> <linearGradient id='fell' x1='0' y1='0' x2='0' y2='1'> <stop offset='0' stop-color='#e6b87f'/><stop offset='.5' stop-color='#d09758'/><stop offset='1' stop-color='#ab763e'/> </linearGradient> <linearGradient id='wand' x1='0' y1='0' x2='0' y2='1'> <stop offset='0' stop-color='#6f5f52'/><stop offset='1' stop-color='#8a7462'/> </linearGradient> <linearGradient id='stroh' x1='0' y1='0' x2='0' y2='1'> <stop offset='0' stop-color='#e0c078'/><stop offset='1' stop-color='#c8a253'/> </linearGradient> <radialGradient id='licht' cx='.5' cy='.18' r='.8'> <stop offset='0' stop-color='#fff3d0' stop-opacity='.55'/><stop offset='1' stop-color='#fff3d0' stop-opacity='0'/> </radialGradient> <radialGradient id='vig' cx='.5' cy='.45' r='.75'> <stop offset='.55' stop-color='#000' stop-opacity='0'/><stop offset='1' stop-color='#2b1c0e' stop-opacity='.38'/> </radialGradient> </defs> <rect width='300' height='300' fill='url(#wand)'/> <g opacity='.5'> <rect y='34' width='300' height='3' fill='#4f4239'/><rect y='80' width='300' height='3' fill='#4f4239'/> <rect y='126' width='300' height='3' fill='#4f4239'/><rect y='172' width='300' height='3' fill='#4f4239'/> <rect x='52' width='3' height='212' fill='#4f4239'/><rect x='196' width='3' height='212' fill='#4f4239'/> </g> <g opacity='.22' stroke='#3f342c' stroke-width='1.5' fill='none'> <path d='M8 16 q40 5 82 -2'/><path d='M96 60 q52 6 96 -3'/><path d='M20 106 q60 6 110 -4'/> <path d='M120 152 q60 5 108 -3'/><path d='M14 196 q50 5 96 -3'/> </g> <g> <rect x='212' y='24' width='72' height='56' rx='3' fill='#7fb8dd'/> <rect x='212' y='52' width='72' height='28' fill='#8cc46a'/> <circle cx='266' cy='40' r='10' fill='#fff4bd'/> <path d='M212 56 q22 -8 44 -2 q16 4 28 0 l0 6 q-16 4 -30 0 q-20 -5 -42 3z' fill='#7ba85c'/> <rect x='212' y='24' width='72' height='56' rx='3' fill='none' stroke='#5a4a3c' stroke-width='6'/> <rect x='245' y='24' width='5' height='56' fill='#5a4a3c'/> </g> <rect width='300' height='300' fill='url(#licht)'/> <rect y='236' width='300' height='64' fill='url(#stroh)'/> <g opacity='.55' stroke='#a8853c' stroke-width='2.5' stroke-linecap='round'> <path d='M10 250 l24 -6'/><path d='M48 264 l26 -7'/><path d='M92 246 l22 -6'/><path d='M130 268 l26 -6'/> <path d='M172 250 l24 -7'/><path d='M214 266 l26 -6'/><path d='M252 248 l26 -7'/><path d='M66 284 l24 -6'/> <path d='M158 286 l24 -6'/><path d='M238 286 l24 -6'/> </g> <ellipse cx='148' cy='256' rx='104' ry='12' fill='#9c7a38' opacity='.35'/> <g fill='#9a6c39' stroke='#5b3d21' stroke-width='3.5' stroke-linejoin='round'> <path d='M122 178 C 118 202, 120 220, 120 242 L 140 242 C 140 220, 138 202, 142 178 Z'/> <path d='M158 176 C 154 200, 156 220, 156 242 L 176 242 C 176 220, 174 200, 178 176 Z'/> </g> <g fill='#33240f'><rect x='117' y='238' width='26' height='14' rx='5'/><rect x='153' y='238' width='26' height='14' rx='5'/></g> <path d='M50 118 C 30 132, 20 162, 24 194 C 26 214, 32 232, 42 244 C 38 218, 40 192, 48 172 C 55 154, 60 134, 60 120 Z' fill='#5b3d21' stroke='#3f2914' stroke-width='3' stroke-linejoin='round'/> <path d='M54 124 C 40 140, 33 164, 34 190 C 35 208, 39 222, 45 232 C 43 210, 46 188, 52 172 C 57 158, 61 140, 61 128 Z' fill='#7a5430'/> <path d='M168 104 C 186 88, 208 68, 228 56 C 234 52, 240 48, 246 46 C 254 44, 264 48, 272 58 C 282 70, 290 84, 293 94 C 295 101, 291 106, 284 105 C 276 104, 266 99, 258 92 C 252 87, 247 82, 243 78 C 236 86, 228 98, 222 112 C 216 126, 212 144, 208 162 C 207 172, 206 178, 206 184 C 206 202, 208 222, 208 242 L 188 242 C 188 222, 186 202, 186 184 C 168 189, 140 190, 112 187 C 112 205, 110 223, 110 242 L 90 242 C 90 223, 88 205, 86 186 C 66 180, 52 163, 48 142 C 44 122, 50 108, 64 100 C 90 86, 140 88, 168 104 Z' fill='url(#fell)' stroke='#5b3d21' stroke-width='4' stroke-linejoin='round'/> <path d='M170 106 C 186 122, 194 144, 190 166 C 187 178, 180 185, 172 188 C 182 177, 186 161, 184 145 C 182 129, 177 114, 170 106 Z' fill='#b8814a' opacity='.5'/> <path d='M64 102 C 52 114, 48 130, 52 147 C 56 160, 64 172, 74 179 C 62 168, 56 154, 55 139 C 54 122, 58 110, 64 102 Z' fill='#b8814a' opacity='.42'/> <path d='M92 181 C 112 191, 150 192, 182 185 C 190 183, 197 180, 202 176 C 196 188, 172 195, 140 196 C 112 197, 96 191, 92 181 Z' fill='#9c6b36' opacity='.5'/> <g fill='#f4e8d2'><rect x='91' y='228' width='19' height='13' rx='4'/><rect x='189' y='228' width='19' height='13' rx='4'/></g> <g fill='#33240f' stroke='#241806' stroke-width='2'> <rect x='87' y='238' width='26' height='15' rx='6'/><rect x='185' y='238' width='26' height='15' rx='6'/> </g> <path d='M91 202 q9 4 18 0' stroke='#8a5e34' stroke-width='3' fill='none' stroke-linecap='round' opacity='.55'/> <path d='M189 202 q9 4 18 0' stroke='#8a5e34' stroke-width='3' fill='none' stroke-linecap='round' opacity='.55'/> <path d='M238 52 C 234 40, 234 30, 238 24 C 244 30, 249 40, 249 52 Z' fill='#c68d51' stroke='#5b3d21' stroke-width='3' stroke-linejoin='round'/> <path d='M240 48 C 239 41, 239 35, 241 31 C 244 36, 245 43, 245 49 Z' fill='#7d5528'/> <path d='M254 44 C 254 32, 258 24, 264 20 C 267 28, 265 38, 260 48 Z' fill='#c68d51' stroke='#5b3d21' stroke-width='3' stroke-linejoin='round'/> <path d='M256 42 C 256 35, 258 30, 261 27 C 262 33, 261 39, 259 44 Z' fill='#7d5528'/> <path d='M252 52 C 260 56, 270 70, 278 86 C 281 92, 281 98, 278 99 C 274 90, 266 74, 256 60 C 253 56, 251 53, 252 52 Z' fill='#f7ead4' opacity='.9'/> <ellipse cx='256' cy='68' rx='6' ry='7' fill='#2a1a0c'/> <circle cx='258' cy='65.5' r='2' fill='#fff' opacity='.92'/> <path d='M249 62 q7 -5 13 -1' stroke='#5b3d21' stroke-width='2.5' fill='none' stroke-linecap='round'/> <ellipse cx='285' cy='92' rx='4.5' ry='3.4' fill='#8a5e34' transform='rotate(28 285 92)'/> <path d='M276 100 q7 3 10 -1' stroke='#8a5e34' stroke-width='2' fill='none' stroke-linecap='round'/> <path d='M240 50 C 222 62, 202 84, 188 108 C 180 122, 176 134, 174 146 C 166 132, 168 114, 176 100 C 188 78, 212 58, 236 46 Z' fill='#5b3d21' stroke='#3f2914' stroke-width='3' stroke-linejoin='round'/> <path d='M232 56 C 216 70, 200 92, 190 114 C 186 104, 188 90, 194 80 C 203 66, 218 57, 232 56 Z' fill='#7a5430'/> <path d='M206 92 C 196 106, 188 124, 185 140 C 179 130, 180 114, 185 104 C 190 95, 198 91, 206 92 Z' fill='#5b3d21'/> <path d='M246 34 C 240 40, 236 46, 235 53 C 242 46, 250 42, 257 42 C 254 37, 250 34, 246 34 Z' fill='#5b3d21' stroke='#3f2914' stroke-width='2.5' stroke-linejoin='round'/> <path d='M84 104 C 112 94, 146 94, 166 102' stroke='#f0c992' stroke-width='7' fill='none' stroke-linecap='round' opacity='.4'/> <rect width='300' height='300' fill='url(#vig)'/> </svg>`);
document.documentElement.style.setProperty('--pony','url("'+PONY+'")');
// Ohne-Foto-Default auf der Einladung: ein Kind im Reit-Outfit mit Striegel in der Hand
// (gleiche Bauart wie bei huerden und hufeisen).
const NOPHOTO="data:image/svg+xml,"+encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><rect width='200' height='200' fill='#b58a5a'/><g opacity='.45'><rect y='36' width='200' height='4' fill='#8a5a30'/><rect y='86' width='200' height='4' fill='#8a5a30'/><rect y='136' width='200' height='4' fill='#8a5a30'/></g><rect y='158' width='200' height='42' fill='#a8843f'/><ellipse cx='100' cy='186' rx='52' ry='8' fill='#7a5f28' opacity='.4'/><rect x='89' y='92' width='22' height='30' rx='7' fill='#eab98d'/><path d='M62 180 q-4 -46 12 -64 l52 0 q16 18 12 64z' fill='#4a7c59'/><rect x='78' y='150' width='18' height='32' rx='6' fill='#2f3b57'/><rect x='104' y='150' width='18' height='32' rx='6' fill='#2f3b57'/><rect x='74' y='174' width='24' height='11' rx='4' fill='#1d1409'/><rect x='102' y='174' width='24' height='11' rx='4' fill='#1d1409'/><circle cx='100' cy='74' r='27' fill='#f6cda3'/><path d='M73 74 q-3 -34 27 -34 q30 0 27 34z' fill='#2b3350'/><path d='M127 74 q13 1 18 8 q-16 6 -26 2z' fill='#1e2438'/><path d='M73 78 q-11 8 -8 28 l11 3 q-4 -18 5 -25z' fill='#8a5a2b'/><circle cx='91' cy='76' r='2.8' fill='#2a1a0c'/><circle cx='109' cy='76' r='2.8' fill='#2a1a0c'/><path d='M93 86 q7 5 14 0' stroke='#b5453c' stroke-width='3' fill='none' stroke-linecap='round'/><path d='M74 120 q-9 15 -3 28 l15 -2 q-5 -12 2 -22z' fill='#4a7c59'/><path d='M126 120 q9 15 3 28 l-15 -2 q5 -12 -2 -22z' fill='#4a7c59'/><rect x='72' y='140' width='40' height='15' rx='6' fill='#b5813f'/><rect x='75' y='153' width='34' height='9' fill='#3f2b16'/><circle cx='120' cy='146' r='8' fill='#f6cda3'/></svg>`);
const THEME={ photo:'/spiele/core/demo-kid.jpg' };
const HAS_PHOTO=setPhoto(THEME,NOPHOTO);
const CC=['#b9783f','#37c46e','#e0a23a','#fff','#8a5424'];
let lastBrush=0;
const sfx={brush(){const t=AC().currentTime;if(t-lastBrush<0.05)return;lastBrush=t;noise(t,0.06,{vol:0.05,freq:1100+Math.random()*600});},find(){const t=AC().currentTime;note(520,t,0.1,{type:'sine',vol:0.12});note(780,t+0.08,0.16,{type:'sine',vol:0.12});},win(){const t=AC().currentTime;[523,659,784,1047].forEach((f,i)=>note(f,t+i*0.1,0.34,{type:'triangle',vol:0.15}));},ding(){const t=AC().currentTime;note(880,t,0.12,{type:'sine',vol:0.15});note(1320,t+0.09,0.24,{type:'sine',vol:0.13});}};
const RES=300;
// Alters-Staffel: jüngere Kinder = weniger Flecken, dickere Bürste, frühere Schwelle
// R muss KLEINER sein als ein Fleck, sonst putzt ein einziger Strich das halbe Pony
// (gemessen: mit R=38 brachte ein Wisch 60 % — das Spiel wäre nach zwei Strichen vorbei).
const R=(ageNum()<=6?20:ageNum()<=9?17:14), GOAL_ER=(ageNum()<=6?0.72:ageNum()<=9?0.82:0.9), NSPOT=(ageNum()<=6?9:ageNum()<=9?12:15);
// Dreckflecken sitzen AUF dem Pony (Körper, Hals, Kopf, Beine, Schweif) — in % des Boards.
// Reihenfolge so, dass die ersten 9 schon gut übers ganze Pony verteilt sind (Young-Slice).
// Jede Position gegen das gerenderte Pony geprüft (Canvas-Raster): alle 17 sitzen auf Fell,
// Hals, Kopf, Bein oder Schweif — keine im Stroh oder an der Wand. Die ersten 9 (Young-Slice)
// sind bewusst übers ganze Tier gestreut, damit auch die kurze Runde nach „überall Dreck" aussieht.
const SPOT_ALL=[[82,14],[70,24],[24,34],[48,44],[40,56],[14,44],[66,46],[28,62],[30,72],
                [86,28],[38,34],[60,34],[30,46],[10,58],[62,60]];
let cv,ctx,drawing=false,done=false,erased=0,spots=[],samples=[],lastPuff=0,moveCount=0,tipIdx=0;
$('#pText').textContent='Das Pony hat sich im Schlamm gewälzt! Fahr mit dem Finger über die Dreckflecken — bei jedem Strich staubt es, bis das Fell wieder glänzt.';
function fillDirt(){
  cv.width=RES;cv.height=RES;
  ctx.globalCompositeOperation='source-over';ctx.clearRect(0,0,RES,RES); // KEINE Flächenfüllung: man soll das Pony sehen
  spots=[];samples=[];
  const cl=v=>Math.max(0,Math.min(RES-1,Math.round(v)));
  SPOT_ALL.slice(0,NSPOT).forEach(([px,py],i)=>{
    const cx=px/100*RES, cy=py/100*RES, base=22+((i*7)%9);
    spots.push({x:cx,y:cy,r:base+9});
    // unregelmäßiger Klecks aus mehreren versetzten Kreisen — sieht nach Schlamm aus, nicht nach Punkt
    for(let k=0;k<5;k++){
      const a=k*1.257+i, d=k?base*0.55:0, rx=cx+Math.cos(a)*d, ry=cy+Math.sin(a)*d, rr=base*(k?0.62:1);
      ctx.fillStyle='rgba('+(92+((i*13)%34))+','+(66+((i*11)%26))+',38,.93)';
      ctx.beginPath();ctx.arc(rx,ry,rr,0,7);ctx.fill();
    }
    // Messpunkte über die GANZE Fleckfläche verteilen (Mitte + Ring), nicht nur in der Mitte:
    // sonst zählt ein Tap ins Zentrum den Fleck sofort als sauber und man muss nie striegeln.
    samples.push({x:cl(cx),y:cl(cy)});
    for(let k=0;k<8;k++){ const a=k*Math.PI/4;
      samples.push({x:cl(cx+Math.cos(a)*base*0.85),y:cl(cy+Math.sin(a)*base*0.85)}); }
    // ein paar Spritzer drumherum
    for(let k=0;k<4;k++){ const a=k*1.9+i*0.7, d=base*1.15, sx=cx+Math.cos(a)*d, sy=cy+Math.sin(a)*d;
      ctx.fillStyle='rgba(84,60,34,.8)';ctx.beginPath();ctx.arc(sx,sy,3.2,0,7);ctx.fill(); }
  });
  done=false;erased=0;$('#fill').style.width='0%';$('#board').classList.remove('done');
}
function ptToCanvas(ev){const r=cv.getBoundingClientRect();return [((ev.clientX-r.left)/r.width)*RES,((ev.clientY-r.top)/r.height)*RES];}
function erodeAt(x,y){ctx.globalCompositeOperation='destination-out';ctx.fillStyle='#000';ctx.beginPath();ctx.arc(x,y,R,0,7);ctx.fill();} // fillStyle HIER setzen: destination-out radiert mit der Quell-Deckkraft
// Staubwölkchen: nur wenn an der Stelle wirklich noch Dreck sitzt, und höchstens alle 100ms —
// sonst wären es bei jedem Pointermove Dutzende.
function puff(x,y){
  const t=Date.now(); if(t-lastPuff<100)return;
  if(!spots.some(s=>Math.hypot(s.x-x,s.y-y)<s.r+R*0.6))return;
  lastPuff=t;
  const d=document.createElement('i');d.className='puff';
  d.style.left=(x/RES*100)+'%';d.style.top=(y/RES*100)+'%';
  $('#board').appendChild(d);setTimeout(()=>d.remove(),780);
}
// Fortschritt wird NUR an den Dreckstellen gemessen (nicht über das ganze Board) — sonst wäre
// das Spiel von Anfang an fast "sauber", weil der größte Teil der Fläche nie Dreck trug.
function progress(){
  if(!samples.length)return;
  const img=ctx.getImageData(0,0,RES,RES).data;let clear=0;
  for(const p of samples){ if(img[(p.y*RES+p.x)*4+3]<40) clear++; }
  erased=clear/samples.length;$('#fill').style.width=Math.round(erased*100)+'%';
  if(erased>=GOAL_ER && !done) reveal();
}
function reveal(){
  done=true;sfx.find();vib([20,40,20]);
  ctx.globalCompositeOperation='destination-out';ctx.fillStyle='#000';ctx.fillRect(0,0,RES,RES); // letzte Reste weg
  $('#board').classList.add('done');$('#brush').classList.remove('on');
  $('#hint').textContent='✨ Das Fell glänzt!';$('#fill').style.width='100%';
  setTimeout(()=>{ $('#winTitle').textContent='Blitzeblank gestriegelt!';
    $('#winWho').textContent='Das Pony glänzt von Mähne bis Huf — und '+kid()+' lädt dich zur Pferde-Party ein:'; // kein Genitiv
    guestName();show('s-win');confetti(CC);sfx.win();vib([20,40,20,40,80]); },1150);
}
// No-Fail: jeder Druck putzt einen kompletten Fleck weg (mit Staubwolke) — nach NSPOT Drücken
// ist garantiert gelöst, auch für ein völlig passives Kind. core.js hängt den Hilfe-Knopf an.
function tip(){ if(done||!ctx)return;
  const s=spots[tipIdx%spots.length];tipIdx++;
  if(s){ ctx.globalCompositeOperation='destination-out';ctx.fillStyle='#000';
    ctx.beginPath();ctx.arc(s.x,s.y,s.r+R*0.5,0,7);ctx.fill();
    lastPuff=0;puff(s.x,s.y); }
  sfx.brush();vib(6);progress();
}
function moveBrush(x,y){ const b=$('#brush'); b.style.left=(x/RES*100)+'%'; b.style.top=(y/RES*100)+'%'; b.classList.add('on'); }
function onMove(ev){ if(done)return; ev.preventDefault();
  const[x,y]=ptToCanvas(ev); moveBrush(x,y);
  if(!drawing)return;
  erodeAt(x,y);puff(x,y);sfx.brush();
  if(++moveCount%6===0){vib(4);progress();}
}
function initBoard(){
  cv=$('#dust');ctx=cv.getContext('2d',{willReadFrequently:true});fillDirt();
  cv.onpointerdown=e=>{drawing=true;$('#board').classList.add('wipe');cv.setPointerCapture&&cv.setPointerCapture(e.pointerId);const[x,y]=ptToCanvas(e);moveBrush(x,y);erodeAt(x,y);puff(x,y);};
  cv.onpointermove=onMove;
  cv.onpointerup=cv.onpointercancel=()=>{drawing=false;$('#board').classList.remove('wipe');progress();};
  cv.onpointerleave=()=>{ $('#brush').classList.remove('on'); };
}
$('#startBtn').addEventListener('click',()=>{AC();tipIdx=0;moveCount=0;$('#board').classList.remove('done','wipe');$('#brush').classList.remove('on');show('s-game');setTimeout(initBoard,30);$('#hint').textContent='Wisch mit dem Finger über die Dreckflecken!';});
$('#rsvpBtn').addEventListener('click',e=>{e.target.textContent='Zusage gesendet ✓';e.target.disabled=true;confetti(CC);sfx.ding();});
</script>
