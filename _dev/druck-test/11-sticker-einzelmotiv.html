<!doctype html><html><head><meta charset="utf-8"><style>

   STICKER-SLOT — den Bogen legt der Dienst selbst. Diese Datei rendert EINE

.rand{position:absolute;inset:22px;border:8px solid #c9a227;border-radius:34px;pointer-events:none;}
.kopf{margin-top:0;font-size:38px;letter-spacing:.26em;text-transform:uppercase;color:#8b2635;opacity:.85;}
.name{font-size:116px;font-weight:700;margin-top:6px;max-width:82%;text-align:center;}
.sterne{font-size:56px;letter-spacing:.3em;padding-left:.3em;color:#c9a227;margin-top:4px;}
</style></head><body>
