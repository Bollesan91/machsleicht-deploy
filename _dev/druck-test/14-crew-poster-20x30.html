<!doctype html><html><head><meta charset="utf-8"><style>
/* Crew-Poster 20x30 fuers Geburtstagskind (2:3, 1800x2700 — dieselbe Datei
   traegt 20x30 mit 228dpi, ok fuer Wandabstand lt. Spec §2). Die ganze Crew
   mit Rollen — das Erinnerungs-Artefakt fuer die Kinderzimmer-Wand. */
html,body{margin:0;padding:0;width:1800px;height:2700px;overflow:hidden;}
body{font-family:Georgia,serif;}
.p{position:relative;width:1800px;height:2700px;color:#3a3226;
   background:radial-gradient(ellipse at 50% 22%,#f7efdc 0%,#f0e4c8 55%,#e4d4ae 100%);
   display:flex;flex-direction:column;align-items:center;}
.r1{position:absolute;inset:80px;border:7px solid #c9a227;}
.r2{position:absolute;inset:104px;border:2px solid #8b2635;}
.kopf{margin-top:190px;font-size:40px;letter-spacing:.44em;color:#b08a1e;text-transform:uppercase;}
.titel{font-size:118px;font-weight:700;margin-top:26px;letter-spacing:.02em;max-width:82%;text-align:center;line-height:1.1;}
.datum{font-size:42px;margin-top:24px;letter-spacing:.3em;color:#8b2635;text-transform:uppercase;}
.mitte{flex:1;display:flex;align-items:center;}
.grid{display:grid;grid-template-columns:repeat(2,660px);gap:110px 110px;}
.held{display:flex;align-items:center;gap:44px;}
/* align-items:flex-start ist LOAD-BEARING fuer den Auto-Fit: mit default
   stretch erben kurze Namen die Blockbreite der langen Rollen-Zeile und
   scrollWidth misst Container statt Text — der Fit schrumpfte "Tino" auf 12px. */
.held .txt{display:flex;flex-direction:column;align-items:flex-start;}
.held .n{font-size:84px;font-weight:700;line-height:1.05;}
.held .r{font-size:34px;letter-spacing:.12em;text-transform:uppercase;color:#6d5a34;margin-top:10px;}
.held .s{font-size:32px;letter-spacing:.28em;color:#c9a227;margin-top:8px;}
.fuss{position:absolute;bottom:120px;font-size:28px;letter-spacing:.3em;opacity:.45;}
</style></head><body>
<div class="p"><div class="r1"></div><div class="r2"></div>
  <div class="kopf">Ritterfest von Tino</div>
  <div class="titel">Die Helden von Burg Sonnenfels</div>
  <div class="datum">22. August 2026</div>
  <div class="mitte"><div class="grid" id="grid"></div></div>
  <div class="fuss">MACHSLEICHT.DE</div>
</div>
<script>
var CREW=[['Tino','Burgherr von Sonnenfels'],['Emma','Banner-Trägerin'],['Mats','Burg-Wächter'],['Lina','Drachen-Späherin'],
          ['Noah','Katapult-Meister'],['Ida','Schild-Trägerin'],['Paul','Turm-Bauer'],['Frida','Fackel-Hüterin']];
var W='<svg width="195" height="213" viewBox="0 0 330 360" style="flex:none">'
 +'<defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#dcb84e"/><stop offset="1" stop-color="#b08a1e"/></linearGradient></defs>'
 +'<path d="M25,18 H305 V180 Q305,290 165,344 Q25,290 25,180 Z" fill="url(#g)"/>'
 +'<path d="M37,30 H293 V176 Q293,278 165,330 Q37,278 37,176 Z" fill="#8b2635"/>'
 +'<g transform="translate(102,90) scale(0.24)"><path d="M258.094 18.5c-74.34 0-138.073 62.498-156.188 148.438 52.758-7.697 102.23-22.044 153.938-45.094l4.125-1.813 3.967 2.064c49.424 25.667 97.648 41.026 150.657 46.406-17.66-86.744-81.71-150-156.5-150zm1.28 122.156c-57.41 25.148-112.883 39.993-172.53 47 6.724 32.847 6.91 65.935-.5 98.938 89.29 41.602 231.648 43.154 340.594-.125-10.762-32.516-11.727-65.66-1.188-98.408-59.03-4.235-112.628-20.06-166.375-47.406zm-13.5 33.125h18.72v127.75h-18.72V173.78zm-58.78 11.19h18.687v101.655h-18.686V184.97zm115.72 0h18.686v101.655h-18.688V184.97zm-171.72 14.905h18.687v79.28h-18.686v-79.28zm227.72 0h18.686v79.28h-18.688v-79.28zm38.748 116.75c-14.302 4.282-28.96 7.873-43.78 10.844l-19.22 64.06c26.114-17.337 48.002-43.31 63-74.905zm-277.53 2.875c13.95 28.257 33.448 51.85 56.562 68.53l-17.688-58.905c-13.397-2.61-26.387-5.826-38.875-9.625zm213.156 11.656c-51.63 8.175-104.745 8.588-153.72 1.438l20.845 69.5c18 8.52 37.49 13.187 57.78 13.187 18.588 0 36.507-3.92 53.22-11.124l21.875-73zm-195.5 47.156c-19.436 21.562-36.416 44.367-48.594 72.157 70.233-8.736 133.743 14.684 168.03 50.75 39.684-35.607 103.71-55.685 170.876-44.25-15.08-29.372-33.32-51.982-53.938-74-31.187 31.75-71.53 51-115.968 51-46.568 0-88.65-21.142-120.406-55.658z" fill="#f2e8d0"/></g></svg>';
var g=document.getElementById('grid');
CREW.forEach(function(k){
  g.insertAdjacentHTML('beforeend','<div class="held">'+W+'<div class="txt"><div class="n">'+k[0]+'</div><div class="r">'+k[1]+'</div><div class="s">★★★★★</div></div></div>');
});
document.querySelectorAll('.n,.r').forEach(function(el){
  var max=415; el.style.whiteSpace='nowrap';
  var fs=parseFloat(getComputedStyle(el).fontSize);
  while(el.scrollWidth>max&&fs>12){fs-=2;el.style.fontSize=fs+'px';}
});
</script></body></html>
